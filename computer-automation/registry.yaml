# Computer Automation Domain Registry
# Source of Truth for: a UI surface's identity / path / facet / platform / how it can
# be driven / what is blocked / when it was last verified / which assets drive it.
#
# What this Domain is: the Store's record of "a third party's interface, and how we
# know it works". Its assets are SURFACES, not scripts and not skills — those stay in
# procedures/ and skills/, and this Domain points at them via `driven_by`.
#
# Why it is a Domain rather than a field on skills/procedures (both were considered):
# it is the only asset class in the Store that a third party can invalidate SILENTLY.
# An API change returns an error; a CLI change returns an error; a UI change returns
# nothing at all and the script keeps running while doing the wrong thing. That is not
# hypothetical — deepseek-invoice 0.1.2 fixed exactly this shape: an unreadable amount
# became 0, the run took the "nothing to invoice" branch, and it returned ok:true for a
# month. The response is a field no other Domain has: `verified` (last hands-on date),
# and a lifecycle that can say `unverified` / `broken` without anything else changing.
#
# 布局：<facet>/<app>/  —— facet ∈ browser | computer，就是 Browser Use / Computer Use。
# 一个界面一个文件夹；文件夹里一篇文档一个功能。文档的可读性契约由
# skills/computer-automation-log 的 check_doc.py 把关。
#
# schema_version 1: 骨架。本步只建立域与校验规则，不收记录；第一条记录
# （expected: browser-use/deepseek-billing, driven_by procedures/deepseek-invoice）
# 会同时把记录级规则和它的 fixture 带进来。
schema_version: 1

domain: computer_automation
description: UI surface identity, path, facet, platform, drivable routes, blocked routes, verified date, driving assets.

# 作用域。browser = 浏览器窗口里的界面；computer = 桌面 / 操作系统界面。
# 封闭集合：加一个是一次分类决策，不该由某人随手建个目录来引入。
allowed_facets:
  - browser
  - computer

# 验证状态。这是本域特有的词汇，不与生命周期五档混用：
#   verified   —— 在记录的 verified 日期实测通过
#   unverified —— 从没实测过，或超过一个季度没复核（照抄有风险，不是不能用）
#   broken     —— 实测确认走不通（平台改版 / 授权被收回 / 入口被移除）
# 用它而不用 draft/testing/active：那三档回答"这个资产成熟到哪一步"，
# 这里回答"这个界面现在还能不能用"，两个问题不能共用一个词表。
allowed_verifications:
  - verified
  - unverified
  - broken

allowed_platforms:
  - web
  - macos
  - linux
  - windows

# 能被什么驱动。声明整条路，不是声明某个库：
#   cdp          调试协议直连（Chromium 内核）
#   playwright   浏览器自动化驱动
#   ax           辅助功能树读写
#   cgevent      合成键盘鼠标事件
#   applescript  脚本化桌面应用
#   screencapture 截屏（只读像素，最后手段）
#   mcp          通过宿主提供的 MCP 工具驱动
allowed_drive_routes:
  - cdp
  - playwright
  - ax
  - cgevent
  - applescript
  - screencapture
  - mcp

surfaces:
  deepseek-billing:
    name: deepseek-billing
    path: computer-automation/browser-use/deepseek-billing
    facet: browser
    platform: web
    drive: [playwright]
    verification: verified
    verified: "2026-10-23"
    entrypoint: run.mjs
    runtime: node
    commerce: {charge: free}
    notes: >
      DeepSeek 开放平台账单页（platform.deepseek.com/transactions）。
      第一条记录：它是确定性脚本 + 界面档案放在一起的样本 —— run.mjs 就是这个界面的
      操作，两者同时失效（DeepSeek 改版时选择器和「读不到金额必须报错」的分支往往是
      同一次改动），所以不分家。
      verified 2026-10-23 覆盖的是金额读取与失败分支；「有额度」真实提交尚未真机验证，
      见目录 README「已知限制」。定时与部署仍登记在 automations/deepseek-invoice/，
      等它迁到编排层后本记录才完整。
