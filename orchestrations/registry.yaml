# Orchestration Domain — 一次任务的完整编排
#
# 布局三层：<模式>/<生态>/<任务>/
#
#   模式  这一类任务【谁发起】：人说的那一句（manual）/ 系统发起的自动化
#         （automated：钟或事件，不需要人触发）。不是某个具体任务，也不是运行环境。
#
#         是否调用自建后端 API 不在模式里 —— 它标在任务目录名上：
#         调了自建 API 的任务目录名带 `-self-api`，并在 step 里写 `calls:`
#         （服务名 + 契约 + 端点）。两处必须同时存在，验证器会查。
#         `trigger` 可选：human / host-schedule / daily / weekly / monthly /
#         quarterly / event / manual；automated 的条目建议写清是钟还是事件。
#   生态  这个编排动用了哪个平台的资产（wechat / dsh / doubao-work）。
#   任务  具体那一条。
#
# 它只【引用】其它域，不复制任何实现。改排版去 skills/wechat-html-css-layout，
# 改价格同步去 procedures/quote-sync —— 这里一个字都不放。
#
# `steps` 是唯一机器真相。目录里的软链是给人看的那一份，验证器保证两者一致
# —— 因为 git 不会告诉你软链断了（实测：删掉目标后 git status 干净）。
#
# schema_version 2（本域与 Automation Domain 合并的第一步，暂不动记录）：
#   本域正在从「一次任务按什么顺序」升级成「一条作业」—— 一条作业 = 触发器
#   + 按顺序引用的模块 + 输出。Automation Domain 的 9 条作业会逐步迁进来，
#   因为它们记录的其实也是这三件事，只是分散在两个域各记一半：
#
#     现在                                      合并后
#     automations/<job>   trigger_kind+executor → 本域 automated/<job> 的
#                                                  trigger + executor
#     automations/<job>   entrypoint            → 本域 steps（引用模块）
#     automations/<job>   output                → 本域 output
#     本域 trigger（human/host-schedule…）      → 与 trigger_kind 并成一套词
#
#   这一步只做两件事，都不动记录：① trigger 词表并集（吸收 quarterly / manual）；
#   ② 补上 executor 与 output 两格（可选，迁入时变必填）。
#   为什么先做词表：两份词表重叠 4 个值、各自还有对方没有的值，同一个事实用
#   两种说法记在两处 —— 这是"两域各拿一半"最具体的样子，也是合并最先撞上的地方。
#
# schema_version 3（迁移中，兼容两种形状）：
#   本域从「<模式>/<生态>/<任务>」改成「<项目>/<任务>」两层。
#   理由：一个任务属于哪个【项目】才是人要找它的方式；"人发起还是钟发起"是记录字段
#   `trigger`，不是目录层级 —— 与 skills 的 scope 同一条原则（分类是注册表状态）。
#   5 条任务已全部迁完（2026-10-25）。本版本起**只接受项目形状**，旧的三层路径
#   不再合法 —— 校验器的兼容分支保留一轮，等确认没有外部引用后删除。
schema_version: 4

allowed_statuses:
  - testing
  - available
  - deprecated

orchestrations:
  wechat-article:
    name: wechat-article
    path: orchestrations/wechat/wechat-article
    status: testing
    version: 0.1.0
    updated: "2026-10-25"
    trigger: human
    goal: 从选题到公众号草稿箱
    steps:
      - id: write
        link: 1-write
        use: skills/geo-content
        produces: 正文 Markdown
      - id: layout
        link: 2-layout
        use: skills/wechat-html-css-layout
        needs: [write]
        produces: body HTML
      - id: chart
        link: 3-chart
        use: skills/animated-chart-gif
        needs: [layout]
        produces: 配图 GIF
      - id: upload
        link: 4-upload
        use: external-capabilities/mcp/wechat-draft-mcp
        needs: [layout, chart]
        produces: 公众号草稿

  investdesk-daily-report:
    name: investdesk-daily-report
    path: orchestrations/investdesk/investdesk-daily-report
    status: testing
    version: 0.1.0
    updated: "2026-10-25"
    trigger: host-schedule
    goal: 价格同步完成后，把「持仓日报该生成了」作为事件推给豆包
    steps:
      - id: trigger-and-execute
        link: 1-trigger-and-execute
        use: procedures/quote-sync
        produces: 飞书 Base「持仓价格表」已更新 + 一条含触发关键词的飞书单聊消息
      - id: consume
        link: 2-consume
        use: skills/investdesk-portfolio
        needs: [trigger-and-execute]
        produces: 持仓日报

  # ---- 调自建 API：任务目录名带 -self-api --------------------------------
  # 这类编排有一段执行没有资产承载 —— 不是 MCP、不是 CLI、不是插件，而是 skill
  # 正文里的一次 HTTP 调用，打到一个我们自己维护的后端服务上。能不能跑，取决于
  # 宿主的执行与出网能力。
  #
  # 标记有两处，必须同时存在（验证器查）：
  #   ① 任务目录名以 `-self-api` 结尾；
  #   ② step 里有 `calls:`（服务名 + 契约 + 端点）。
  # `calls` 是这一步的运行时依赖，不是 `use`：店外服务没有 implementation_path，
  # 不是可引用的落地资产。契约必须与服务记录里那份是同一个文件。

  teaming-meeting-review-self-api:
    name: teaming-meeting-review-self-api
    path: orchestrations/teaming/teaming-meeting-review-self-api
    status: testing
    version: 0.1.0
    updated: "2026-10-24"
    trigger: human
    goal: 人问一场会，宿主取妙记逐字稿、调分析服务、把报告链接交回
    execution:
      requires: [bash, curl, network, feishu-native]
      egress: [meeting.bamamei.online]
    steps:
      - id: analyze
        link: 1-analyze
        use: skills/teaming-meeting-analysis
        calls:
          service: meeting-analysis-service
          contract: skills/teaming-meeting-analysis/SKILL.md
          endpoints:
            - POST /api/host/v1/enroll
            - POST /api/host/v1/analyze
        produces: 四部分报告结论 + reportUrl

  # teaming 的主要用法其实是这条：钟叫醒、扫一批、逐场判断。
  # 和上一条共用同一个 skill 与同一个服务，但输入（时间窗口 vs 指定的一场）、
  # 产出（一批结果 + 跳过清单 vs 一份报告）和失败方式（没人可问 vs 人就在旁边）
  # 都不同，所以是两条编排。
  teaming-minute-scan-self-api:
    name: teaming-minute-scan-self-api
    path: orchestrations/teaming/teaming-minute-scan-self-api
    status: testing
    version: 0.1.0
    updated: "2026-10-24"
    trigger: host-schedule
    goal: 定时扫最近 N 小时的新妙记，只分析相关的，汇报时列出跳过了哪几场
    execution:
      requires: [bash, curl, network, feishu-native]
      egress: [meeting.bamamei.online]
    steps:
      - id: scan
        link: 1-scan
        use: skills/teaming-meeting-analysis
        calls:
          service: meeting-analysis-service
          contract: skills/teaming-meeting-analysis/SKILL.md
          endpoints:
            - POST /api/host/v1/enroll
            - POST /api/host/v1/analyze
        produces: 一批报告结论 + reportUrl，以及「哪几场没分析、为什么」的清单

  readloop-daily-self-api:
    name: readloop-daily-self-api
    path: orchestrations/readloop/readloop-daily-self-api
    status: testing
    version: 0.1.1
    updated: "2026-10-24"
    trigger: host-schedule
    goal: 宿主定时叫醒，按记忆曲线每天出题、判分、把状态写回用户自己的表
    execution:
      requires: [bash, curl, network, feishu-native]
      # 0.2.0 起首次配置的写入校验由服务端代跑，SOP 不再 curl 飞书；插件直连
      # open.feishu.cn 是浏览器的事，不属于宿主这条链的出网。
      egress: [readinsight.bamamei.online]
    steps:
      - id: coach
        link: 1-coach
        use: skills/readloop
        calls:
          service: readloop-service
          contract: skills/readloop/references/api.md
          endpoints:
            - POST /api/license/activate
            # 首次配置：一键创建用户自己的飞书应用（契约见 api.md 第 4 节）
            - POST /api/setup/app/start
            - GET /api/setup/app/status
            - POST /api/setup/app/pair
            - POST /api/review/today
            - POST /api/review/submit
        produces: 今日题目、判分与状态更新（写回用户的多维表格）
  quote-sync:
    name: quote-sync
    path: orchestrations/investdesk/quote-sync
    status: testing
    version: 0.3.0
    updated: "2026-10-25"
    trigger: daily
    executor: github-actions
    clock: investdesk-quote-sync
    # 钟就在这两处，且都必须在仓库里：timer 决定"什么时候"，
    # workflow 决定"跑什么"。registry 记录指向它们，不是复制它们的内容。
    external_trigger: scripts/server-timers/systemd/investdesk-quote-sync.timer
    workflow: .github/workflows/automation-investdesk-quote-sync.yml
    goal: 每交易日 20:00 把持仓最新价格写回飞书多维表格
    steps:
      - id: sync
        link: 1-sync
        use: procedures/quote-sync
        produces: 飞书「最新持仓」表的价格字段已更新（抓不到的保持原值并单独上报）
    output:
      target: external-system
      destination: "飞书多维表格：持仓价格表"
    notes: >
      install.sh / plist / 服务器触发脚本住在 deploy/：它们描述"怎么把这个钟装上"，
      属于执行方式而不是实现，所以跟编排走、不跟 procedure 走。
      workflow 里【故意没有 schedule】—— GitHub 的定时器在本仓库实测延迟 4-5 小时，
      而这条链必须赶在次日 09:00 消费前落地；所以由自建服务器的 systemd timer 准点
      dispatch，代价是没有兜底。
  portfolio:
    name: portfolio
    path: orchestrations/investdesk/portfolio
    status: testing
    version: 0.1.0
    updated: "2026-10-25"
    trigger: human
    executor: human
    goal: 人问「我的组合怎么样」时，取持仓 → 六视角分析 → 给结论
    steps:
      - id: holdings
        link: 1-holdings
        use: procedures/portfolio-holdings
        produces: 持仓明细 + 平台维度（结构化，不是模型读表）
      - id: analyze
        link: 2-analyze
        use: skills/investdesk-portfolio
        needs: [holdings]
        produces: 六视角分析 + 一句话结论 + 值得复核项
    output:
      target: human
      destination: 对话里直接给出（定时模式才推送日报）

  research:
    name: research
    path: orchestrations/investdesk/research
    status: testing
    version: 0.1.0
    updated: "2026-10-25"
    trigger: human
    executor: human
    goal: 人问「XX 主题有什么值得看的」时，翻译成筛选条件 → 出候选清单
    steps:
      - id: research
        link: 1-research
        use: skills/investdesk-research
        produces: 可落库的结构化候选清单（写进飞书备选池）
    output:
      target: human
      destination: 候选清单 + 写进飞书备选池
    notes: >
      这条没有 procedure —— 它刻意不自己抓数据：行情归 procedures/quote-sync，
      查询交给成熟插件。所以它是纯判断，没有确定性实现可抽。
  deepseek-invoice:
    name: deepseek-invoice
    path: orchestrations/computer-automation/deepseek-invoice
    status: testing
    version: 0.1.3
    updated: "2026-10-25"
    trigger: monthly
    executor: systemd
    clock: deepseek-invoice
    goal: 每月 1 日给 DeepSeek 账户余额开企业增值税普通发票
    steps:
      - id: run
        link: 1-run
        use: procedures/deepseek-invoice
        produces: DeepSeek 平台提交开票申请
    output:
      target: local-file
      path: /opt/deepseek-invoice/logs
      retention: 24
      human_access: ssh 到目标机 ls -t /opt/deepseek-invoice/logs
    notes: >
      界面失效是静默的：退出码 4（读不到金额）与 5（提交后未验证）必须当失败处理，
      不许自动重提。验证状态记在任务 README。

  wechat-tencent-invoice:
    name: wechat-tencent-invoice
    path: orchestrations/computer-automation/wechat-tencent-invoice
    status: testing
    version: 0.1.4
    updated: "2026-10-26"
    trigger: human
    executor: human
    goal: 人在微信桌面版里开腾讯充值发票
    steps:
      - id: invoice
        link: 1-invoice
        use: skills/wechat-tencent-invoice
        produces: 发票申请已提交并到开票记录核对
    output:
      target: human
      destination: 界面上确认 + 开票记录
    notes: >
      载体是 Skill 而不是脚本：要挑订单、核对抬头金额、提交前必须人确认。
      写成脚本会把"该确认"变成"直接提交"——那是这类操作最不能犯的错。
