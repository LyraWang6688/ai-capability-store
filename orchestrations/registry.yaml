# Orchestration Domain — 一次任务的完整编排
#
# 布局三层：<模式>/<生态>/<任务>/
#
#   模式  这一类任务靠什么跑完：人说的那一句（manual）/ 一个钟（scheduled-task）/
#         一个自建的后端服务（service-call）。不是某个具体任务，也不是运行环境。
#         service-call 不回答「谁发起」，所以它必须另写 trigger。
#   生态  这个编排动用了哪个平台的资产（wechat / dsh / doubao-work）。
#   任务  具体那一条。
#
# 它只【引用】其它域，不复制任何实现。改排版去 skills/wechat-html-css-layout，
# 改价格同步去 automations/investdesk-quote-sync —— 这里一个字都不放。
#
# `steps` 是唯一机器真相。目录里的软链是给人看的那一份，验证器保证两者一致
# —— 因为 git 不会告诉你软链断了（实测：删掉目标后 git status 干净）。
schema_version: 1

allowed_statuses:
  - testing
  - available
  - deprecated

orchestrations:
  wechat-article:
    name: wechat-article
    path: orchestrations/manual/wechat/wechat-article
    status: testing
    version: 0.1.0
    updated: "2026-10-22"
    goal: 从选题到公众号草稿箱
    steps:
      - id: write
        link: 1-write
        use: skills/geo-content
        produces: 正文 Markdown
      - id: layout
        link: 2-layout
        use: skills/wechat-html-css-layout
        needs: [write]
        produces: body HTML
      - id: chart
        link: 3-chart
        use: skills/animated-chart-gif
        needs: [layout]
        produces: 配图 GIF
      - id: upload
        link: 4-upload
        use: external-capabilities/mcp/wechat-draft-mcp
        needs: [layout, chart]
        produces: 公众号草稿

  investdesk-daily-report:
    name: investdesk-daily-report
    path: orchestrations/scheduled-task/doubao-work/investdesk-daily-report
    status: testing
    version: 0.1.0
    updated: "2026-10-22"
    goal: 价格同步完成后，把「持仓日报该生成了」作为事件推给豆包
    steps:
      - id: trigger-and-execute
        link: 1-trigger-and-execute
        use: automations/investdesk-quote-sync
        produces: 飞书 Base「持仓价格表」已更新 + 一条含触发关键词的飞书单聊消息
      - id: consume
        link: 2-consume
        use: skills/investdesk-portfolio
        needs: [trigger-and-execute]
        produces: 持仓日报

  # ---- service-call：自建服务在后端，接口写在 SOP 里 ----------------------
  # 这两条和前两条的区别不是"定时与否"，而是：有一段执行没有资产承载 ——
  # 不是 MCP、不是 CLI、不是插件，而是 skill 正文里的一次 HTTP 调用，打到一个
  # 我们自己维护的后端服务上。能不能跑，取决于宿主的执行与出网能力。
  #
  # `calls` 是这一步的运行时依赖，不是 `use`：店外服务没有 implementation_path，
  # 不是可引用的落地资产。它记的是"接口对应哪个后端服务"，契约必须与服务记录
  # 里那份是同一个文件。

  teaming-meeting-review:
    name: teaming-meeting-review
    path: orchestrations/service-call/doubao-work/teaming-meeting-review
    status: testing
    version: 0.1.0
    updated: "2026-10-23"
    trigger: human
    goal: 人问一场会，宿主取妙记逐字稿、调分析服务、把报告链接交回
    execution:
      requires: [bash, curl, network, feishu-native]
      egress: [meeting.bamamei.online]
    steps:
      - id: analyze
        link: 1-analyze
        use: skills/teaming-meeting-analysis
        calls:
          service: meeting-analysis-service
          contract: skills/teaming-meeting-analysis/SKILL.md
          endpoints:
            - POST /api/host/v1/enroll
            - POST /api/host/v1/analyze
        produces: 四部分报告结论 + reportUrl

  readloop-daily:
    name: readloop-daily
    path: orchestrations/service-call/doubao-work/readloop-daily
    status: testing
    version: 0.1.0
    updated: "2026-10-23"
    trigger: host-schedule
    goal: 宿主定时叫醒，按记忆曲线每天出题、判分、把状态写回用户自己的表
    execution:
      requires: [bash, curl, network, feishu-native]
      # open.feishu.cn 只出现在首次配置的「一键创建用户自己的飞书应用」段（SKILL.md 3.3）。
      egress: [readinsight.bamamei.online, open.feishu.cn]
    steps:
      - id: coach
        link: 1-coach
        use: skills/readloop
        calls:
          service: readloop-service
          contract: skills/readloop/references/api.md
          endpoints:
            - POST /api/license/activate
            - POST /api/review/today
            - POST /api/review/submit
        produces: 今日题目、判分与状态更新（写回用户的多维表格）
