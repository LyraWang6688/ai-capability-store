# 所有钟，唯一一份。
#
# 为什么单独一个文件：钟是【执行方式】，不是某个任务的私有物。同一个钟可能被
# 一条编排引用，也可能改停、改时间、换 workflow —— 这三件事只该在一个地方改。
# 任务目录里放一个指向本文件的软链（`clock → ../../clocks.yaml`）：
# 看得到、但不复制，改一处对所有人生效。
#
# 校验器会查：每个钟的 timer 与 workflow 文件真的存在；executor 需要钟的编排，
# 其 `clock:` 必须指向这里的一个 id。
#
# 历史：2026-10-24 之前 cron 类触发器在 timers/*.cron，已全部迁成 systemd timer；
# install.sh 会删掉 /etc/cron.d 里的旧文件，避免同一件事有两个钟。
schema_version: 1

clocks:
  investdesk-quote-sync:
    timer: scripts/server-timers/systemd/investdesk-quote-sync.timer
    workflow: .github/workflows/automation-investdesk-quote-sync.yml
    note: 必须赶在次日 09:00 消费前落地，所以不用 GitHub 自带 schedule（实测延迟 4-5 小时）

  github-trending-daily:
    timer: scripts/server-timers/systemd/github-trending-daily.timer
    workflow: .github/workflows/automation-github-trending-daily.yml

  github-trending-weekly:
    timer: scripts/server-timers/systemd/github-trending-weekly.timer
    workflow: .github/workflows/automation-github-trending-weekly.yml

  github-portfolio-snapshot:
    timer: scripts/server-timers/systemd/github-portfolio-snapshot.timer
    workflow: .github/workflows/automation-github-portfolio-snapshot.yml

  repo-baseline-audit:
    timer: scripts/server-timers/systemd/repo-baseline-audit.timer
    workflow: .github/workflows/automation-repo-baseline.yml

  repo-discoverability:
    timer: scripts/server-timers/systemd/repo-discoverability.timer
    workflow: .github/workflows/automation-repo-discoverability.yml

  frontier-watch:
    timer: scripts/server-timers/systemd/frontier-watch.timer
    workflow: .github/workflows/automation-frontier-watch.yml

  deepseek-invoice:
    timer: scripts/server-timers/systemd/deepseek-invoice.timer
    workflow: null          # 直接在服务器上跑 /opt/deepseek-invoice/run.mjs，不经 Actions
    note: 需要长期登录态与国内固定 IP，只能在本机跑

  ops-audit:
    timer: scripts/server-timers/systemd/ops-audit.timer
    workflow: null          # 直接在服务器上跑，不经 GitHub Actions
    note: systemd 直接执行 unit，没有 workflow

  box2bitable-observability:
    timer: scripts/server-timers/systemd/box2bitable-observability.timer
    workflow: null
    note: ⚠️ 有钟、没有任何作业记录 —— 待补登记或停掉

  feishu-digest:
    timer: scripts/server-timers/systemd/feishu-digest.timer
    note: 每天 22:00 汇总当天飞书内容，赶在睡前发出去

  wechat-invoice-reminder:
    timer: scripts/server-timers/systemd/wechat-invoice-reminder.timer
    note: 每季度（1/4/7/10 月 25 日）提醒一次给微信读书订单开票，只提醒不自动开
