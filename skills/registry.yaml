# Skill Domain Registry
# Source of Truth for: Skill identity / path / lifecycle / version / placement
#
# schema_version 2: `shared:` + `projects:` merged into ONE flat `skills:` map,
# and placement moved out of the registry section into the record field `scope`.
#
# Why (breaking): the on-disk layout is flat (`skills/<name>/`). Agent Plugins
# v1 §7.1 fixes skill discovery at `skills/`, treats each *immediate child*
# directory containing SKILL.md as one skill, and states clients MUST NOT
# recurse into deeper descendants. A nested layout such as
# `skills/shared/<name>/` would therefore be invisible to conformant clients.
# Classification is registry state, not a directory level.
schema_version: 2

domain: skills
description: Skill identity, path, lifecycle status, version, and placement scope.

# One flat mapping keyed by Skill identifier (map key == name). No sections.
skills:
  geo-content:
    name: geo-content
    path: skills/geo-content
    scope: shared
    status: testing
    version: 0.1.0
    updated: "2026-10-20"
    notes: >
      Store-native reusable content creation, review and revision workflow for
      human readability and accurate AI retrieval, summarization and citation.
      Separates editorial quality, platform accessibility and observed outcomes;
      no universal GEO score or citation guarantee. New asset, no prior Git history.
      Acceptance scope and representative artifacts: references/acceptance.md.
  ai-tool-footprint:
    name: ai-tool-footprint
    path: skills/ai-tool-footprint
    scope: shared
    status: testing
    version: 0.1.0
    updated: "2026-10-20"
    notes: >
      Store-native source migrated from the local Agent Skills directory; the
      local installation is a symlink to this canonical directory, not an upstream.
      First full-history collection followed by per-source incremental evidence;
      produces WeChat articles and matching visual HTML. The bundled collector
      remains a full auxiliary scan, not an automatic incremental collector.
      Evidence: references/migration-validation.md. Full personal-data collection
      and article generation have not been rerun for this registration.
  investdesk-portfolio:
    name: investdesk-portfolio
    path: skills/investdesk-portfolio
    scope: shared
    status: testing
    version: 0.1.0
    updated: "2026-10-18"
    notes: >
      持仓分析与复盘。读飞书多维表格的持仓，按六个视角分析：总览 / 平台分布 /
      集中度 / 盈亏归因 / 风险敞口 / 异常项。强制区分「今日涨跌」与「累计盈亏」
      两个口径，并标注数据时点（场内收盘、场外 T 日净值、QDII 更晚）。
      只给「值得复核」的提示，不给买卖指令。与 investdesk-research 分工：
      这个分析已有持仓，那个推荐新标的。
  investdesk-research:
    name: investdesk-research
    path: skills/investdesk-research
    scope: shared
    status: testing
    version: 0.1.0
    updated: "2026-10-18"
    notes: >
      投资标的推荐与沉淀。把「XX 主题有什么值得看的股票/ETF」翻译成可执行的筛选条件，
      通过豆包工作里的免费插件（广发 ETF/基金研究、盈米基金、证券之星）与 Wind Alice
      查真实在售标的，过四道筛子（主题匹配 / 流动性 / 规模质量 / 成本），输出可落库的
      结构化候选清单。豆包工作用自带飞书能力直接写入备选池与灵感记录两张表；飞书不可用时输出可粘贴格式。
      刻意不自己抓数据——行情同步由 investdesk-quote-sync 负责，数据查询交给成熟插件。
  repo-hygiene:
    name: repo-hygiene
    path: skills/repo-hygiene
    scope: shared
    status: testing
    version: 0.1.2
    updated: "2026-10-20"
  teaming-meeting-analysis:
    name: teaming-meeting-analysis
    path: skills/teaming-meeting-analysis
    scope: shared
    status: testing
    version: 0.1.2
    updated: "2026-10-15"
    notes: >
      Analyze a finished Feishu meeting with the Teaming framework and produce a
      four-part report (team state, interaction overview, unfinished dialogues and
      non-consensus, advice for leaders). Runs entirely over HTTP: the host exports
      the minute transcript with its own Feishu ability and POSTs it to
      /api/host/v1/analyze. Deliberately does NOT depend on the teaming-mcp
      connector — the Doubao Work scheduled-task / cloud-computer environment
      cannot see MCP tools (verified 2026-10-15) but does have bash + curl.
      `testing`: end-to-end scheduled-task run not yet validated.
  store-publish:
    name: store-publish
    path: skills/store-publish
    scope: shared
    status: testing
    version: 0.2.3
    updated: "2026-10-19"
    notes: >
      The procedure this Store uses to onboard its own assets. Used end to end
      to register all four assets; v0.2.0 adds the subtree-pull workflow
      (source repo lives elsewhere), environment setup, and the tag rules that
      those runs showed were missing. v0.2.1 closes a trap in that workflow:
      "was imported with `git subtree add`" does not mean "is still synced by
      subtree" — an asset can be declared Store-native later (upstream retired
      or deleted), yet commit history keeps the subtree traces and cannot reveal
      the change. §0b now requires reading the registry `notes` for a declared
      sync mode first. It also records a claim we got wrong: subtree pull does
      NOT conflict (git uses merge-base and self-heals; verified zero-conflict on
      2026-10-18), so "would conflict" must not be used as the test — only
      "is there a usable upstream" counts. v0.2.2 adds the third mode
      `check_tag_version.py --missing`: default mode asks "is this tag safe",
      --audit asks "does every tag tell the truth", and only --missing asks
      "does every truth have a tag" — the blind spot that let three releases go
      out untagged in October 2026. It runs weekly (.github/workflows/tag-audit.yml)
      rather than in PR CI, where an untagged version bump is correct work.
      v0.2.3 adds the fourth mode `--package`: the registry says what version
      an asset is, but the artifact a consumer installs declares its own in its
      own package.json, and nothing compared them. `selection-toolbar` shipped
      registered at 0.1.0 with package.json saying 1.0.0 while every other
      check was green. It runs in PR CI — unlike `--missing` it compares two
      things the PR already holds, so there is no untagged-version false
      positive to design around.
      Still `testing`: 0.2.x cannot be `active` — VERSIONING.md §4 requires
      major >= 1 — and no trigger harness exists yet.

  context-submit:
    name: context-submit
    path: skills/context-submit
    scope: shared
    status: testing
    version: 0.1.0
    updated: "2026-10-19"
    notes: >
      Agent Context Architecture 的唯一输入口。实干 agent 把观察到的、值得长期沉淀的
      东西（踩坑 / 经验 / 集成知识 / 用户偏好 / 需要记住的事实 / 规则候选）按统一模板
      结构化后投入飞书「投递箱」表。核心纪律：投递者只报告观察、不负责归类——
      归类与抽象由维护者做。含门禁 validate_entry.py（结构不合格不许写）与
      check_similar.py（报告相似条目，但不阻断——重复本身是共性的证据）。
  repo-wrapup:
    name: repo-wrapup
    path: skills/repo-wrapup
    scope: shared
    status: testing
    version: 0.1.1
    updated: "2026-10-20"
    notes: >
      多 agent 协作的收尾工具。审计分支 / worktree / PR 的残留状态，按安全边界
      清理已合并且无风险的分支，并在交付时生成「收尾报告」——让
      「本地和远端工作区干净了吗」不再需要靠人追问。与 repo-hygiene 分工：
      那个管代码/依赖/死文件，这个只管分支/worktree/PR。worktree 一律不自动
      删除（可能被其他 agent 占用），只报告。默认 plan 模式只出计划，
      加 --clean 才真删。
  wechat-html-css-layout:
    name: wechat-html-css-layout
    path: skills/wechat-html-css-layout
    status: testing
    version: 0.1.0
    updated: "2026-10-20"
  animated-chart-gif:
    name: animated-chart-gif
    path: skills/animated-chart-gif
    scope: shared
    status: testing
    version: 0.1.0
    updated: "2026-10-20"
    notes: >
      Store-native new asset (no prior Git history; authored 2026-10-20).
      Renders 720x540 / 12.5fps animated GIFs for WeChat article bodies from a
      JSON spec: bar comparison, line trend with moving readout, and stepwise
      flow highlight. Spec derived by measuring six GIFs from a live public
      WeChat article (see references/spec.md). Deterministic Pillow renderer,
      local only, no network. Requires Python 3 + Pillow and a macOS CJK font.
      Not a WeChat layout tool; complements wechat-html-css-layout.
allowed_statuses:
  - draft
  - testing
  - active
  - deprecated
  - archived

# Skill Registry Schema (v2)
#
# `skills` is a single flat mapping keyed by Skill identifier.
#
# Required fields per entry:
#   name      == map key, lowercase kebab-case
#   path      relative repo path; MUST be exactly skills/<name>/
#             (flat layout, exactly 2 components), containing SKILL.md
#             and agents/openai.yaml
#   status    one of allowed_statuses
#   version   semantic X.Y.Z (see VERSIONING.md)
#   updated   YYYY-MM-DD — the date this REGISTRY RECORD was last updated.
#             For a newly registered skill that is the registration date.
#             It tracks the RECORD, not the skill's content — content versions
#             are tracked by `version`. The two coincide from the first
#             iteration onward; they differ only when an older skill is
#             registered for the first time.
#
# Optional fields:
#   scope     shared | project   (default: shared)
#             Placement is a RECORD FIELD, never a directory level — the
#             directory stays flat so conformant clients can discover the skill.
#   project   owning project identifier (lowercase kebab-case).
#             Required when scope == project; rejected otherwise (carrying it
#             without scope: project would recreate a second source of truth).
#   notes     free-form
#
# Example (cross-project reusable):
#   skills:
#     repo-hygiene:
#       name: repo-hygiene
#       path: skills/repo-hygiene
#       scope: shared
#       status: testing
#       version: 0.1.0
#       updated: "2026-10-01"
#
# Example (project-scoped):
#   skills:
#     meeting-analysis:
#       name: meeting-analysis
#       path: skills/meeting-analysis
#       scope: project
#       project: meeting-agent
#       status: testing
#       version: 0.1.0
#       updated: "2026-10-01"
#
# Note: quote the date (or rely on YAML date parsing) — both are accepted.
