    notes: >
      「京城好戏」项目的日历 Skill：查询北京地区戏曲（京剧/昆曲/评剧/河北梆子/秦腔等）
      与话剧的演出日程与购票信息。双轨工作流——用户提问走决策层（先查 Base 判新鲜度，
      有缺口才补采），每周一/四 10:30 定时任务走更新层（抓未来 30 天新增、按「剧目+日期」
      去重写入、过期改已结束）。Base「北京剧场演出日历」是唯一事实源；只收戏曲+话剧两品类，
      术语统一用「戏曲」；禁止编造、每条必填信息来源；动态公式字段勿手写。
      本目录为 Store 规范登记版，本地豆包 Work .user_skills 中另有运行副本。
allowed_statuses:
  - draft
  - testing
  - active
  - deprecated
  - archived

# Skill Registry Schema (v2)
#
# `skills` is a single flat mapping keyed by Skill identifier.
#
# Required fields per entry:
#   name      == map key, lowercase kebab-case
#   path      relative repo path; MUST be exactly skills/<name>/
#             (flat layout, exactly 2 components), containing SKILL.md
#             and agents/openai.yaml
#   status    one of allowed_statuses
#   version   semantic X.Y.Z (see VERSIONING.md)
#   updated   YYYY-MM-DD — the date this REGISTRY RECORD was last updated.
#             For a newly registered skill that is the registration date.
#             It tracks the RECORD, not the skill's content — content versions
#             are tracked by `version`. The two coincide from the first
#             iteration onward; they differ only when an older skill is
#             registered for the first time.
#
# Optional fields:
#   scope     shared | project   (default: shared)
#             Placement is a RECORD FIELD, never a directory level — the
#             directory stays flat so conformant clients can discover the skill.
#   project   owning project identifier (lowercase kebab-case).
#             Required when scope == project; rejected otherwise (carrying it
#             without scope: project would recreate a second source of truth).
#   notes     free-form
#
# Example (cross-project reusable):
#   skills:
#     repo-hygiene:
#       name: repo-hygiene
#       path: skills/repo-hygiene
#       scope: shared
#       status: testing
#       version: 0.1.0
#       updated: "2026-10-01"
#
# Example (project-scoped):
#   skills:
#     meeting-analysis:
#       name: meeting-analysis
#       path: skills/meeting-analysis
#       scope: project
#       project: meeting-agent
#       status: testing
#       version: 0.1.0
#       updated: "2026-10-01"
#
# Note: quote the date (or rely on YAML date parsing) — both are accepted.
