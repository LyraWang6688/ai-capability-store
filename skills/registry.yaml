# Skill Domain Registry
# Source of Truth for: Skill identity / path / lifecycle / version / placement
#
# schema_version 2: `shared:` + `projects:` merged into ONE flat `skills:` map,
# and placement moved out of the registry section into the record field `scope`.
#
# Why (breaking): the on-disk layout is flat (`skills/<name>/`). Agent Plugins
# v1 §7.1 fixes skill discovery at `skills/`, treats each *immediate child*
# directory containing SKILL.md as one skill, and states clients MUST NOT
# recurse into deeper descendants. A nested layout such as
# `skills/shared/<name>/` would therefore be invisible to conformant clients.
# Classification is registry state, not a directory level.
schema_version: 2

domain: skills
description: Skill identity, path, lifecycle status, version, and placement scope.

# One flat mapping keyed by Skill identifier (map key == name). No sections.
skills:
  geo-content:
    name: geo-content
    path: skills/geo-content
    scope: shared
    status: testing
    version: 0.1.0
    updated: "2026-10-20"
    notes: >
      Store-native reusable content creation, review and revision workflow for
      human readability and accurate AI retrieval, summarization and citation.
      Separates editorial quality, platform accessibility and observed outcomes;
      no universal GEO score or citation guarantee. New asset, no prior Git history.
      Acceptance scope and representative artifacts: references/acceptance.md.
