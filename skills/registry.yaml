  readloop:
    name: readloop
    path: skills/readloop
    scope: shared
    status: testing
    version: 0.2.3
    updated: "2026-10-23"
    notes: >
      Daily English review loop built on real reading. The host reads and writes
      the user's own Feishu Bitable with its native Feishu ability (Doubao Work
      native, or lark-cli on Codex / Work Buddy), sends candidate knowledge
      points plus the user's BYOK model config to the ReadLoop service, and
      coaches the user through the day's questions one at a time. Initialization
      is four steps: pick model, create the Bitable from template, install the
      Chrome extension, create a host scheduled task (daily/weekly + time).
      `testing`: not yet validated end-to-end on Doubao Work.
      0.2.3 (patch): docs audit against the shipped service + extension. Plugin install
      points at the real GitHub Release (unpacked zip) instead of a placeholder;
      README no longer claims the model generates questions (the current service
      uses deterministic templates; the model config is reserved for future
      polish); `status` documents its 400/404 error codes; activation errors add
      400 (bad format); the daily `today` curl example includes the Authorization
      header; README config sample gains `license_expires_at`; daily point-field
      list marks required vs optional; Doubao checklist drops stale "接入码"
      wording and an internal dev note.
      0.2.2 (patch): pairing now delivers the host token to the Chrome extension.
      `POST /api/setup/app/pair` records the host's `host_token` from the
      `Authorization` header, and `GET /api/setup/app/pair?code=` returns it with
      the app credentials (one-shot, then deleted server-side). The extension
      fills it into its settings automatically, so users no longer copy it from
      `~/.readloop/config.json`. Docs updated; no host-facing flow change.
      0.2.1 (patch): `compatibility` now attributes each outbound destination to
      the right side. The host reaches only `readinsight.bamamei.online` (the
      service runs the Feishu write checks itself); `open.feishu.cn` is reached by
      the Chrome extension in the browser, not by the host. The previous wording
      listed both as host requirements and then said the host never calls Feishu —
      the same line contradicted itself, and disagreed with the orchestration's
      `execution.egress` (which already lists only the service).
      0.2.0 (minor): API contract synced with the service implemented 2026-10-23 —
      `today` returns 4 options and `context: null` (no pre-answer leak) and
      `answered` is always 0; `submit` accepts either option text or A/B/C/D and
      returns 10 `updates` fields (now including `难度因子` / `最近暴露`, both must
      be written back); `question_id` is valid 48h. Setup docs now match the
      one-click flow: the service runs the three checks itself (`checks` including
      `publish`), `status` hides `app_secret` by default (`reveal_secret=1` only for
      the manual fallback), and pairing uses POST (bind) + GET (plugin fetches the
      secret once). Error table adds 400/404/410/429. Production base URL is live.
      0.1.1 (patch): `compatibility` now names the outbound destinations and
      what leaves the machine (candidate points, answers, the user's model config
      including the API key) per SECURITY.md § Outbound — before this it said
      only "needs to reach the ReadLoop service", which is not a destination.
  store-publish:
    name: store-publish
    path: skills/store-publish
    scope: shared
    status: testing
    version: 0.2.3
    updated: "2026-10-19"
    notes: >
      The procedure this Store uses to onboard its own assets. Used end to end
      to register all four assets; v0.2.0 adds the subtree-pull workflow
      (source repo lives elsewhere), environment setup, and the tag rules that
      those runs showed were missing. v0.2.1 closes a trap in that workflow:
      "was imported with `git subtree add`" does not mean "is still synced by
      subtree" — an asset can be declared Store-native later (upstream retired
      or deleted), yet commit history keeps the subtree traces and cannot reveal
      the change. §0b now requires reading the registry `notes` for a declared
      sync mode first. It also records a claim we got wrong: subtree pull does
      NOT conflict (git uses merge-base and self-heals; verified zero-conflict on
      2026-10-18), so "would conflict" must not be used as the test — only
      "is there a usable upstream" counts. v0.2.2 adds the third mode
      `check_tag_version.py --missing`: default mode asks "is this tag safe",
      --audit asks "does every tag tell the truth", and only --missing asks
      "does every truth have a tag" — the blind spot that let three releases go
      out untagged in October 2026. It runs weekly (.github/workflows/tag-audit.yml)
      rather than in PR CI, where an untagged version bump is correct work.
      v0.2.3 adds the fourth mode `--package`: the registry says what version
      an asset is, but the artifact a consumer installs declares its own in its
      own package.json, and nothing compared them. `selection-toolbar` shipped
      registered at 0.1.0 with package.json saying 1.0.0 while every other
      check was green. It runs in PR CI — unlike `--missing` it compares two
      things the PR already holds, so there is no untagged-version false
      positive to design around.
      Still `testing`: 0.2.x cannot be `active` — VERSIONING.md §4 requires
      major >= 1 — and no trigger harness exists yet.

  context-submit:
    name: context-submit
    path: skills/context-submit
    scope: shared
    status: testing
    version: 0.1.0
