# Two-stage execution of automations/github-portfolio-snapshot.
#
# 2026-10-24 起分工变化：
#   * GitHub Actions 只负责「拉仓库元数据 + 归一化」（SNAPSHOT_GH_TOKEN 仍需要）
#   * 抓到的 payload 通过 SSH 推给服务器上的无头 DSH
#   * 服务器 DSH 写飞书 Base（Repo Snapshot History / Snapshot Runs / Deleted Repos）
#     并写任务收件箱；Actions 不再持有 FEISHU_APP_ID / FEISHU_APP_SECRET
#
# Secrets required:
#   SNAPSHOT_GH_TOKEN    — 操作者名下的 PAT（不能用 GITHUB_TOKEN）
#   SNAPSHOT_CONFIG_JSON — config.json（github_login / base_token / registry_table）
#   AUTOMATION_SSH_HOST / AUTOMATION_SSH_USER / AUTOMATION_SSH_KEY — 服务器入口
name: automation-github-portfolio-snapshot

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "只采集，不推送到服务器 DSH"
        type: boolean
        default: false

# Nothing is written back to the repository, so read-only is enough.
permissions:
  contents: read

concurrency:
  group: automation-github-portfolio-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout automation code (main)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize the work-dir config
        env:
          SNAPSHOT_CONFIG_JSON: ${{ secrets.SNAPSHOT_CONFIG_JSON }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/snapshot-home"
          mkdir -p "$work"
          printf '%s' "$SNAPSHOT_CONFIG_JSON" > "$work/config.json"
          # Fail fast and loudly if the secret is malformed, rather than three
          # steps later inside the snapshot.
          python3 - "$work/config.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          cfg = json.load(open(path, encoding="utf-8"))
          missing = [k for k in ("github_login", "base_token", "registry_table")
                     if not str(cfg.get(k) or "").strip()]
          if missing:
              raise SystemExit(f"SNAPSHOT_CONFIG_JSON is missing: {missing}")
          print(f"config ok — base_token={str(cfg['base_token'])[:6]}… "
                f"registry_table={cfg['registry_table']}")
          PY
          echo "GITHUB_SNAPSHOT_HOME=$work" >> "$GITHUB_ENV"

      - name: Offline test suite (no network, no credentials)
        run: python3 automations/github-portfolio-snapshot/test_snapshot.py

      - name: Emit snapshot payload (no Feishu write)
        env:
          # NOT secrets.GITHUB_TOKEN: that token belongs to github-actions[bot],
          # and the snapshot reads the *token owner's* repositories.
          GH_TOKEN: ${{ secrets.SNAPSHOT_GH_TOKEN }}
        run: |
          set -euo pipefail
          python3 automations/github-portfolio-snapshot/snapshot.py --emit > payload.json
          python3 -c "import json; d=json.load(open('payload.json')); print('repos:', len(d['repos']))"

      - name: Push payload to server DSH
        if: ${{ inputs.dry-run != true }}
        env:
          AUTOMATION_SSH_HOST: ${{ secrets.AUTOMATION_SSH_HOST }}
          AUTOMATION_SSH_USER: ${{ secrets.AUTOMATION_SSH_USER }}
          AUTOMATION_SSH_KEY: ${{ secrets.AUTOMATION_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUTOMATION_SSH_KEY" > ~/.ssh/automation
          chmod 600 ~/.ssh/automation
          ssh -i ~/.ssh/automation -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$AUTOMATION_SSH_USER@$AUTOMATION_SSH_HOST" < payload.json | tee result.json
          python3 -c "import json; d=json.load(open('result.json')); print('ok=', d.get('ok'), 'changed=', d.get('changed'), 'summary=', d.get('summary'))"
