# 每天采集 8 家公司（国内腾讯/阿里/字节/DeepSeek + 海外英伟达/谷歌/OpenAI/苹果）的投融资事件。
#
# 分工（与 automation-frontier-watch 同一套做法）：
#   * GitHub Actions 只负责「抓」：调万得 MCP（不碰任何飞书凭据）
#   * payload 通过 SSH 管道送到服务器，由服务器的 dshjobs 用 lark-cli 写入飞书
#   * 飞书 user token 只存在服务器（/srv/dsh-jobs/.lark-cli），Actions 里没有
#
# 为什么不让 Actions 直接写飞书：那样要么把自建应用凭据放进 repo secrets，
# 要么维护第二套鉴权；服务器上已经有能用的 user 身份，复用它更省事。
#
# Secrets required:
#   WIND_API_KEY — 万得 key（只用于抓取）
#   SSH_HOST / SSH_USER / SSH_KEY — 服务器通道（SSH_KEY 是 ed25519 私钥）
#
# 服务器前置（已就绪）：
#   /srv/dsh-jobs/work/store-automation  ← main 的克隆，写入前会 reset 到 origin/main
#   /srv/dsh-jobs/env/app.env            ← 含 INVESTDESK_BASE_TOKEN / INVESTDESK_FUNDING_TABLE
name: automation-investdesk-funding-news

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "只抓取并打印统计，不推送服务器"
        type: boolean
        default: true
  schedule:
    # 每天 09:30（北京时间，UTC+8）—— 开盘前把隔夜海外与昨日国内的投融资事件落表
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: automation-investdesk-funding-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 只有抓取需要的凭据；这里没有任何飞书凭据
      WIND_API_KEY: ${{ secrets.WIND_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch（只调万得，不写任何东西）
        run: |
          python3 procedures/investdesk-funding-news/collect.py --mode fetch --out payload.json

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("payload.json"))
          m = d["meta"]
          print("dry-run：不推送")
          print("  记录", len(d["records"]), "| 万得调用", m["credits"], "| 丢弃噪音", m["dropped_noise"])
          for c, v in m["by_company"].items():
              print(f"  {c}: 召回 {v['fetched']} / 保留 {v.get('kept', 0)}")
          PY

      - name: Push to server（由服务器写飞书）
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run == false }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/investdesk
          chmod 600 ~/.ssh/investdesk
          ssh -i ~/.ssh/investdesk -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" '
              set -e
              D=/srv/dsh-jobs/work/store-automation
              sudo -n -u dshjobs git -C "$D" fetch -q --depth 1 origin main
              sudo -n -u dshjobs git -C "$D" reset -q --hard origin/main
              sudo -n -u dshjobs env HOME=/srv/dsh-jobs bash -c \
                "set -a; . /srv/dsh-jobs/env/app.env; set +a; cd $D && python3 procedures/investdesk-funding-news/collect.py --mode write"
            ' < payload.json | tee result.json
          python3 -c "import json; d=json.load(open('result.json')); print('ok=', d.get('created'), 'created /', d.get('already_in_base'), 'already')"
