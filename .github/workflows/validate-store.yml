# Deterministic store validation gate.
# Ensures scripts/validate_store.py runs on every PR and on push to main,
# without relying on an Agent remembering to run it.
name: validate-store

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # JS 包的测试需要 Node。这一条以前不存在，导致 mcpStdio 的 8 个用例
      # 从 0.3.1 一直红到 0.3.2 —— 缺陷跨了两次 npm 发布才被发现。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: external-capabilities/mcp/wechat-draft-mcp/package-lock.json
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run store validator
        run: python3 scripts/validate_store.py
      # Running the validator on this repository proves no check misfires. It says
      # nothing about whether a check would fire when it should — this repository is
      # clean by definition. These fixtures hand the validator the input each check
      # exists to reject, so a check that quietly dies turns the build red instead of
      # reporting a clean run.
      - name: Validator fixtures
        run: python3 scripts/test_validator.py
      # Every skill that ships scripts gets its own fixtures run here. `repo-wrapup`
      # deletes branches — a deletion script with no test means a green build says
      # "nobody looked", not "it works". Auto-discovered so a new skill needs no edit
      # to this file, and a missing suite fails loudly instead of silently skipping.
      - name: Skill script tests
        run: |
          set -euo pipefail
          ran=0
          for t in skills/*/scripts/test_scripts.sh; do
            [ -f "$t" ] || continue
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          echo "ran $ran skill test suites"
          [ "$ran" -gt 0 ] || { echo "no skill test suites found"; exit 1; }
      # deepseek-invoice 的两个失败分支以前会静默变绿：金额读不到被当成 0 跳过
      # （ok:true），提交后未验证只 emit 一句然后退出码 0。纯逻辑拆到 lib.mjs 后
      # 这组测试不需要浏览器 / 配置 / 登录态，可以在 PR 门禁里跑。
      - name: deepseek-invoice failure-branch logic
        run: node --test procedures/deepseek-invoice/test_lib.mjs
      # server-timers 的投递脚本也在"没人看的时候"执行：水位算错 = 重复总结或
      # 永久丢内容，没有新对话却投递 = 收件箱被刷屏。用夹具把这三件事钉住。
      - name: server-timers digest fixtures
        run: python3 scripts/server-timers/test_feishu_digest.py
      # procedure 的测试和 skill 的测试分开跑：procedure 的契约是"同样的输入必须
      # 产出同样的结果"，所以它天然是夹具测试，不联网、不依赖任何 runtime。
      - name: procedure fixtures
        run: |
          set -euo pipefail
          ran=0
          for f in procedures/*/test_*.py; do
            [ -e "$f" ] || continue
            python3 "$f"
            ran=$((ran+1))
          done
          echo "ran $ran procedure test suites"
          [ "$ran" -gt 0 ] || { echo "no procedure test suites found"; exit 1; }
      # 自动化自己的离线测试以前只在各自定时执行时才跑：PR 改坏了，要等下一次
      # 定时任务（可能是几天后，甚至永远不会跑）才发现。这里把它们一起接进 PR 门禁。
      - name: Automation offline tests
        run: |
          set -euo pipefail
          ran=0
          for t in automations/*/test_*.py; do
            [ -f "$t" ] || continue
            echo "::group::$t"
            ( cd "$(dirname "$t")" && python3 "$(basename "$t")" )
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          echo "ran $ran automation test suites"
          [ "$ran" -gt 0 ] || { echo "no automation test suites found"; exit 1; }
      # 零依赖（package.json 没有 dependencies），所以不需要 npm ci / build。
      - name: teaming-mcp tests
        working-directory: external-capabilities/mcp/teaming-mcp
        run: node --test tests/*.test.mjs
      # dsh-feishu-remote 生成的服务脚本决定了「用哪个 node、从哪个 env 文件读 Key」。
      # 这几处错了不会报错，只会静默不工作（见 README「Linux 常驻」），所以用单测钉住。
      - name: dsh-feishu-remote tests
        working-directory: external-capabilities/cli/dsh-feishu-remote
        run: node --test tests/*.test.mjs
      # Separate from the validator on purpose: that script is pure-filesystem
      # (no git, no subprocess) so a tarball or shallow checkout still validates.
      # "Is this file tracked?" is a git question and belongs in its own tool.
      - name: Nothing generated is tracked
        run: python3 scripts/check_tracked_hygiene.py
      # `files` 是 npm 的发布白名单：新加的文件不写进去，仓库里一切正常、装到用户
      # 机器上却少一个文件，而且不报错 —— 只表现为某个功能静默失效。这条门禁要求
      # 每个 tracked 文件要么出现在 `npm pack` 的真实清单里，要么在
      # scripts/package-files/allow.yaml 里被显式声明「不发布」。夹具用一个人为
      # 破坏的包证明它在该红的时候会红，而不是永远绿。
      - name: Package files are shipped or explicitly excluded
        run: python3 scripts/check_package_files.py
      - name: Package-files gate fixtures
        run: python3 scripts/package-files/test_check_package_files.py
      # The registry says what version an asset is; the artifact a consumer
      # actually installs declares its own version in its own package.json.
      # Nothing compared them. `selection-toolbar` was registered at 0.1.0 while
      # its package.json said 1.0.0, and every other check was green — the tag
      # agreed with the registry, --missing agreed, --audit agreed. Only the
      # thing that gets installed was wrong, which is the one place nobody looks.
      # `npm test` 只跑 `build:test`（输出到 dist-test/），而 mcpStdio 的用例会
      # spawn `dist/mcpServer.js`。`npm ci` 会通过 prepare 触发一次 build ——
      # 这里仍然显式再 build 一次：一旦 prepare 被删掉，测试会以「子进程起不来」
      # 的形式静默退化，而不是报配置错误。
      - name: wechat-draft-mcp tests
        working-directory: external-capabilities/mcp/wechat-draft-mcp
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm test
      # 「消费方装到的 artifact 版本是否与 registry 一致」。
      # 检查器在公开的 scripts/tag-audit/ 下；store-publish 这个本地专用 skill
      # 只是它的一个调用方，所以脚本一行都不用改位置就能继续在 CI 跑。
      - name: Artifact versions agree with the registry
        run: python3 scripts/tag-audit/check_tag_version.py --package HEAD

