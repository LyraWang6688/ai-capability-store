name: automation-repo-discoverability

# 每周一 20:00（Asia/Shanghai）体检所有公开仓库的「发现性」：
# 能不能被 AI / 人搜到，搜到之后愿不愿意点进来。
#
# 边界（用户 2026-10-20 明确）：本自动化**只读 + 开 issue，不写任何仓库**。
#   · 只读：审计 6 项，不修改任何仓库内容
#   · 写：只在「本仓库」开/改/关 issue
#   · 不写：不改别的仓库的 README / description / topics / llms.txt / 文件
#
# 「怎么按标准执行」由用户与各仓库负责的 AI 约定，不归本自动化管。
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "只打印会改什么，不写仓库、不开 issue"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-repo-discoverability
  cancel-in-progress: false

jobs:
  discoverability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline tests
        working-directory: automations/repo-discoverability
        run: python3 test_discoverability.py

      - name: Audit (read-only)
        working-directory: automations/repo-discoverability
        env:
          # 跨仓库读公开信息：github.token 只覆盖当前仓库，必须用 PAT
          GH_TOKEN: ${{ secrets.GH_AUDIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 audit_discoverability.py --all --owner LyraWang6688 || true

      - name: Open / update issues on non-compliant repos
        working-directory: automations/repo-discoverability
        env:
          # 跨仓库开 issue 必须是 PAT（repo scope）；GITHUB_TOKEN 只能写当前仓库
          GH_TOKEN: ${{ secrets.GH_DISCOVERY_TOKEN || secrets.GH_AUDIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "::notice::dry-run —— 只打印，不开 issue"
            python3 report_issues.py --owner LyraWang6688 || true
          else
            # 每周都会跑：脚本是幂等的（有则改、好则关），不会重复开单
            python3 report_issues.py --owner LyraWang6688 --create || true
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## repo-discoverability"
            echo ""
            echo "- 标准与证据：\`automations/repo-discoverability/README.md\`"
            echo "- 写 README / 选 topics 的规范：\`automations/repo-discoverability/MAINTAINER-GUIDE.md\`"
            echo "- **本自动化不写任何仓库**：只读审计 + 在本仓库开 issue。"
            echo "- 「怎么按标准执行」由用户与各仓库负责的 AI 约定。"
            echo "- 归档仓库直接跳过（只读）。"
            echo "- issue 是幂等的：同一仓库只维护一条，修好会自动关闭。"
          } >> "$GITHUB_STEP_SUMMARY"
