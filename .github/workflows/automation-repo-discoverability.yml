name: automation-repo-discoverability

# 每周一 20:00（Asia/Shanghai）体检所有公开仓库的「发现性」：
# 能不能被 AI / 人搜到，搜到之后愿不愿意点进来。
#
# 边界（用户 2026-10-20 明确）：本自动化**只读 + 开 issue，不写任何仓库**。
#   · 只读：审计 6 项，不修改任何仓库内容
#   · 写：只在「本仓库」开/改/关 issue
#   · 不写：不改别的仓库的 README / description / topics / llms.txt / 文件
#
# 「怎么按标准执行」由用户与各仓库负责的 AI 约定，不归本自动化管。
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "只打印会改什么，不写仓库、不开 issue"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-repo-discoverability
  cancel-in-progress: false

jobs:
  discoverability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline tests
        working-directory: automations/repo-discoverability
        run: python3 test_discoverability.py

      - name: Audit (read-only)
        id: audit
        # 继续跑后面的步骤，但把"没跑成"记下来交给最后的汇总步骤 —— 以前用
        # `|| true` 直接吞掉，权限不足 / API 失败会留下一个绿色运行。
        continue-on-error: true
        working-directory: automations/repo-discoverability
        env:
          # 跨仓库读公开信息：github.token 只覆盖当前仓库，必须用 PAT
          GH_TOKEN: ${{ secrets.GH_AUDIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          set +e
          python3 audit_discoverability.py --all --owner LyraWang6688
          rc=$?
          set -e
          # 1 = 发现了不合规项，这是每周的预期输出，不是故障（红了会训练人忽略红色）。
          # 2 = 有仓库没审到，数据不完整，必须让这次运行失败。
          if [ "$rc" -gt 1 ]; then
            echo "::error::审计没有完成（exit $rc）—— 有仓库没审到，本次数据不完整"
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "::notice::审计完成，发现不合规项（预期输出，不改变任务状态）"
          fi

      - name: Open / update issues on non-compliant repos
        id: issues
        continue-on-error: true
        working-directory: automations/repo-discoverability
        env:
          # 跨仓库开 issue 必须是 PAT（repo scope）；GITHUB_TOKEN 只能写当前仓库
          GH_TOKEN: ${{ secrets.GH_DISCOVERY_TOKEN || secrets.GH_AUDIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "::notice::dry-run —— 只打印，不开 issue"
            python3 report_issues.py --owner LyraWang6688
          else
            # 每周都会跑：脚本是幂等的（有则改、好则关），不会重复开单
            python3 report_issues.py --owner LyraWang6688 --create
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## repo-discoverability"
            echo ""
            echo "- 标准与证据：\`automations/repo-discoverability/README.md\`"
            echo "- 写 README / 选 topics 的规范：\`automations/repo-discoverability/MAINTAINER-GUIDE.md\`"
            echo "- **本自动化不写任何仓库**：只读审计 + 在本仓库开 issue。"
            echo "- 「怎么按标准执行」由用户与各仓库负责的 AI 约定。"
            echo "- 归档仓库直接跳过（只读）。"
            echo "- issue 是幂等的：同一仓库只维护一条，修好会自动关闭。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 批量行为保留（单仓库失败不影响其余仓库），但"这次没跑全"必须让运行变红，
      # 而不是留一个绿勾让人以为都干净了。
      - name: Fail if the audit or issue step could not complete
        if: always()
        run: |
          audit="${{ steps.audit.outcome }}"
          issues="${{ steps.issues.outcome }}"
          echo "audit=$audit issues=$issues"
          if [ "$audit" != "success" ] || [ "$issues" != "success" ]; then
            echo "::error::发现性任务没有完整跑完（audit=$audit issues=$issues）"
            exit 1
          fi

      # 投递到 DSH 收件箱（契约：orchestrations/scheduled-task/dsh/COLLABORATION.md）。
      - name: Deliver to DSH inbox
        if: always()
        env:
          INBOX_DELIVER_URL: ${{ secrets.INBOX_DELIVER_URL }}
          INBOX_DELIVER_TOKEN: ${{ secrets.INBOX_DELIVER_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ job.status }}" in
            success) result=成功 ;;
            cancelled) result=超时 ;;
            *) result=失败 ;;
          esac
          summary="仓库发现性体检：${result}"
          if [ "${{ inputs.dry-run }}" = "true" ]; then summary="仓库发现性体检：dry-run 预演（未开 issue）"; fi
          bash scripts/inbox-deliver.sh \
            --task repo-discoverability \
            --result "$result" \
            --summary "$summary" \
            --detail "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
