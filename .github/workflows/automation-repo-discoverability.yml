name: automation-repo-discoverability

# 每周一 08:00（Asia/Shanghai）体检所有公开仓库的「发现性」：
# 能不能被 AI / 人搜到，搜到之后愿不愿意点进来。
#
# 两件事，分开做：
#   ① 自动补确定性缺口（description / llms.txt / DSH 徽章）—— 幂等
#   ② 把没过的项开成 issue 派给仓库负责的 AI —— 幂等，修好会自动关闭
#
# topics 永远不自动写 —— 只从 automations/repo-discoverability/topics.plan.json 套用。
on:
  schedule:
    - cron: "0 0 * * 1"        # 00:00 UTC = 08:00 Asia/Shanghai，每周一
  workflow_dispatch:
    inputs:
      dry-run:
        description: "只打印会改什么，不写仓库、不开 issue"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-repo-discoverability
  cancel-in-progress: false

jobs:
  discoverability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline tests
        working-directory: automations/repo-discoverability
        run: python3 test_discoverability.py

      - name: Audit (read-only)
        working-directory: automations/repo-discoverability
        env:
          # 跨仓库读公开信息：github.token 只覆盖当前仓库，必须用 PAT
          GH_TOKEN: ${{ secrets.GH_AUDIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 audit_discoverability.py --all --owner LyraWang6688 || true

      - name: Apply deterministic fixes (description + llms.txt)
        working-directory: automations/repo-discoverability
        env:
          # 跨仓库写：必须是带 repo scope 的 PAT，且由操作者本人授权
          GH_TOKEN: ${{ secrets.GH_DISCOVERY_TOKEN || secrets.GH_AUDIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice::dry-run —— 只打印，不写仓库"
            python3 apply_discoverability.py --owner LyraWang6688
          else
            python3 apply_discoverability.py --owner LyraWang6688 --apply || true
          fi

      - name: Open / update issues on non-compliant repos
        working-directory: automations/repo-discoverability
        env:
          # 跨仓库开 issue 必须是 PAT（repo scope）；GITHUB_TOKEN 只能写当前仓库
          GH_TOKEN: ${{ secrets.GH_DISCOVERY_TOKEN || secrets.GH_AUDIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "::notice::dry-run —— 只打印，不开 issue"
            python3 report_issues.py --owner LyraWang6688 || true
          else
            # 每周都会跑：脚本是幂等的（有则改、好则关），不会重复开单
            python3 report_issues.py --owner LyraWang6688 --create || true
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## repo-discoverability"
            echo ""
            echo "- 标准与证据：\`automations/repo-discoverability/README.md\`"
            echo "- 写 README / 选 topics 的规范：\`automations/repo-discoverability/MAINTAINER-GUIDE.md\`"
            echo "- **topics 不会被自动写入** —— 只在 \`--apply-topics\` 且 topics.plan.json 有条目时才写。"
            echo "- 分支保护会拦住 llms.txt 的提交；脚本报错而不绕过保护，需要人工走 PR。"
            echo "- 归档仓库直接跳过（只读）。"
            echo "- issue 是幂等的：同一仓库只维护一条，修好会自动关闭。"
          } >> "$GITHUB_STEP_SUMMARY"
