name: automation-investdesk-quote-sync

# 每个交易日两次把持仓最新价格写回飞书多维表格。
#
# 为什么放在云端：本机 launchd 在关机/睡眠时不会执行。云端由 GitHub 托管，
# 不依赖任何一台机器开机。执行器与认证方式的对应关系见
# automations/registry.yaml 与 automations/investdesk-quote-sync/README.md。

on:
  # 只有 workflow_dispatch：由自建服务器的 crontab 准点调用。
  # 安装与运维见 automations/investdesk-quote-sync/deploy/SERVER-TRIGGER.md。
  #
  # 这里【故意不再有 schedule】。GitHub 的定时器在本仓库实测延迟 4-5 小时，
  # 而本任务必须赶在次日 09:00 消费方之前落地。改成服务器调 dispatch 之后，
  # 「手动触发」的 run 会立刻开始，不走调度队列。
  #
  # 代价：没有兜底了。若要把保险加回来，在下面加一段低频 cron 即可
  # （例如每周一次），它只会重复一次幂等写入。
  workflow_dispatch:

# 只读仓库；不需要写回任何东西（输出走飞书 API）
permissions:
  contents: read

# 两次触发如果重叠，后一次等待而不是并发写同一张表
concurrency:
  group: investdesk-quote-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 代码在 Store 检出目录，状态（.cache 等）在 runner 的工作目录下
      INVESTDESK_HOME: ${{ github.workspace }}/.investdesk
      # 走 OpenAPI 后端：自建应用凭据，不依赖任何本机 keychain
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      INVESTDESK_BASE_TOKEN: ${{ secrets.INVESTDESK_BASE_TOKEN }}
      INVESTDESK_HOLDINGS_TABLE: ${{ secrets.INVESTDESK_HOLDINGS_TABLE }}
      INVESTDESK_PLATFORMS_TABLE: ${{ secrets.INVESTDESK_PLATFORMS_TABLE }}
      # 行情唯一数据源：万得（免费网页源已在 0.7.0 移除）
      WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
      # 同步完成事件通知：独立应用凭证（cli_aa1c820068f85cb6），与写表凭证分离
      NOTIFY_APP_ID: ${{ secrets.NOTIFY_APP_ID }}
      NOTIFY_APP_SECRET: ${{ secrets.NOTIFY_APP_SECRET }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      # 入口是 TypeScript，Node 22.6+ 可原生执行（类型擦除），无需构建
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 同步持仓价格
        run: node automations/investdesk-quote-sync/sync.ts
