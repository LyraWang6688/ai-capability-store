# Weekly execution of platform-intel 的抓取与提取。
# 原 automations/frontier-watch 已并入 procedures/platform-intel（2026-10-25），
# 文件名保留是为了不断掉 server timer 的 dispatch 目标。
#
# 2026-10-24 起分工变化：
#   * GitHub Actions 只负责「抓原文 + 拉版本号」（海外网络好），不调模型、不写飞书
#   * 抓到的 payload 通过 SSH 推给服务器上的无头 DSH
#   * 服务器 dsh headless 调模型抽取新功能 → 写「AI 工具」Base + 「任务收件箱」+ HTML 报告
#
# Secrets required:
#   FRONTIER_CONFIG_JSON — config.json（含 sources 地址；不含凭据）
#   SSH_HOST / SSH_USER / SSH_KEY — 服务器 SSH 通道（key 是 ed25519 私钥）
#
# 不再需要 FEISHU_APP_ID / FEISHU_APP_SECRET / DEEPSEEK_API_KEY（已移到服务器）。

name: automation-frontier-watch

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Extract + dedupe, print what would be written, write nothing"
        type: boolean
        default: true
      notify-test:
        description: "Send one test message to the Feishu webhook (needs FEISHU_NOTIFY_WEBHOOK)"
        type: boolean
        default: false

# Nothing is written back to the repository, so read-only is enough.
permissions:
  contents: read

concurrency:
  group: automation-frontier-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout automation code (main)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail fast on a malformed config secret
        env:
          FRONTIER_CONFIG_JSON: ${{ secrets.FRONTIER_CONFIG_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          raw = os.environ.get("FRONTIER_CONFIG_JSON") or ""
          if not raw.strip():
              raise SystemExit("FRONTIER_CONFIG_JSON is empty")
          cfg = json.loads(raw)
          missing = [k for k in ("base_token", "table_id") if not str(cfg.get(k) or "").strip()]
          if missing:
              raise SystemExit(f"FRONTIER_CONFIG_JSON is missing: {missing}")
          print(f"config ok — base_token={str(cfg['base_token'])[:6]}… table_id={cfg['table_id']}")
          PY

      - name: Offline test suite (no network, no credentials)
        run: python3 -m unittest procedures/platform-intel/test_extract.py

      - name: Collect sources and versions (no model, no Feishu)
        env:
          FRONTIER_CONFIG_JSON: ${{ secrets.FRONTIER_CONFIG_JSON }}
        run: |
          set -euo pipefail
          python3 procedures/platform-intel/extract.py --emit-all > payload.json
          python3 - <<'PY'
          import json
          d = json.load(open("payload.json"))
          print("sources:", {k: len(v) for k, v in d.get("sources", {}).items()})
          print("versions:", [v.get("feature") for v in d.get("versions", [])])
          if not d.get("sources") and not d.get("versions"):
              raise SystemExit("payload 为空，停止")
          PY

      - name: Push payload to server headless DSH
        if: ${{ inputs.dry-run != true }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/frontier
          chmod 600 ~/.ssh/frontier
          ssh -i ~/.ssh/frontier -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" < payload.json | tee result.json
          python3 -c "import json; d=json.load(open('result.json')); print('ok=', d.get('ok'), 'features=', d.get('features'))"

      - name: Dry run summary
        if: ${{ inputs.dry-run == true }}
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("payload.json"))
          print("dry-run，不推送；版本", len(d.get("versions", [])), "条，源", len(d.get("sources", {})))
          PY
