# Procedures Domain Registry
# Source of Truth for: procedure identity / path / lifecycle status / version /
# entrypoint / runtime.
#
# What this Domain is: the deterministic twin of `skills/`. Both answer "how to do
# it"; the difference is WHO executes — `skills/` is read by a model and needs
# judgment, `procedures/` is run by a machine and can be asserted on. See
# procedures/README.md.
#
# Why it exists: the Store had ~700 lines of deterministic implementation with no
# identity. 24 scripts live inside skills, 9 inside jobs, another ~700 lines under
# scripts/server-timers/. None was registered, so none could be versioned, tested,
# or referenced — which is why the Feishu OpenAPI client got rewritten five times.
# A Domain is what gives code an identity here.
#
# Entry threshold is NOT "it is a script". It is "it has a second consumer, or an
# orchestration references it". A script with exactly one consumer stays inside
# that asset's `scripts/` — moving it here would only scatter `skills/`.
#
# 平铺布局：procedures/<name>/. 分类（browser / computer / api）**不是目录层级**，
# 是未来记录上的字段 —— 与 skills/README.md「分类是 registry 状态，不是目录结构」同理。
#
# schema_version 1: 骨架。本步只建立域与校验规则，不收记录；第一条记录
# （expected: procedures/deepseek-invoice）会同时把记录级规则和它的 fixture 带进来。
schema_version: 1

domain: procedures
description: Procedure identity, path, lifecycle status, version, entrypoint, runtime.

allowed_statuses:
  - draft
  - testing
  - active
  - deprecated
  - archived

# 执行入口需要什么运行时。这是【声明】，不是发现：读记录的人不该去猜
# 那个 .mjs 能不能跑。binary = 自带可执行文件（如编译好的 Swift 工具）。
allowed_runtimes:
  - python
  - node
  - bash
  - binary

procedures:
  platform-intel:
    name: platform-intel
    path: procedures/platform-intel
    status: testing
    version: 0.1.0
    updated: "2026-10-25"
    entrypoint: collect.py
    runtime: python
    commerce: {charge: free}
    notes: >
      四平台（Codex / Claude / DSH / 豆包工作）× 三层的平台信息采集。
      三层 = 产品（它有什么）/ API（开放什么，能不能做插件、能不能被 agent 调）/
      生态（个人能不能上传、怎么收费）。collect.py 是阶段 1：抓源、存快照摘要、
      产可达性报告，不提取字段 —— 提取需要固定页面夹具，见 README。
      它是 procedure 而不是 skill，因为流程确定、要能回归测试；页面里的 prose 靠读，
      那是流水线内部的解析步骤，不是"这件事需要判断"。
  portfolio-holdings:
    name: portfolio-holdings
    path: procedures/portfolio-holdings
    status: testing
    version: 0.1.0
    updated: "2026-10-25"
    entrypoint: dump.ts
    runtime: node
    commerce: {charge: free}
    notes: >
      从飞书多维表格取出持仓（listHoldings + listPlatformNames）。这是 investdesk
      的「取数」那一段，从 automations/investdesk-quote-sync/src/feishu/ 搬出来独立成
      资产：它原来埋在一条定时作业里，没有任何身份。
      两个消费者：quote-sync 作业（取报价标的）与 investdesk-portfolio 这个 skill
      （取数做分析）。按 procedures/README.md 的入域方式①（被复用的实现）够格。
      依赖仍是 automation 的 config（读同样的环境变量）——先把位置放对，参数化留到
      真有第二个部署环境时再做，不为将来的形状提前抽象。
  quote-sync:
    name: quote-sync
    path: procedures/quote-sync
    status: testing
    version: 0.3.0
    updated: "2026-10-25"
    entrypoint: sync.ts
    runtime: node
    commerce: {charge: free}
    notes: >
      每交易日把持仓最新价格写回飞书多维表格：Wind 取价 → 写回 → 飞书通知。
      整块从 automations/investdesk-quote-sync 迁入 —— 它本来就是确定性脚本，
      叫 automation 只是因为它有一个钟；钟归编排层（orchestrations/investdesk/），
      这里只管"怎么做"。取数依赖 procedures/portfolio-holdings。
      deploy/ 暂留本目录：部署物属于执行方式，等编排条目建好后一并迁走。
  deepseek-invoice:
    name: deepseek-invoice
    path: procedures/deepseek-invoice
    status: testing
    version: 0.1.3
    updated: "2026-10-25"
    entrypoint: run.mjs
    runtime: node
    commerce: {charge: free}
    notes: >
      给 DeepSeek 开放平台账户的余额申请企业增值税普通发票：headless Chromium 打开
      账单页 → 校验登录态 → 读可开票金额 → 填抬头/税号/邮箱 → 提交 → 验证成功提示。
      零模型参与，纯确定性。从已撤销的 computer-automation 域迁入：
      界面档案进 orchestration 任务的 README，脚本留在这里。
      界面事实（选择器、登录锚点、抬头下拉的坑）随 README 一起在本目录，因为改版时
      脚本和选择器是同一次改动 —— 但"这个界面是否还能用"记在编排任务的验证状态里。
  weread-reading-sync:
    name: weread-reading-sync
    path: procedures/weread-reading-sync
    status: testing
    version: 0.1.0
    updated: "2026-10-26"
    entrypoint: collect.py
    runtime: python
    commerce: {charge: free}
    notes: >
      把微信读书的「已读完」与「最近 N 天打开未读完」同步到飞书多维表格两张表
      （已读书籍 / 在读书籍）。接口 /shelf/sync 取书架，/book/getprogress 逐本核验。
      口径写死：读完 = progress >= 98（2026-10-26 从 100 放宽，且不要求 finishTime）。
      原因：书末的附录/后记/致谢常被跳过，微信读书不会触发"读完"事件，进度停在 98/99
      且没有 finishTime —— 按 100 判定会把读过的书永远留在在读列表。
      读完时间优先 finishTime，缺失时退回最近阅读时间（实测 21 本属于这种情况）。
      在读 = 未读完且最近阅读落在窗口内（默认 60 天）。
      入域理由：两个消费者 —— cron 定时与一条薄 skill 入口，且判定口径必须固化成
      assert，不能每次让模型现推（同一份数据按"标记"和"事实"两种口径会得出 78 / 81 /
      85 三个不同答案，这正是脚本存在的理由）。
      已知边界：书若已从书架移除，接口取不到，故结果会略少于官方 readStat 统计。
  investdesk-funding-news:
    name: investdesk-funding-news
    path: procedures/investdesk-funding-news
    status: testing
    version: 0.1.0
    updated: "2026-10-26"
    entrypoint: collect.py
    runtime: python
    commerce: {charge: free}
    notes: >
      投融资事件采集：固定 8 家公司（国内腾讯/阿里/字节/DeepSeek + 海外英伟达/谷歌/OpenAI/苹果），
      支持 --mode fetch/write 拆分：fetch 只调万得产出 payload（GitHub Actions 用），
      write 只把 payload 写进飞书（服务器用，持有 lark-cli user 身份）。
      万得走 MCP over HTTP 直连，不依赖本机安装的万得 skill。
      走 Wind 的 financial_docs.get_financial_news 取新闻，按写死的规则做事件分类、
      金额原文抽取、可信度分级，写入飞书「王颖的财富管理」Base 的「投融资事件」表。
      三条纪律进代码：金额只录原文不换算、只采集不做建议、每条带来源与可信度。
      已知局限：同一事件不聚合（同期 4 篇报道就是 4 行）；可信度靠关键词会低估；
      公司列表写死；未上市公司无官方口径。
      顺带记录一个平台事实：get_company_announcements 的语料是 A 股公告库，
      港股（腾讯/阿里）与未上市公司查不到，只能走新闻通道。
  investdesk-daily-context:
    name: investdesk-daily-context
    path: procedures/investdesk-daily-context
    status: testing
    version: 0.1.0
    updated: "2026-10-26"
    entrypoint: collect.py
    runtime: python
    commerce: {charge: free}
    notes: >
      持仓分析的当日上下文：大盘快照（6 个指数）+ 持仓相关新闻（按市值取前 N 只）。
      直连万得 MCP over HTTP（先 initialize 再 tools/call，响应可能是 SSE），
      照 procedures/quote-sync 的既有做法，因此不依赖本机安装的万得 skill。
      只取数不判断：什么算"值得关注的新闻"由 investdesk-portfolio 这个 skill 决定。
      口径：交易日取万得返回的「最新交易日」而不是系统日期；成交额单位是元，展示转亿；
      新闻必须带标题+日期+来源链接，缺链接不进结果。
      成本：1 次大盘 + N 次新闻（默认 15 → 16 次/跑）。
