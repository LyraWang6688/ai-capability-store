  # ── 基础设施层：四个平台 ────────────────────────────────────────────
  # 这一层回答"系统/浏览器给我们开了什么 AI 接口"。它比产品层变得快：
  # Chrome 六周一个版本，macOS/iOS 点版本也在加接口，不是一年一变。
  chrome-release-notes:
    url: "https://developer.chrome.com/release-notes"
    kind: html
    verified: null
    layer: infrastructure
  chrome-platform-status:
    # 用它的 API 而不是 /features 页面：那页是 SPA，浏览器打开也读不到正文（thin）。
    # API 直接返回 JSON，且带 total_count，能算「本周新增了多少 feature」。
    url: "https://chromestatus.com/api/v0/features?num=20"
    kind: json
    verified: null
    layer: infrastructure
    note: 按 feature 看"哪个版本开始能用了"，比 release notes 更早
  chrome-built-in-ai:
    url: "https://developer.chrome.com/docs/ai/built-in"
    kind: html
    verified: "2026-10-25"
    layer: infrastructure
    note: 实测 Chrome 内置 AI 可用（LanguageModel.availability() → "available"，prompt 约 2-3 秒，支持 responseConstraint 结构化输出）。注意：2026 年 API 已从 window.ai 改名为全局 LanguageModel
  macos-whats-new:
    url: "https://developer.apple.com/macos/whats-new/"
    kind: html
    verified: null
    layer: infrastructure
  macos-release-notes:
    url: "https://developer.apple.com/documentation/macos-release-notes"
    kind: html
    verified: null
    layer: infrastructure
  ios-whats-new:
    url: "https://developer.apple.com/ios/whats-new/"
    kind: html
    verified: "2026-10-25"
    layer: infrastructure
  ios-release-notes:
    url: "https://developer.apple.com/documentation/ios-ipados-release-notes"
    kind: html
    verified: null
    layer: infrastructure
  android-versions:
    url: "https://developer.android.com/about/versions"
    kind: html
    verified: null
    layer: infrastructure
  android-gemini-nano:
    url: "https://developer.android.com/ai/gemini-nano"
    kind: html
    verified: null
    layer: infrastructure

  # ── 豆包：没有官方更新日志，只有模型文档 + 媒体 ────────────────────
  doubao-model-changelog:
    url: "https://docs.volcengine.com/docs/ark/latest-model"
    kind: html
    verified: null
    layer: model
    note: 豆包模型更新的官方登记处（火山方舟文档），可抓
  doubao-work-news:
    url: null
    kind: html
    verified: null
    layer: product
    fetchable: false
    note: 豆包工作没有官方更新日志页；www.doubao.com 直接跳 /chat/ 的纯 JS 应用，HTML 里无内容；app 包里也没有 changelog（实测 v2.33.7）。只能靠公众号「豆包工作」+ 科技媒体报道（chinaz/ithome/21jingji）

platforms:
  codex:
    product:
      - point: 它有哪些产品形态（CLI / IDE 扩展 / 云端 / 宿主内）
        from: [codex-docs, codex-releases]
        extract: 产品页列出的产品线 → 记形态与运行平台
      - point: 发布节奏与是否成型
        from: [codex-releases]
        extract: 最近 10 个 release 的时间间隔 + 是否有独立文档站
      - point: 它自己宣称的核心功能
        from: [codex-docs]
        extract: 产品页首屏的功能列表 3–8 条
    api:
      - point: 插件用什么规范文件、放哪
        from: [codex-plugins-portal, agent-plugins-spec]
        extract: 提交要求里写明的必需文件与目录结构
      - point: 插件能注册哪几类能力（tool / command / panel / MCP server…）
        from: [codex-plugins-portal]
        extract: 文档里的能力类型清单
      - point: 插件在哪端生效（桌面 / IDE / 云端 / 移动）
        from: [codex-plugins-portal]
        extract: 准入说明里对生效环境的限定
      - point: 权限模型（能不能读文件 / 起子进程 / 联网）
        from: [codex-plugins-portal]
        extract: 安全与权限章节
      - point: CLI 包名与稳定性
        from: [codex-releases]
        extract: release 里出现的包名 / 安装命令
      - point: agent 怎么调它（CLI / API / MCP）
        from: [codex-docs]
        extract: 文档的 API 与 MCP 章节
    ecosystem:
      - point: 个人能不能上传插件
        from: [codex-plugins-portal]
        extract: 提交资格与准入条件
      - point: 要不要审核、多久
        from: [codex-plugins-portal]
        extract: 审核流程说明
      - point: 平台上有没有付费条目、怎么定价（一次性 / 订阅 / 内购）
        from: [codex-plugins-portal]
      - point: 平台对开发者的分成比例 / 结算方式
        from: []
        blocked: 平台内部文档，不对外公布；等真要上架时向平台确认，暂不追踪
        blocked: 未找到官方定价或分成说明；门户里若无开发者条款，这一格只能记"无官方机制"

  claude:
    product:
      - point: 它有哪些产品（应用 / Claude Code / API）
        from: [claude-release-notes, claude-plugins-publish]
        extract: 从文档与发布说明交叉确认产品边界
      - point: 发布节奏
        from: [claude-release-notes]
        extract: 发布说明的条目日期间隔
      - point: 插件体系覆盖哪些产品
        from: [claude-plugins-publish]
        extract: 文档里写明的适用产品（CLI / IDE / 桌面）
    api:
      - point: 插件规范文件（plugin.json / marketplace.json）
        from: [claude-plugins-publish, agentskills-spec]
        extract: 必需文件、目录结构、frontmatter 白名单
      - point: 安装入口（命令 / URL / 共享盘）
        from: [claude-marketplace-hosting]
        extract: "`/plugin marketplace add` 支持的来源类型"
      - point: 私有分发怎么做
        from: [claude-marketplace-hosting]
        extract: private git、archive + headers + sha256 的具体要求
      - point: 权限模型与安全边界
        from: [claude-plugins-security]
        extract: 插件能做什么、被限制什么
      - point: agent 怎么调外部能力（MCP 传输 + 认证）
        from: [claude-mcp]
        extract: stdio / http / sse / ws + OAuth2 / DCR
      - point: Skill 的规范与发现位置
        from: [agentskills-spec]
        extract: SKILL.md 必填字段 + 客户端发现规则
    ecosystem:
      - point: 个人能不能上传、走哪条路
        from: [claude-plugins-publish, claude-marketplace-hosting]
        extract: 官方目录 vs 社区目录的准入差别
      - point: 生态有多活（第三方插件数量）
        from: [claude-marketplace-hosting]
        extract: 目录里的插件条数
      - point: 平台收不收费、有没有结算
        from: [claude-plugins-publish]
        extract: 文档里有无价格/结算字段（目前结论：没有）
      - point: 平台上有没有付费条目、怎么定价（一次性 / 订阅 / 内购）
        from: [claude-marketplace-hosting]
      - point: 平台的分成比例 / 结算方式
        from: []
        blocked: 平台内部文档，不对外公布；等真要上架时向平台确认，暂不追踪
        blocked: 官方文档无相关机制；第三方"抽成 15%"说法未获证实，不采信

  dsh:
    product:
      - point: 它有哪些产品形态（桌面端 / CLI / 插件页）
        from: [dsh-plugin-market, dsh-releases]
        extract: 市场文档 + 桌面版 feed 的版本线
      - point: 发布节奏
        from: [dsh-releases, dsh-npm]
        extract: release 间隔 + 桌面版 releaseDate
      - point: 插件体系在哪些产品上生效
        from: [dsh-plugin-market]
        extract: 市场文档写明的适用端
    api:
      - point: 插件怎么安装（命令 / 包形态）
        from: [dsh-plugin-market, dsh-npm]
        extract: "`dsh plugin add` 的用法 + npm 包信息"
      - point: 插件规范文件与目录结构
        from: [dsh-plugin-market]
        extract: Cordis bundle 的结构要求
      - point: 技能放哪、怎么被发现
        from: [dsh-skills-subsystem]
        extract: "`.dsh/skills` 与 `.agents/skills` 的扫描规则"
      - point: 宿主提供了哪些可挂钩的槽位
        from: [dsh-plugin-market]
        extract: slot 清单（本仓库 5 个插件是活证据）
      - point: agent 怎么调它（CLI）
        from: [dsh-npm]
        extract: bin 名称与入口
    ecosystem:
      - point: 个人能不能上架插件
        from: [dsh-plugin-market]
        extract: 市场是否开放提交、是否仍 experimental
      - point: 有没有审核 / 资质要求
        from: [dsh-plugin-market]
        extract: 提交说明
      - point: 平台上有没有付费条目、怎么定价（一次性 / 订阅 / 内购）
        from: [dsh-plugin-market]
      - point: 平台的分成比例 / 结算方式
        from: []
        blocked: 平台内部文档，不对外公布；等真要上架时向平台确认，暂不追踪
        blocked: 未找到任何收费或分成说明

  doubao-work:
    product:
      - point: 产品形态与版本
        from: []
        blocked: 无公开信源；只能本机实测（见 orchestrations/computer-automation/ 里那条任务的界面档案）
        extract: 本机实测（App 版本、内核版本）
      - point: 插件体系有哪几类、各有几个
        from: []
        blocked: 无公开信源；只能本机实测（见 orchestrations/computer-automation/ 里那条任务的界面档案）
        extract: 实测界面计数（技能 / 连接器 / 伙伴）
      - point: 核心功能清单
        from: []
        blocked: 无公开信源；只能本机实测（见 orchestrations/computer-automation/ 里那条任务的界面档案）
        extract: 实测界面里的功能入口
    api:
      - point: 自定义连接器能否连公网 / 范围限制
        from: []
        blocked: 无公开信源；只能本机实测（见 orchestrations/computer-automation/ 里那条任务的界面档案）
        extract: 实测表单原文 + 本机 HTTP 连通性
      - point: 技能怎么安装（对话新建 / 上传）
        from: []
        blocked: 无公开信源；只能本机实测（见 orchestrations/computer-automation/ 里那条任务的界面档案）
        extract: 实测安装路径
      - point: 有没有开放 CLI / API
        from: []
        blocked: 未找到任何公开接口文档；实测亦未见 CLI
      - point: MCP 支持形态
        from: []
        blocked: 无公开信源；只能本机实测（见 orchestrations/computer-automation/ 里那条任务的界面档案）
        extract: 实测本机 HTTP MCP 能否被调用
      - point: 插件在哪端生效
        from: []
        blocked: 无公开信源；只能本机实测（见 orchestrations/computer-automation/ 里那条任务的界面档案）
        extract: 实测：仅桌面 App，无移动端插件入口
    ecosystem:
      - point: 个人能不能上传插件 / 技能
        from: []
        blocked: 无公开信源；只能本机实测（见 orchestrations/computer-automation/ 里那条任务的界面档案）
        extract: 实测有无公开上传通道
      - point: 平台收不收费 / 有没有分成
        from: []
        blocked: 未找到任何公开收费或分成说明
