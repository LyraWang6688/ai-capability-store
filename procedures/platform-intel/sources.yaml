  # DSH
  dsh-plugin-market:
    url: "https://deepseek-harness.github.io/deepseek-harness/en/guide/plugin-market.md"
    kind: md
    verified: "2026-10-25"
    note: 市场仍标 experimental
  dsh-skills-subsystem:
    url: "https://deepseek-harness.github.io/deepseek-harness/en/reference/subsystems/skills.md"
    kind: md
    verified: "2026-10-25"
  dsh-npm:
    url: "https://registry.npmjs.org/@deepseek-ai/dsh"
    kind: json
    verified: "2026-10-25"
    note: 包存在；具体 bin 名待核
  dsh-releases:
    url: "https://api.github.com/repos/deepseek-ai/deepseek-harness/releases?per_page=10"
    kind: json
    verified: null
  # dsh-desktop-feed: 已移除 —— download.deepseek.com/dsh-desk/feeds 路径已失效（COS NoSuchKey 404，5 个变体全 404）。版本信息由 dsh-releases 与 dsh-npm 覆盖
  deepseek-news:
    url: "https://api-docs.deepseek.com/sitemap.xml"
    kind: xml-sitemap
    verified: "2026-10-25"
    layer: model
    note: 没有 news 索引页，新闻是 /news/newsMMDD 独立页；定期抓 sitemap 与上次比对，新增的 /news/* 即新公告
  deepseek-github:
    url: "https://api.github.com/repos/deepseek-ai/DeepSeek-V3/releases?per_page=10"
    kind: json
    verified: null
    layer: model
  gemini-changelog:
    url: "https://ai.google.dev/gemini-api/docs/changelog"
    kind: html
    verified: null
    layer: model
  gemini-blog:
    url: "https://blog.google/technology/ai/"
    kind: html
    verified: null
    layer: model
  openai-changelog:
    url: "https://platform.openai.com/docs/changelog"
    kind: html
    verified: null
    layer: model
  claude-api-releases:
    url: "https://docs.anthropic.com/en/release-notes/api"
