# 源矩阵 —— 每个平台 × 每一层 × 每个具体抓取点 × 信源
#
# 结构：
#   sources    信源字典（id → URL / 类型 / 上次抓取结果）。一个信源可服务多个抓取点。
#   platforms  每个平台三层，每层列出【具体抓取点】和它引用哪些信源。
#
# 规则：
#   1. 抓取点写"我们要知道什么"，不写字段名。
#   2. 每个点必须至少引用一个信源；没有信源的写 `from: []` + `blocked:` 说明为什么。
#   3. 信源 url: null 表示"还没找到该看哪儿"，与"抓不到"是两回事。
#   4. 测试保证：每个点引用的信源 id 必须在 sources 里存在（不许悬空引用）。
schema_version: 2

# ── 信源字典 ────────────────────────────────────────────────────────────
