    kind: html
    verified: "2026-10-25"
    note: 是 Claude 应用的发布说明，不等于 Claude Code 的规范变化
  claude-plugins-publish:
    url: "https://code.claude.com/docs/en/plugins/publish"
    kind: html
    verified: "2026-10-25"
  claude-marketplace-hosting:
    url: "https://code.claude.com/docs/en/plugins/host-marketplace"
