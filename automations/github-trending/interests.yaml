# 关注清单 — 每日 / 周度报告的维度二就靠这个文件
#
# 报告的权威结构在 [`REPORT-CONTRACT.md`](./REPORT-CONTRACT.md)：
#   · 维度一 1.3「这些和我的关注有什么关联」要读本文件
#   · 维度二「我关注的方向上，有没有人在做相似的事」整段要读本文件
#
# 为什么在仓库里而不是本地：内容是技术方向 + 已公开的项目名，不涉隐私；
# 放进仓库才能版本化（能看到关注怎么演变）、才能 review、才能随机器迁移。
#
# 维护约定：
#   1. 用户表达新的关注方向 → 加一条，并把 updated 改成当天
#   2. 某个 core 连续多周「没看到有人在做 + 我也没进展」→ 降级或删除
#   3. 方向做完了 → 直接删，不要在 open_questions 里留僵尸条目

updated: "2026-10-18"

# 三级，决定报告里给多少注意力
levels:
  core: "直接相关 —— 必须给结论（有/没有进展 + 有没有人在做相似的事），没有就明写没有"
  watch: "在关注 —— 有值得看的就说，没有就整条跳过，不写占位"
  observe: "留意 —— 只在特别相关时提一句"

# 字段说明：
#   name            必填。方向名，报告里直接用这个标题
#   level           必填。core / watch / observe
#   question        必填。待解的问题，不是领域名词
#   keywords        建议填。用于匹配 topic_frequency 和仓库 topics
#   current_state   建议填。已经做到哪了；报告判断处境时要用
#   open_questions  建议填。还缺什么；周报「下周值得盯」从这里挑

