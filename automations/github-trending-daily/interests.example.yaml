# 关注清单 — 格式说明与示例
#
# ⚠️ 这个文件是 SCHEMA 示例，不进生产。真实清单放在：
#      ~/.automation-state/github-trending/interests.yaml
#    原因：关注清单是个人上下文，而本仓库是公开的。
#
# 每日 / 周度报告的第 ③ 维「和我关注的有什么相关」完全依赖这份清单。
# 清单不准，映射就全是猜的。
#
# 维护约定：
#   1. 用户表达新的关注方向时 → 加一条，并把 updated 改成当天
#   2. 某个 core 连续 3 周处境都是「无人区 / 落后」→ 建议降级或删除
#   3. 方向做完了 → 从清单删掉，不要在 open_questions 里留僵尸条目

updated: "YYYY-MM-DD"

# 三级，决定报告里给多少注意力
levels:
  core: "直接相关 —— 必须给结论（有/没有进展 + 处境判断），没有就明写没有"
  watch: "在关注 —— 有值得看的就说，没有就整条跳过，不写占位"
  observe: "留意 —— 只在特别相关时提一句"

# 每条至少要有 name / level / question；其余字段让报告更有依据
interests:
  # ── 完整示例：一个 core 方向 ──────────────────────────────────────
  - name: 自动化分层与稳定性
    level: core
    # question 是这条记录的核心 —— 它回答「我到底想解决什么问题」。
    # 写成领域名词没有信息量（"想做自动化"），要写成待解的问题。
    question: "API → 协议/CLI → UI 元素树 → 截图视觉，怎么选、怎么定优先级"
    # keywords 用来把热点话题匹配到这个方向。宁可少而准，不要凑。
    keywords: [computer-use, gui-agent, browser-automation, cdp, applescript, accessibility]
    # current_state 让我知道「已经做到哪」—— 报告判断「领先/同步」时需要它
    current_state: "已确认四层优先级原则；收集了若干 GUI agent 与 Mac 自动化方案"
    # open_questions 是「还缺什么」—— 周报的「下周值得盯」优先从这里挑
    open_questions: "Mac 上哪些场景该用 AppleScript 而不是 GUI agent；GUI 方案何时该迁走"

  # ── 精简示例：一个 watch 方向 ────────────────────────────────────
  - name: 示例观察方向
    level: watch
    question: "这个方向我还只是好奇，还没投入"
    keywords: [some-keyword]
    current_state: ""
    open_questions: ""

  # ── 字段说明 ────────────────────────────────────────────────────
  # name            必填。方向名，报告里直接用这个标题
  # level           必填。core / watch / observe
  # question        必填。待解的问题，不是领域名词
  # keywords        建议填。用于匹配 topic_frequency 和仓库 topics
  # current_state   建议填。已经做到哪了；报告判断处境时要用
  # open_questions  建议填。还缺什么；周报「下周值得盯」从这里挑
