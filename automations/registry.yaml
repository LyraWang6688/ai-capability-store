# Automation Domain Registry
# Source of Truth for: automation identity / path / lifecycle status / version /
# trigger kind / executor / runner descriptor / output contract.
#
# The cron expression is NOT recorded here. For a github-actions automation it
# lives only in the bound workflow file — see automations/README.md
# §"The cron lives in exactly one place".
#
# schema_version 2 (breaking): `workflow` was unconditionally required, which made
# a launchd-driven automation unrepresentable. `executor` now names WHO runs it and
# each executor requires exactly its own descriptor:
#   github-actions -> workflow
#   launchd        -> launchd {label, template}
#   human          -> neither
# `output` gained `target`, because not every automation writes to the data branch.
schema_version: 2

domain: automations
description: Automation identity, path, lifecycle status, version, trigger kind, bound workflow, output contract.

allowed_statuses:
  - draft
  - testing
  - active
  - deprecated
  - archived

allowed_trigger_kinds:
  - daily
  - weekly
  - monthly
  - quarterly
  - manual
  - event

# WHO runs it. Distinct from trigger_kind (how often).
allowed_executors:
  - github-actions
  - launchd
  - systemd
  - human

automations:
  github-trending-daily:
    name: github-trending-daily
    path: automations/github-trending/daily
    entrypoint: scan.py
    status: testing
    version: 0.6.1
    updated: "2026-10-24"
    trigger_kind: daily
    executor: github-actions
    workflow: .github/workflows/automation-github-trending-daily.yml
    external_trigger: scripts/server-timers/systemd/github-trending-daily.timer
    output:
      target: external-system
      destination: "DSH 收件箱 + https://automation.bamamei.online/reports/github-trending-daily/<date>.html"
    description: >
      采集 GitHub Trending 日榜与周榜、以及近 7 天新建的高星仓库，附话题频次直方图。
    notes: >
      0.6.1 起两段式：Actions 只抓数据（不调模型、不写飞书），SSH 推给服务器 DSH；
      服务器判断有无变化、需要时调 DeepSeek 出报告、渲染 HTML 到 automation.bamamei.online、
      写飞书 Base 与任务收件箱。`data` 分支仍保留原始快照（给 weekly 聚合，属归档）。

  github-trending-weekly:
    name: github-trending-weekly
    path: automations/github-trending/weekly
    entrypoint: aggregate.py
    status: testing
    version: 0.2.1
    updated: "2026-10-24"
    trigger_kind: weekly
    executor: github-actions
    workflow: .github/workflows/automation-github-trending-weekly.yml
    external_trigger: scripts/server-timers/systemd/github-trending-weekly.timer
    output:
      target: external-system
      destination: "DSH 收件箱 + https://automation.bamamei.online/reports/github-trending-weekly/<date>.html"
    description: >
      读取 data 分支最近 7 天的日快照，聚合出话题持续度、仓库一周净增星、
      一日热度与常驻项目。
    notes: >
      0.2.1 起两段式：Actions 只做聚合（不调模型、不写飞书），SSH 推给服务器 DSH；
      服务器判断/调模型/出周报 HTML/写收件箱。`data` 分支仍保留每周聚合（归档）。
      不足 3 天数据时只报 note，不硬下趋势结论。

  github-portfolio-snapshot:
    name: github-portfolio-snapshot
    path: automations/github-portfolio-snapshot
    entrypoint: snapshot.py
    status: testing
    version: 0.3.1
    updated: "2026-10-24"
    trigger_kind: monthly
    executor: github-actions
    workflow: .github/workflows/automation-github-portfolio-snapshot.yml
    external_trigger: scripts/server-timers/systemd/github-portfolio-snapshot.timer
    output:
      target: external-system
      destination: "DSH 收件箱 + Feishu Base「项目管理」：Repo Snapshot History / Snapshot Runs / Deleted Repos"
    description: >
      每月对 GitHub 账号下的仓库做一次状态快照：存在哪些仓库、相对上一期有什么变化、
      各自处于什么活性档位与可发现性得分，写入飞书 Base。
    notes: >
      0.3.1 起两段式：Actions 只抓仓库元数据（SNAPSHOT_GH_TOKEN），SSH 推给服务器 DSH；
      服务器写三张 Base 表并写任务收件箱，Actions 不再持有 FEISHU_APP_ID / FEISHU_APP_SECRET。

      0.2.0 起从 launchd 迁到 github-actions，同时把传输层从 lark-cli 子进程改成
      直连飞书 OpenAPI（tenant_access_token，凭据走 FEISHU_APP_ID / FEISHU_APP_SECRET）。

      迁移前不可行的原因（0.1.0 的 notes 记录过）：lark-cli 只有 user 身份可用，令牌
      在操作者本机 keychain 里，hosted runner 没有 keychain；而 bot 身份缺
      base:record:read（实测 app_scope_not_applied / 99991672）。现在改用专用飞书应用
      + 6 个 base scope（block:read / record:read / record:create / record:delete /
      field:read / field:create），runner 上不再需要任何本机状态。

      credentials 边界：app_id 可以写进 config（非密钥）；app_secret 只从环境变量
      FEISHU_APP_SECRET 读，绝不落盘到 config 或仓库。tenant_access_token 在进程内
      缓存、提前 3 分钟过期，收到 99991661 / 99991663 时重取一次。

      0.3.0 补齐三件（0.2.0 之后分三次合并）：① GitHub 身份守卫 —— fetch_repos
      走 GraphQL viewer，token 属于谁就快照谁，CI 里误用 GITHUB_TOKEN 会把
      github-actions[bot] 的 1 个仓库当成操作者的全部，且原本只打印一行就继续，
      现在直接中止；② field-list 补 offset/limit —— 不带分页参数时接口返回空
      列表且不报错，此前把已有的 13 个字段全判成缺失，真实运行会给表加重复列；
      ③ workflow_dispatch 新增 force 输入，用于重跑同一期间。

      本自动化只读 GitHub、只写自己的飞书表。它写的 lifecycle_action
      （Keep / Archive / Delete）是建议标签，不是执行动作 —— 无人值守的作业
      只应做不可能后悔的事，真正的归档/删除仍由人执行。

      output.target 为 external-system：目标不在本仓库控制范围内，校验器只能记录
      这个声明，无法验证外部写入。通过校验不等于写入成功。

  repo-discoverability:
    name: repo-discoverability
    path: automations/repo-discoverability
    entrypoint: report_issues.py
    status: testing
    version: 0.2.1
    updated: "2026-10-23"
    trigger_kind: weekly
    executor: github-actions
    workflow: .github/workflows/automation-repo-discoverability.yml
    external_trigger: scripts/server-timers/systemd/repo-discoverability.timer
    output:
      target: external-system
      destination: >
        ① 每个不合规仓库开/更新一条 issue（幂等，修好自动关闭）；
        ② Actions step summary
    description: >
      每月体检名下所有公开 GitHub 仓库的「发现性」——让 AI 和别人能搜到它。
      6 项按证据强度分级：topics(布尔门) / description / README 前三行 为实测项，
      llms.txt / AGENTS.md / DSH 徽章 为生态约定。
      **只读 + 开 issue，不写任何仓库** —— 不合格就开 issue 派给仓库负责的 AI，
      「怎么按标准执行」由用户与各仓库 AI 约定，不归本自动化。
    notes: >
      为什么是 Automation：触发由时钟决定（每周一晚 20:00），不需要人或模型参与。
      issue 幂等：同一仓库只维护一条（带隐藏 marker），修好会自动关闭，不会每周堆单。
      跨仓库开 issue 需要 PAT（repo scope）—— GITHUB_TOKEN 只能写当前仓库。
      与 repo-baseline-audit 分工：那个修内功（安全/CI/合并纪律），这个修外功（能不能被找到）。
      归档仓库直接跳过（只读）。写入边界是硬的：本自动化不改任何仓库文件。
      0.2.1（patch）：workflow 不再用 `|| true` 吞掉失败。以前审计和 issue 两处都
      吞，权限不足 / API 失败 / issue 写入失败都能留下一个绿色运行。现在单仓库失败
      仍不影响其余仓库（脚本内部继续），但 workflow 会以非零结束；并且把
      audit_discoverability.py 的退出码拆开：1 = 发现不合规项（每周常态，不算故障），
      2 = 有仓库没审到（数据不完整，必须红）。配套的单测固定住这两个码。
  repo-baseline-audit:
    name: repo-baseline-audit
    path: automations/repo-baseline-audit
    entrypoint: run_audit.py
    status: testing
    version: 0.2.4
    updated: "2026-10-20"
    trigger_kind: weekly
    executor: github-actions
    workflow: .github/workflows/automation-repo-baseline.yml
    external_trigger: scripts/server-timers/systemd/repo-baseline-audit.timer
    output:
      target: external-system
      destination: "飞书知识库「GitHub 优质项目收录」多维表格：仓库基线体检"
    description: >
      每周一 09:00（Asia/Shanghai）批量审计名下所有 GitHub 仓库（公开 + 私有；默认跳过已归档与 fork）的公开项目基线
      （17 项：安全 / 合并纪律 / CI / 可维护 / 可扩展），每项 PASS/FAIL/UNKNOWN，
      结果写入飞书 Base「仓库基线体检」表（一行一个仓库 + 不合格项清单）。
    notes: >
      为什么是 Automation：触发由时钟决定（每月 1 号），不需要人或模型参与；
      只审计、不改任何仓库设置。UNKNOWN 表示查不到而不是没开。
      report.py 供本机 DSH 定时任务读取最近 7 天结果，在会话里生成周报。
      0.2.4：只为「不合格且还没有 [baseline] issue」的仓库开一次 issue，不做周度评论；
      周报只通过本机 DSH 定时任务在会话里给出。
      原为 skill repo-baseline（0.1.1），按用户要求整体迁入 Action 并删除 skill。
  frontier-watch:
    name: frontier-watch
    path: automations/frontier-watch
    entrypoint: watch.py
    status: testing
    version: 0.7.1
    updated: "2026-10-19"
    trigger_kind: weekly
    executor: github-actions
    workflow: .github/workflows/automation-frontier-watch.yml
    external_trigger: scripts/server-timers/systemd/frontier-watch.timer
    output:
      target: external-system
      destination: "Feishu Base「AI 工具」多维表格：前沿功能与插件灵感"
    description: >
      每周一 10:00（Asia/Shanghai）抓取 Codex Releases 与 Claude 发布说明，用模型提取
      「新增产品功能」，按功能名去重后写入飞书 Base 的「前沿功能与插件灵感」表，
      供后续把好用的功能做成 DSH 插件。
    notes: >
      为什么是 Automation：触发由时钟决定（周一 10:00），不是人或模型决定。
      0.2.0 从 launchd 迁到 github-actions：0.1.x 用 launchd + 本机 lark-cli 的 user 令牌
      写 Base（钥匙串在宿主 runner 上不存在），因此 Mac 关机即断档。迁移后走飞书
      「应用身份」tenant_access_token（与 github-portfolio-snapshot 共用同一个自建应用），
      CI 上不需要任何本机状态；去重改为每次读取 Base 内全部「功能/灵感」名称，不再依赖本地 state 文件。
      豆包工作没有公开 changelog、公众号也无法抓取，0.3.0 起改用公开报道兜底：
      Google News / Bing News 的 RSS 搜索结果（CI runner 在海外可访问；两源互为备份，
      失败即跳过），模型只从新闻标题+摘要里提取功能，来源记为公开报道。
      表格里 2026-10-19 之前的历史条目为人工补充。
      0.4.0：新增可选飞书通知——有新增条目就推一条文本摘要（最多 8 条 + Base 链接）；
      可用 workflow_dispatch 的 notify-test 输入立刻验证。0.5.0：通知默认走**私聊**——
      复用写 Base 的同一个飞书应用（应用身份 + 操作者 p2p chat_id，secret FEISHU_NOTIFY_CHAT_ID），
      群 webhook（FEISHU_NOTIFY_WEBHOOK）降级为兜底；通知失败不影响写入。
      0.5.1：通知可用独立应用（FEISHU_NOTIFY_APP_ID / FEISHU_NOTIFY_APP_SECRET）——
      发消息的应用必须是目标会话成员，写 Base 的专用应用通常不在私聊里（实测 230002）。
      0.5.2：按操作者要求移除群 webhook 兜底，通知只走私聊一条通道。
      0.6.0：改为「云端采集 + 本地会话汇报」（与 github-trending 同一模式）——CI 只写 Base，
      不再需要任何飞书通知 Secret；本机 DSH 定时任务跑 report.py（读 Base 最近 7 天
      frontier-watch 条目）后在会话里生成周报。
      只采集事实与可行性判断，不开发插件、不改仓库、不删已有记录。
      output.target=external-system：目标是外部 Base，校验器只能记录声明，通过校验不等于写入成功。
      凭据边界：FEISHU_APP_ID 可公开；FEISHU_APP_SECRET 与 DEEPSEEK_API_KEY 只放 GitHub Secrets；
      Base token/表 id 放 FRONTIER_CONFIG_JSON secret（非密钥但标识操作者的 Base）。

  investdesk-quote-sync:
    name: investdesk-quote-sync
    path: automations/investdesk-quote-sync
    entrypoint: sync.ts
    status: testing
    version: 0.1.0
    updated: "2026-10-17"
    trigger_kind: daily
    executor: github-actions
    workflow: .github/workflows/automation-investdesk-quote-sync.yml
    # 谁敲钟。GitHub 的 schedule 在本仓库实测延迟 4-5 小时，对「必须赶在次日
    # 09:00 消费前落地」的任务太晚；改由自建服务器的 crontab 准点调
    # workflow_dispatch，workflow 自身的 cron 已移除。
    external_trigger: scripts/server-timers/systemd/investdesk-quote-sync.timer
    output:
      target: external-system
      destination: "飞书多维表格：持仓价格表"
    description: >
      每个交易日一次（北京 20:00），把全部持仓的最新价格写回飞书多维表格。
      自包含实现：取价（Wind）、飞书读写、汇总逻辑都在 automations/investdesk-quote-sync/src/ 下，
      不再依赖 external-capabilities 里的能力包（原先共用的 MCP 形态已不再需要）。
      20:00 时 A 股收盘价已定、场外基金净值开始公布；QDII 与部分基金净值
      可能更晚，那部分会滞后一天，属正常。市值与日盈亏由表格公式自动重算。
    notes: >
      代码在 Store 检出目录，状态（.cache 等）在工作目录 INVESTDESK_HOME，
      默认 ~/.investdesk。执行器是 github-actions：认证走飞书自建应用的
      tenant_access_token（FEISHU_APP_ID / FEISHU_APP_SECRET），不再依赖
      操作者本机 keychain，因此云端可跑、不要求任何一台机器开机。

      2026-10-18 从 launchd 迁移过来。迁移前 launchd 是本机唯一执行器，
      关机即断；迁移后云端为主。过渡期内本机仍可保留一份 launchd 作备份：
      用 automations/investdesk-quote-sync/deploy/install.sh 安装，两端写入幂等，
      互不冲突。云端稳定运行两周后可卸载本机那份，并把 deploy/ 目录标为历史。

      入口 sync.ts 是薄壳，真正的取价与写库逻辑在
      automations/investdesk-quote-sync/src/（自包含，不再引用外部能力包；原 MCP 的 sync_prices 工具已随能力包移除），共用同一个
      函数，避免定时任务和插件各维护一套实现而随时间漂移。

      抓不到价格的标的不写 0，保持原值并单独上报。这条规则来自一次真实事故：早期版本
      把价格放在文本字段里，公式乘出来恒为 0，表格上显示成「负成本」——看着像亏损，
      其实是缺数据。

      output.target 为 external-system：目标不在本仓库控制范围内，校验器只能记录
      这个声明，无法验证外部写入。通过校验不等于写入成功。

  ops-audit:
    name: ops-audit
    path: automations/ops-audit
    entrypoint: ops_audit.py
    status: testing
    version: 0.2.1
    updated: "2026-10-20"
    trigger_kind: monthly
    executor: systemd
    systemd:
      unit: ops-audit.service
      timer: ops-audit.timer
    output:
      target: local-file
      path: /var/lib/ops-audit/reports
      retention: 12
      human_access: "SSH 到目标机后打开 <path>/<date>.html；或由操作者取回本地查看"
    description: >
      每月对 owner 自有 Linux 服务器做一次只读审计：资源水位、服务存活、域名可达性、
      证书到期、OOM 与环比变化；并审计服务器上部署项目对应的 GitHub 仓库是否仍存在且活跃。
      产出单文件 HTML 报告（样式内联，可直接打开或转发）。
    notes: >
      只读：不重启服务、不改配置、不动服务器文件。发现「上游已归档/删除但服务仍在跑」时
      只输出建议退休清单并标注需人工确认——仓库状态不等于业务状态，删除必须由人决定。

      采集有两种模式：runtime.local=true 直接在目标机执行（systemd 部署用这种），否则通过
      SSH 采集（本机巡检远程机器用）。GitHub 查询走 HTTPS API，公开仓库无需 token，
      私有仓库可在 repos.token 里配。

      timer 是 OnCalendar=*-*-01 21:00:00 + Persistent=true：关机错过会在开机后补跑。
      报告含主机名/域名/部署路径/证书到期，属于运维面，因此 output.target 用 local-file
      而不是 git-branch；报告也不会进外部系统，所以不是 external-system。

      0.2.0 起支持 server.exclude：服务器上"部署用的源码检出"（如本仓库自己的 clone）
      也是 git 仓库，但不算部署项目，可用该配置按路径前缀排除。

      systemd unit 里声明 SuccessExitStatus=3：退出码 3 表示「发现问题」，不是系统失败。
      没有这个声明，每个月都会在 journal 里留下一条误导性的 failed。

  deepseek-invoice:
    name: deepseek-invoice
    path: automations/deepseek-invoice
    entrypoint: run.mjs
    status: testing
    version: 0.1.2
    updated: "2026-10-23"
    trigger_kind: monthly
    executor: systemd
    systemd:
      unit: deepseek-invoice.service
      timer: deepseek-invoice.timer
    output:
      target: local-file
      path: /opt/deepseek-invoice/logs
      retention: 24
      human_access: "SSH 到目标机后 `ls -t /opt/deepseek-invoice/logs | head`；日志与截图同目录"
    description: >
      每月 1 日在 owner 自有 Linux 服务器上，用 headless Chromium 打开 DeepSeek 开放平台账单页，
      读取「可开票金额」；大于 0 时按固定抬头/税号/邮箱提交增值税普通发票申请，为 0 时跳过。
    notes: >
      执行器选 systemd 而不是 github-actions：需要长期登录态（storageState）与国内固定 IP，
      云端 runner 的 IP 漂移且位于境外，会被目标平台风控。

      登录态由本地 Chrome 导出并裁剪到仅 deepseek 域（约 6KB），放在
      auth/storage-state.deepseek.json（600）。失效时脚本以退出码 2 结束，需要重新导出；
      不会静默重试，也不会用旧态反复提交。

      安全性：默认 dry-run，systemd unit 显式 --live；maxAmount 上限保护；金额为 0 直接跳过，
      天然幂等。output 用 local-file：日志与截图含账号相关信息，不应进入 git-branch，
      也不进任何外部系统。

      0.1.2（patch）：修两个"静默报成功"的失败分支。以前金额读不到时 `readAvailable`
      返回 null，被 `Number(... || '0')` 转成 0，于是页面改版 / 金额未加载都落进
      「本月无可开额度，跳过」并返回 ok:true —— 一个月不开票，日志看起来完全正常；
      现在 null / 解析失败单独判成 AMOUNT_UNREADABLE，截图并退出码 4。另一个：提交后
      没找到成功提示时只 emit 了 SUBMIT_UNVERIFIED，随后正常结束、退出码 0，systemd
