# Capability Dependency Contract — V0.1
# Source of Truth for: Skill ↔ External Capability dependencies.
#
# External Capability Type is owned by external-capabilities/registry.yaml
# and is NOT duplicated here.
# Skill version is owned by skills/registry.yaml and is NOT duplicated here.
# Historical dependency state lives in Git history / tags.

schema_version: 1

dependencies:
  # 排版 → 上传 是同一条流水线：layout 生成 body HTML，draft-mcp 把它传进草稿箱。
  # 两者对图片的要求相反（layout 用 {{..._URL}} 占位符，draft 要相对本地路径），
  # 记在这里是为了让"改一个必须看另一个"变成一条可查的事实，而不是靠人记得。
  - skill: wechat-html-css-layout
    requires:
      - capability: wechat-draft-mcp
        required: false
        notes: 上传时使用；不用上传时只需排版，无需此能力

  # SOP 里写死了自建后端的接口调用（带 `-self-api` 的编排的 calls）。
  # 没有这个服务，skill 只剩「取数」和「交付」两段 —— 中间那一段没有替代品。
  # 服务的代码不在店里，所以 capability 是 hosting: external，只有端点与契约。
  - skill: teaming-meeting-analysis
    requires:
      - capability: meeting-analysis-service
        required: true
        notes: 分析、报告与幂等都在服务端；skill 只导出逐字稿、上传、交付 reportUrl。同后端另有一个 MCP 客户端 teaming-mcp，但本 skill 不走它
  - skill: readloop
    requires:
      - capability: readloop-service
        required: true
        notes: 选题 / 判分 / 间隔调度由服务计算；skill 只读写用户的表、呈现题目、把 updates 原样写回

  # 卡片是插件在客户端渲染的，skill 只产出 JSON。
  # 没有这个插件，```dsh-diagram 块退化成一段普通代码块 —— 内容还在，但读者看到的是 JSON。
  - skill: dsh-diagram
    requires:
      - capability: diagram-card
        required: true
        notes: 渲染完全由插件负责；skill 只决定该不该画、以及 JSON 怎么写。插件缺失时读者看到原始代码块

# A dependency entry:
#   - skill: <skill-name>              # must exist in skills/registry.yaml
#     requires:
#       - capability: <capability-name>    # must exist in external-capabilities/registry.yaml
#         required: true | false
#         notes: optional free-form
#
# Uniqueness contract (validated by scripts/validate_store.py):
#   - one dependency entry per skill
#   - one requirement entry per capability within a skill
# No precedence is defined: ambiguity fails validation.
#
# Example (documentation only — do not register fictional data):
#   - skill: web-research
#     requires:
#       - capability: browser-mcp
#         required: true
#         notes: used for authenticated page interaction

# Future answer this contract enables:
#   "Which external capabilities does Skill X require?"
#
# V0.1 establishes the contract only.
# No automatic dependency resolver in V0.1.
