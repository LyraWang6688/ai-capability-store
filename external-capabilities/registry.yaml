    commerce: {charge: free}
    notes: "自研、Store-managed。定位：让「好看的架构图」成为回复的默认表达能力，而不是每次让模型生成图片或让用户手动打开 HTML。设计参数取自 ChatGPT 对话内渲染的实测 token（配色 #0E0E0E/#303030/#2C67C5/#40C977、圆角 16/12/8、字号 14/12/16）。实现取舍：按 plugin/dsh/README.md「未验证 slot 不许上主插件」，只用已稳定的 shell.overlay，通过 MutationObserver + 2s 轮询观察 pre>code 并就地替换，而非依赖未验证的 conversation.chat.*。已用隔离页 dev/preview.html 自测：2 张图渲染、6 个卡片格、slot 注册为 shell.overlay/dshdg-boot 全部通过。0.1.2：布局改为自适应——字号/内距用 `clamp()` 跟随视口宽度（正文 13–16px），列数断点 480px（单列/两列），视口 ≥1100px 放宽到 980px，`@media (max-height:760px)` 自动紧一档。实测分层图 1280×802→546px、1600×1000→644px、约 450 宽→483px；无固定高度。不做整体缩放（会牺牲可读性），矮屏走滚动。0.1.1：修两处实测问题——(1) 主题检测按 DSH 的 `data-ds-dark-theme` 判定，此前读的是不存在的 `data-theme`，导致浅色界面里卡片仍是深色；补了「背景亮度 → 文字亮度」两级兜底。(2) 收紧排版（画布内距 12→10、卡片 8→6、行高 26→22、宽度 792→720），分层图高度 685→539px，在 802px 高的窗口里一屏可看完。status 取 limited：已在隔离的 probe profile 里完成宿主内集成实测（2026-10-24，DSH Desktop 0.2.1-rc.2）——从 npm 安装后 web 实例正常加载（window.__dshdg 存在）、shell.overlay 挂载生效（自绘 CSS 已注入）、注入 pre>code.language-dsh-diagram 后 2 秒内完成替换且原代码块仅隐藏不删除。未覆盖：真实消息链路（未经 agent 生成，仅注入模拟块）与长会话压力，故取 limited 而非 available。测试方法见 plugin/dsh/README.md §九 0.1.3：一屏适配——(1) 宿主隔离：宿主 markdown 的 p/hr 外边距会穿透进卡片（实测每段多 32px，四卡分层图因此从 543 涨到 799px 高），用 .dshdg-root p,hr{margin:0!important} 重置；(2) 按可见区预算分三档（普通 → 紧凑 → 滚动+展开按钮），预算 = floor(min(visible*0.8, visible-24))，visible 取滚动容器矩形与视口交集；卡片的 offsetTop 不参与预算，也不扫描 fixed/sticky 猜遮挡；(3) ResizeObserver + fonts.ready 合并到 rAF，同一组宽高只评估一次，用户滚动不触发重排。无头页实测：滚动容器 559px 时四卡分层图走紧凑档 442px（预算 447），352px 时走滚动档 281px（预算 281），展开/收起可逆，控制台无 ResizeObserver 循环报错。0.1.4：修主题检测——实测宿主浅色模式下 body 背景仍是深色（rgb(48,48,48)），0.1.3 及以前按 body 亮度判定，导致浅色页里套深色 token：卡外标题/层名 rgb(249,251,252) 画在 rgb(236,231,224) 上几乎不可见。改为按「宿主显式标记（data-ds-dark-theme / data-ds-light-theme / data-theme / data-color-mode / data-mode、color-scheme）→ 卡片背后最近不透明背景（消息容器，不是 body）→ 最后才回退 body/根」的顺序判定；主题切换用 MutationObserver + 每轮 scan 同步。无头页实测：浅色页 dshdg-light=true、标题 rgb(17,17,20)；深色页 dshdg-light=false、标题 rgb(237,237,237)；设置/移除 data-theme=dark 后两卡双向可逆。"
