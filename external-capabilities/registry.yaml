    commerce: {charge: free}
    notes: "自研、Store-managed。全新资产，从未进过版本控制，首次提交即其第一份历史（按 first-publish §0 ② 直接复制）。status 取 limited：需先建飞书自建应用、配事件订阅与权限、绑 lark-cli 并授权，不是装上即用。0.1.0 分发形态为 npm CLI：`npx @lyra_wang/dsh-feishu-remote init`（npm 上的 `dsh-feishu-remote` 无 scope 名已被第三方 shixiangyu2 占用，且那是 DSH 插件形态的同类项目；本项目是独立常驻 CLI、执行后端可替换、内置高风险确认与审计，两者无关）。macOS 用 launchd 常驻；其他平台用 systemd/PM2 运行 `dsh-feishu-remote run`。2026-10-19 本机实测：doctor 全绿（lark-cli 1.0.97、事件订阅就绪、DSH 内置 CLI、DEEPSEEK_API_KEY 钥匙串就绪）；同一套逻辑先用 launchd 版验证了「列出桌面文件（9.3s 完成）」与「删除类指令先确认、取消零执行」。 0.3.1（patch）：修 0.3.0 的 Linux 落地缺陷——`init` 的安装门槛写死 `isMac()`，Linux 上会打印「非 macOS / Linux」然后跳过 systemd 安装，与 README 声明矛盾；Linux 启动脚本里的 PATH 被硬编码，导致 DSH 的 `#!/usr/bin/env node` 解析到系统老版本 node 时**静默退出码 0、零输出**（`import.meta.main` 需 Node 24+），现改为优先使用配置 `extraEnv.PATH`；`loginctl enable-linger` 改为尽力而为（普通用户无权限时提示而不是中断安装）；`install-service` / `uninstall-service` 在 Linux 下不再打印 `undefined`。补 6 个单测钉住渲染出的服务脚本与 systemd unit，并接入 PR 门禁。README 增加「部署前必须对齐的三件事」（node 版本 / keychainService 置空 / 同一飞书应用只能有一处长连接）。 0.3.2（patch）：只有 bot 身份的机器（典型是 Linux 服务器，用户登录是设备码流程）此前无法完成初始化——`init` 依赖 user 身份读白名单、`doctor` 把 user 身份缺失判成失败。实际收发消息全程 `--as bot`，user 身份不是必需：`init` 新增 `--open-id ou_xxx`，`doctor` 增加「飞书机器人身份」检查（bot ready 即通过），读不到用户身份时白名单降级为提示核对。补 5 个 feishu 单测。 0.3.3（patch）：README「常见问题」补一条「飞书授权到期了怎么办？」——token 正常每 6 小时自动滚动续期，真失效时在飞书回复「重新授权」会收到卡片，点按钮即可续期。 0.4.0（minor）：回传给用户的**所有消息改为飞书 Card 2.0 卡片**（任务完成/失败/执行中/高风险确认/帮助/状态），不再发裸文本；卡片正文截断仍受 `maxReplyChars` 控制，发送失败自动降级为文本。新增 `src/cards.mjs` 纯函数构建器与 6 个卡片单测。 0.5.0（minor）：高风险确认改为**卡片按钮**——确认卡带「确认执行 / 取消」两个 callback 按钮（`action_value` 携带 `{action, taskId}`），桥新增 `card.action.trigger` 事件消费者（配置 `cardActions`，默认关；需在开放平台订阅回调），按钮与文字「确认/取消」两条路都保留；消费者改为按事件键分别启动并各自重连。 0.5.1（patch）：`doctor` 的执行后端检查从「文件存在」升级为「命令真的产出输出」——跑 `dsh --version`（10s 超时，带 extraEnv），退出码 0 但 stdout 为空即判失败并提示 Node <24 的静默坑；新增 `doctor --full` 真跑一句任务验证模型。补 4 个探针判定单测。0.5.2 只改 LICENSE 版权行：统一为 Copyright (c) 2026 Lyra Wang（与仓库根 LICENSE、npm 维护者账号一致）；无代码改动。"
