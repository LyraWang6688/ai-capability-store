    capabilities: "把飞书私聊任务转发到执行后端运行：白名单 open_id 校验、仅 p2p、高风险词先确认（回复「确认」才执行）、串行队列、超时中止（SIGTERM→SIGKILL）、结果以飞书 Card 2.0 卡片回传（发送失败自动降级为文本；高风险确认支持卡片按钮回调）、逐任务审计 JSONL；另提供 doctor 环境体检与开机自启（macOS launchd + caffeinate 防休眠 / Linux systemd user unit）。执行后端可配置：默认 `dsh headless <任务>`，可替换为任意命令"
