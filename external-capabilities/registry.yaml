    notes: "自研、Store-managed。从 ~/Documents/workplace/mac-cleanup 迁入本 Store（`git subtree add` 保留历史；0.1.0 起本目录即唯一源码）。已参数化：仓库内不含任何个人路径、主机名或 npx 哈希 —— `--init` 从 ~/.dsh/profiles/node_modules 的符号链接反查 DSH 运行时目录，从 mo 的真实路径反推 Mole 源码位置，覆盖 Apple Silicon 与 Intel 两种 Homebrew 前缀。不含 SKILL.md：这是可安装的 CLI 工具，不是 Agent 跟随的流程。status 取 limited：需先装 Mole 并跑一次 `--init`，不是装上即用。0.1.0 首次收录。0.2.0：npm 分发（`npx @lyra_wang/mac-cleanup`，bin 为 bin/mac-cleanup.js 包装层）——为此做两处结构调整：① 状态文件从包目录迁到 `~/.mac-cleanup/`，因为 npx 把包装在 `~/.npm/_npx/<hash>/` 缓存目录，随时被回收且是只读语义；② 入口脚本解析自身符号链接（npm 的 bin 是 symlink，否则找不到 lib/）。`--install` 会先把包复制到 `~/.mac-cleanup/app` 再生成 LaunchAgent，避免 plist 指向会被回收的 npx 缓存。npm 上的 `mac-cleanup` 无 scope 名已被第三方占用，故用 `@lyra_wang` scope"

