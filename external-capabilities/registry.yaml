# External Capability Domain Registry
# Source of Truth for: external capability identity / provider / type / hosting / availability / auth model / permission model / capabilities / version / implementation (store-managed) or endpoint+contract (external)
#
# schema_version 2: `commerce:` is a REQUIRED record field, and it is this
# Domain that owns `carrier` — the thing that actually enforces payment
# (license | self-api | hosted). A Skill cannot declare one: its gate is derived
# from its dependencies, so `carrier` here is the single source of that fact.
#
# Why (breaking): `hosting` says where the code is; `carrier` says where the
# gate is. They cannot disagree — a local license check needs code that runs on
# the user's machine (`store-managed`), while a server-side gate needs an
# endpoint (`external`). Keeping them in one record is what makes "we plan to
# charge for this" fail validation until the gate physically exists.
schema_version: 2

domain: external_capabilities
description: External capability identity, provider, type, availability, auth model, permission model, capabilities, version, implementation.

allowed_types:
  - plugin
  - mcp
  - connector
  - cli
  - external-api
  - integration

allowed_statuses:
  - available
  - limited
  - disabled
  - unknown
  - archived

capabilities:
  # ---- 店外服务（hosting: external）------------------------------------
  # 「自建后端 + 店里只有 skill 和契约」的形态：代码在独立项目里，店里登记
  # 端点、契约与授权模型，不登记实现。它们由带 `-self-api` 的编排的 step.calls
  # 引用，不参与 use —— use 只指向有落地路径的资产。
  # 老规矩不变：店里不存任何凭据值，只写「需要什么」。

  meeting-analysis-service:
    name: meeting-analysis-service
    hosting: external
    provider: lyrawang
    type: external-api
    status: available
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.1.0
    endpoint: https://meeting.bamamei.online
    contract_path: skills/teaming-meeting-analysis/SKILL.md
    auth: "两层。(1) 宿主 → 服务：Bearer host token，由 8 位接入码经 POST /api/host/v1/enroll 兑换，服务端只存 SHA-256、可单独吊销；token 存 `~/.teaming-mcp/host-token`（600）。(2) 服务 → 大模型：服务端自己的凭证，不在用户侧"
    capabilities: "接收调用方提供的会议逐字稿，产出四部分团队动力报告（团队状态定位／互动概览／未完成的对话与非共识／给领导者的建议），返回带四象限图与互动网络图的网页报告页（reportUrl）；按 feishuMeetingId 幂等，同一场会不重复分析"
    permissions: "无需飞书授权 —— 逐字稿由宿主自己的飞书能力导出，服务不接触飞书。调用需有效 host token；与 ABC 向善公益无关的会由服务端返回 not_abc_related 并跳过"
    commerce:
      charge: paid
      model: subscription
      carrier: self-api
      value: "用户付的是分析规则与报告渲染都在店外服务端完成——技能侧拿不到规则，只能拿到 reportUrl"
    notes: "自研、自托管。**代码在独立仓库 `~/Documents/workplace/teaming-bot`，不在 Store 内** —— 按 hosting: external 登记，只登记契约与端点。契约即 skills/teaming-meeting-analysis/SKILL.md 的「标准流程」段。同一个后端还有一个 Store-managed 的 MCP 客户端 teaming-mcp；当前 skill 刻意不依赖它（豆包工作看不到 MCP 工具，2026-10-15 实测），所以这两个客户端并存、互不替代。"

  readloop-service:
    name: readloop-service
    hosting: external
    provider: lyrawang
    type: external-api
    status: available
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.2.3
    endpoint: https://readinsight.bamamei.online
    contract_path: skills/readloop/references/api.md
    auth: "8 位授权码经 POST /api/license/activate 换 host token（按年授权，过期一律 402）；token 存 `~/.readloop/config.json`（600）。服务 → 大模型用用户自带的 API Key（BYOK），随请求传入、服务不保存"
    capabilities: "确定性复习规则引擎：选题、组卷、判分、间隔调度；另有首次配置用的授权接口与飞书应用一键创建接口（/api/setup/app/*）。用户的表格数据不在服务端保存"
    permissions: "无需飞书授权 —— 读写多维表格由宿主自己的飞书能力完成，服务不直接访问用户的表。调用需有效 host token"
    commerce:
      charge: paid
      model: subscription
      carrier: self-api
      value: "用户付的是确定性复习规则引擎（选题/组卷/判分/间隔调度）与随平台变化的规则更新，不付模型调用"
    notes: "自研、自托管。**代码在独立仓库 `~/Documents/workplace/ReadLoop`，不在 Store 内** —— 按 hosting: external 登记，只登记契约与端点。与 meeting-analysis-service 的区别：这个服务无状态，记忆状态存在用户自己的多维表格里。0.2.0：契约随 readloop skill 0.2.0 同步 —— today 返回 4 个选项且 context 恒 null、answered 恒 0、question_id 48h 有效；submit 接受选项原文或 A/B/C/D，updates 扩到 10 个字段（含难度因子/最近暴露）；新增 setup start/status/pair 契约，status 默认不返回 app_secret；错误码补 400/404/410/429。0.2.1：配对接口 POST 记录宿主的 host_token，GET 时随凭证一次性下发（取后即删），插件据此自动完成配置。0.2.3：规则评估结论（服务仓库 docs/EVALUATION.md）——用同一套指标离线回放 SM-2 vs FSRS-4.5：FSRS@90% 复习少 15–25% 但保持率低 6–8pp，FSRS@95% 保持率追平但复习多 20–28%；合成数据下 SM-2 的 Brier 更低但不代表真实用户。结论：线上继续 SM-2，FSRS 仅作候选（src/lib/fsrs-lite.ts）；真实日志回放入口已就绪（scripts/replay-compare.ts --practice），真实日志 ≥400 条/人后再评估是否以开关引入。 0.2.2：新增 POST /api/review/metrics（答题记录 → 间隔分档保持率/目标区间/leech/完成率/用时 + 确定性建议）；today 接受可选 performance 并返回 difficulty（20 题门槛 + 贝叶斯平滑）。"

  wechat-draft-mcp:
    name: wechat-draft-mcp
    hosting: store-managed
    provider: wechat
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/wechat/README.md
    version: 0.3.3
    implementation_path: external-capabilities/mcp/wechat-draft-mcp
    auth: "宿主注入环境变量 WECHAT_APP_ID / WECHAT_APP_SECRET，用于换取 access_token；调用方出口 IP 必须加入公众号 IP 白名单"
    capabilities: "把磁盘上的文章文件夹创建或**原地更新**为微信草稿：上传前预检、创建/更新草稿、按 media_id 读回核对；另提供受控的删除能力（草稿/永久素材/已发布文章），默认关闭，需宿主显式开启 WECHAT_ALLOW_DESTRUCTIVE=1 并二次确认。**正式发布与群发永不由本能力执行**"
    permissions: "需要公众号的草稿箱、永久素材与发布接口权限：draft/add、draft/get、draft/update、draft/delete、draft/count、media/uploadimg、material/add_material、material/del_material、freepublish/getarticle、freepublish/delete，并需将出口 IP 加入白名单；未认证个人订阅号实测可用。破坏性接口默认关闭，开启后每条删除都会先本地备份并写入审计"
    commerce: {charge: free}
    notes: "自研、Store-managed。**同步模式：以 Store 为唯一准据（canonical）。本目录是唯一副本。**独立源仓库 `~/Documents/workplace/wechat-draft-mcp` 已于 2026-10-18 退休（代码、测试与文档全部并入本目录，历史经 git subtree 保留）。0.3.0 起：9 个 MCP 工具 + 9 条 CLI 命令，覆盖创建/更新/受控删除；自动化测试数量以 `npm test` 实际输出为准，本文件不记数字 0.3.1 补上 package.json 的 repository 字段（此前 npm 页面上没有源码链接，`npm repo` 直接报 no repository）。"

  teaming-mcp:
    name: teaming-mcp
    hosting: store-managed
    provider: lyrawang
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.2.0
    implementation_path: external-capabilities/mcp/teaming-mcp
    auth: "两层，均只记录元数据。(1) 宿主 → MCP：stdio，无认证，进程由宿主在本机以 command+args 拉起；(2) MCP → teaming-bot 服务器：Bearer 宿主凭证，由 `teaming setup --code <接入码>` 兑换，服务端只存 SHA-256 且可单独吊销。**0.2.0 起不再需要本机大模型凭证**——分析由服务器完成，MCP 只上传逐字稿、拿回分析结果。**取飞书数据不经 MCP**——由宿主自己的飞书能力完成，所以主路径下 MCP 不需要飞书授权"
    capabilities: "对一场会议做团队动力分析并交付报告：接收【调用方提供的】逐字稿，产出四部分报告（团队状态定位／互动概览／未完成的对话与非共识／给领导者的建议），自动上传服务器换取带图表的网页报告页；另有列出可分析会议、读取已有报告、推送飞书交互卡片、运行诊断、查询任务状态等。共 8 个 MCP 工具"
    permissions: "已验证：分析并上传报告需 teaming-bot 签发的宿主凭证。**本机大模型凭证已不再需要**（0.2.0 起分析改由服务器完成）。飞书权限**非必需**：主路径下逐字稿由宿主取（豆包工作实测走其内置飞书应用），MCP 不接触飞书；仅 teaming_list_meetings / teaming_analyze_meeting / teaming_push_report 这几个走本机 lark-cli 的工具需要已授权的 profile，涉及妙记读取与消息发送"
    commerce: {charge: free}
    notes: "自研、Store-managed。**同步模式：以 Store 为唯一准据（canonical）。本目录是唯一副本。**独立源仓库 `~/Documents/workplace/teaming-mcp` 已于 2026-10-18 退休删除（删除前已把 HANDOFF.md 备份到 `~/Desktop/teaming-mcp-HANDOFF-备份.md`）。历史沿革（2026-10-18 逐提交核对得出，勿再凭印象推断）：0.1.0 用 `git subtree add` 从独立源仓库导入，锚点 650fb40；0.1.1 / 0.1.2 / 0.1.3 继续用 `git subtree pull`——远程是本机绝对路径，所以只在那台机器上可用——这三次的提交在 Store 历史里**可达**；只有 0.2.0 那次改成手工复制文件，因此 0.2.0 的改动提交（1bce754）没有进入 Store 历史，锚点停在 0.1.0。★ 一个曾经写错、现已证伪的说法：`git subtree pull` **不会**冲突——2026-10-18 在本机路径上实测零冲突合并成功（合进来的正是 4 个 tests 文件）。所以当初改用「以 Store 为准」不是因为在冲突，而是因为上游只是本机一个文件夹、换台机器就断；现在源仓库已删除，subtree 更无上游可用。安装：npm i -g teaming-mcp 后执行 teaming setup --code <接入码>。0.2.0 起不再 vendored 分析引擎、也没有构建步骤：装上即可运行，分析由 teaming-bot 服务器完成（POST /api/host/v1/analyze）。共 8 个 MCP 工具。Skill 已独立为 Store 的 skills/teaming-meeting-analysis，不再随本包分发。⚠️ 已知快照缺陷：tag `teaming-mcp-v0.2.0` 指向的提交里，`tests/cli-entry.test.mjs`、`tests/config.test.mjs`、`tests/packaging.test.mjs` 三个文件仍是 0.1.x 版本（该次镜像同步漏了它们），该快照内 `npm test` 会红。内容已在后续提交修正；按 VERSIONING.md §6，tag 指向的提交不可改写，故不重打 tag。需要可复现构建时请取 npm 上的 0.2.0，或用修正之后的 main。"

  feishu-cli-mcp-server:
    name: feishu-cli-mcp-server
    hosting: store-managed
    provider: feishu
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/feishu/README.md
    version: 0.1.0
    implementation_path: external-capabilities/mcp/feishu-cli-mcp-server
    auth: "两层认证。(1) 客户端到 MCP 服务：Auth0 签发的 RS256 access token（OAuth 2.1），scope 为 docs:read / docs:write / base:read / base:write，服务端按工具二次校验；(2) MCP 服务到飞书：复用部署机上已认证的 lark-cli profile，凭据存放在 lark-cli 自己的凭据库里，从不通过 MCP 参数传入或返回"
    capabilities: "把飞书云文档与多维表格的受控操作暴露为 MCP 工具：文档读取 / 创建 / 更新，Base 创建 / 建字段 / 解析链接 / 列 block / 列记录 / 批量建记录 / 批量改记录"
    permissions: "飞书侧需要 docs 与 base 两个资源域的读写授权（以 lark-cli profile 实际授权为准）；MCP 侧按工具分别要求 docs:read、docs:write、base:read、base:write。写操作另需 confirm=true"
    commerce: {charge: free}
    notes: "自研、Store-managed。来源仓库为独立 git 仓库，已通过 git subtree 导入并保留完整提交历史。status 取 limited：需要 lark-cli 1.0.93+ 与一个已认证的 profile，远端模式还需 Auth0 + HTTPS，并非装上即用。包内 .agents/skills/feishu-mcp-tool-extension/ 为开发资料，不在 Store Skill 域登记。不经 npm 分发：它是自托管 HTTP 服务（nginx + pm2 + OAuth），没有 bin，deploy/ 含生产基础设施标识 —— 见 PUBLISHING.md §D"

  image-ocr:
    name: image-ocr
    hosting: store-managed
    provider: lyrawang
    type: plugin
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.3.0
    implementation_path: external-capabilities/plugin/dsh/image-ocr
    auth: "无凭据入仓，不需要任何账号或 API Key。OCR 完全本地（macOS Vision），图片不出本机"
    capabilities: "DSH 输入框左侧「＋ 识图」按钮：读取剪贴板里的截图，用本地 Vision 引擎识别中英文字，把文字插入草稿（可撤销、不自动发送）。宿主侧注册同源只读路由 `/plugins/image-ocr/ocr`，并带一份 Swift 源码在首次使用时编译缓存"
    permissions: "需要 macOS 13+ 与 Xcode Command Line Tools（xcrun swiftc）。宿主进程读取剪贴板图片；不读屏幕、不联网"
    commerce: {charge: free}
    notes: "自研、Store-managed。0.1.0 首次登记：client 注册在 `conversation.input.left`（order=3，紧邻 feishu-ref 的「＋ 引用」）；插入走 `inputActions.captureInsertion()` + `insertText()`。OCR 引擎编译缓存在仓库外（~/Library/Application Support/dsh-image-ocr/ocr），首次点击可能等 30–60s，apply 时会后台预热。实测：整屏截图 53 行，冷启动 31s（编译+模型初始化），热启动 0.66s；中文长句识别良好，UI 图标会带来少量短符号噪声"
  feishu-ref:
    name: feishu-ref
    hosting: store-managed
    provider: lyrawang
    type: plugin
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.5.1
    implementation_path: external-capabilities/plugin/dsh/feishu-ref
    auth: "无凭据入仓。复用操作者本机已认证的 lark-cli（用户身份）做只读搜索；插件不接收、不保存任何 token 或账号信息"
    capabilities: "DSH 输入框左侧新增「＋ 引用」按钮：点击弹出一个两栏面板——**左栏文档**（飞书文档 / 多维表格 / 表格 / 知识库 / 幻灯片，留空看最近 30 天编辑）、**右栏群聊**（按关键词搜可见群，含群描述与「外部群」标记）；两条 `lark-cli` 搜索在宿主侧并行发出、各自兜底。选中任一栏的结果后把 Markdown 链接插入草稿（可撤销、不自动发送）；群链接为 AppLink（`openChatId=<chat_id>`），agent 可据此直接读群消息。宿主侧只注册一个同源只读路由 `/plugins/feishu-ref/search`（POST），分别转发给 `lark-cli drive +search` 与 `lark-cli im +chat-search`"
    permissions: "需要操作者本机安装并登录 lark-cli（用户身份，具备文档可见权限）；按钮与链接插入本身不需要额外权限。宿主侧不开放外部网络监听"
    commerce: {charge: free}
    notes: "自研、Store-managed。0.1.0 首次登记：client 注册在 `conversation.input.left` 槽位（compact controls at the left of the composer tool row），order=2；插入走 `inputActions.captureInsertion()` + `insertText()`，属普通可撤销文本编辑。与 selection-toolbar 共用 DSH 的同源鉴权方式（`connection.requestRejection`）。搜索上限 30 字符（飞书 Search v2 限制），面板最多展示 12 条。理由说明：为什么不用系统「＋」菜单——菜单项是命令（host command），无法直接往输入框写文本，需要额外命令↔UI 桥接；自建按钮路径最短且失败可降级为复制链接。0.5.0（minor，新增能力）：面板改为**两栏并列**——左栏文档、右栏群聊，搜索并行；群聊经 `lark-cli im +chat-search --search-types private,external,public_joined` 获取（排除未加入的公开群；群搜索必须有关键词，故留空时右栏提示「输入关键词可搜群聊」），返回 `chat_id` / `name` / `description` / `external` / `chat_status`，已解散群（`chat_status != normal`）过滤掉；链接按飞书文档给的已加入会话 AppLink 格式构造 `https://applink.feishu.cn/client/chat/open?openChatId=<chat_id>`，**不用 `im chats link`**（那条返回 `add_by_link` 拉人入群邀请链接且会过期）。键盘：↑/↓ 线性（最近使用 → 文档 → 群聊），←/→ 在两栏间跳转。0.5.0 同时修两个面板定位缺陷（隔离 profile 实测发现）：面板高度改为按「按钮上方可用空间」夹取，避免矮窗口里顶部被裁掉；水平方向按视口右边界夹取，避免右栏整列跑出屏幕。2026-10-26 隔离 probe profile 实测（DSH 0.2.1-rc.2，独立 `DSH_HOME` + 独立端口 19556，验完删除）：按钮渲染、`<style>` 注入、搜「多维表格」左栏 12 条 / 右栏 8 条、点群聊插入 `[群名](https://applink.feishu.cn/client/chat/open?openChatId=oc_e4f923202387eb7dccdd74764b7cbc30)` 且写入最近使用、←/→+Enter 键盘插入、文档条目仍插入 Base 链接、面板 1200×615 视口下 top=7/right=1188 不被裁。未覆盖：真实发送后的 agent 读群链路（属 lark-cli 侧，已由 `im +chat-messages-list` 单独验证）、其它窗口尺寸。截图见 `docs/feishu-ref-0.5.0-two-column.png`（gitignored 本地资料）。0.5.1（patch，界面压缩）：用户实拍面板占满整屏——原因是 0.5.0 的 `maxHeight` 只取 `rect.top - 16`（按钮上方可用空间），窗口越高面板越大。现改为 `Math.min(460, Math.max(220, rect.top - 16))`，固定上限 460px；同时留空时「最近编辑的文档」只列 3 条（此前 10 条把面板继续撑高），搜索结果仍在栏内独立滚动。2026-10-26 隔离 probe profile 实测（1200×615 视口）：留空时面板高 242px、左栏 3 条；搜「多维表格」时高 364px（≤460），左栏 12 条 client 286 / scroll 638、右栏 8 条 client 286 / scroll 427，两栏均可滚动"
  selection-toolbar:
    name: selection-toolbar
    hosting: store-managed
    provider: lyrawang
    type: plugin
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.9.3
    implementation_path: external-capabilities/plugin/dsh/selection-toolbar
    auth: "无凭据入仓。写飞书文档复用操作者本机已认证的 lark-cli profile（用户身份）；目标文档 token 与 lark-cli 路径存放在仓库外的 `~/.dsh/selection-toolbar.json`（600 权限），可用环境变量 `DSH_SELECTION_TOOLBAR_CONFIG` 覆盖配置路径。插件自身不接收、不保存、不记录任何凭据值"
    capabilities: "DSH 对话内的选区工具条：鼠标划选文字后浮出 复制 / 追问 / 注释 三个动作。复制=写入剪贴板；追问=把选中文字插入 DSH 输入框（不自动发送）；注释=把「原文引用 + 注释 + 北京时间」追加到配置指定的飞书文档末尾，并在本机 localStorage 留一份离线副本"
    permissions: "需要操作者本机安装并授权 lark-cli（用户身份，具备目标文档的编辑权限）以完成飞书写入；复制与追问不需要任何额外权限。宿主侧仅注册一个同源本地接口 `/plugins/selection-toolbar/note`（POST），不开放外部网络监听"
    commerce: {charge: free}
    notes: "自研、Store-managed。首次登记：全新资产，从未进过版本控制，首次提交即其第一份历史（按 first-publish §0 ② 直接复制）。依赖 DSH 桌面端（提供 `shell.overlay` 槽位与插件安装与管理器）与 lark-cli 1.0.x；未配置 docToken 时注释只写本地并在界面回显原因。status 取 limited：不是装上即用，需按 README 创建一次操作者配置并重启 DSH。0.2.0 起可经 npm 分发：公开包名 `@lyra_wang/dsh-selection-toolbar`（0.2.0 与注册表版本一致），消费者在 DSH 插件页输入包名即可安装；npm 上的 `dsh-selection-toolbar`（无 scope）已被第三方占用，故使用作者 scope。0.2.0 同时把包名从开发期 `@local/selection-toolbar` 改为公开包名，并同步 client loader id（改名属破坏性变更，故 minor +1）。2026-10-19 实测证据：宿主路由 `GET /plugins/selection-toolbar/note` 返回 405（已加载）；飞书文档 revision 5 → 6 → 7 各追加一条；时间戳由 `<sub>` 改为纯文本北京时间后显示为 `时间：2026/10/19 02:11`。0.2.1（补丁）：把 `client.js` 的 locale 命名空间常量从遗留的 `@local/selection-toolbar` 统一为公开包名（此前 register/bind 用同一个值所以功能一直正常，属改名未清干净的痕迹；locale 注册只在进程内存在，修改不丢任何数据）；并在插件目录新增 `.gitignore`（`selection-toolbar.json` / `*.local.json` / `.env*` / `node_modules/`），防止任何人把含文档 token 的测试配置误提交——配置文件本身仍在仓库外的 `~/.dsh/selection-toolbar.json`。0.2.2（补丁）：`locale/zh.json` 与 `locale/en.json` 的 meta 描述仍写着已删除的「朗读 / read aloud」，插件页因此显示「复制 / 朗读 / 追问 / 注释」；本次改为「复制 / 追问 / 注释」，并同步修正英文描述。0.3.0（minor）：新增第 4 个动作「改写」——选中一段文字后可指定要求（润色 / 更简洁 / 小红书风 / 公众号风 / 自定义），宿主侧新增 `POST /plugins/selection-toolbar/rewrite`，用配置的模型（默认 deepseek-flash，OpenAI 兼容端点）只重写该段，结果可复制或插入输入框；API Key 从环境变量或系统钥匙串读取，不随包分发。为避免与「注释」冲突，改写结果第一版不直接替换只读消息的 DOM（留作后续）。0.3.1（补丁）：修复改写面板点击即消失——「点击面板外关闭」的判定只认工具条与注释面板，漏掉了改写面板的类名，导致点「小红书风」等按钮被当成点击外部而关闭面板；现补上 `-rw` 类名。0.9.3（补丁）：修两处实测问题——(1) 引用条此前只在挂载时算一次位置，输入框变高后会停住压住正文，改为 ResizeObserver + 滚动/resize 监听 + 400ms 轮询重算，实测输入框 36→52px 时引用条同步上移且不重叠；(2) `shell.overlay` 不传 sessionId，导致「切会话清引用」的 effect 永不触发、引用跨会话残留，改为用「输入框节点是否仍连接」判定会话切换，实测切换后引用条自动消失。"

  terminal-context:
    name: terminal-context
    hosting: store-managed
    provider: lyrawang
    type: plugin
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.4.1
    implementation_path: external-capabilities/plugin/dsh/terminal-context
    auth: "无凭据。无外部网络请求，只 POST 回本机 Host 路由 /plugins/terminal-context/push；不写文件"
    capabilities: "把 DSH 侧边栏终端当前屏幕的可见文字交给 Agent：Host 半边提供一个只读工具 read_terminal_context（返回最近若干行 + 更新时间 + 新鲜度），界面半边每 2 秒读一次 .xterm-rows 渲染出的行，内容变了才推。目的是让 Agent 的下一步依据终端真实状态（在哪个目录、上一条命令成败、报错内容），并在用户跑完后接着结果往下做"
    permissions: "无需任何外部权限或凭据。界面半边只读取终端渲染出的文本，不注入输入、不修改终端状态；缓存只在 Host 内存里（最多 200 行），不落盘"
    commerce: {charge: free}
    notes: "自研、Store-managed。走的是「看屏幕」而不是接口：三条接口路线实测全不通——terminals.read 的服务在当前 profile 未注册；terminalController.retain 只返回一个 {type:'retained'} 控制帧、不含内容；terminalController.attach 报 'Terminal attachment requires a Remote invocation'，Host 插件无权调用。界面侧 ctx 上只有 fiber，服务不是属性访问，服务名也拿不到，所以最终读 xterm 渲染出的 DOM 文本。代价：只有当前可见一屏（≤60 行），滚动缓冲读不到；依赖 .xterm-rows 类名，xterm 大改版会失效，失效表现是「没数据」而不是报错。inject 刻意留空：0.1.0 声明了 inject:['terminalController'] 而客户端没有该服务名，入口永久 pending 导致 web boot 失败、整个 DSH 起不来；不声明依赖后最坏情况只是插件无反应。0.3.0 已在作者本机实测：读取到终端 ls 输出与提示符；已发布 npm @lyra_wang/dsh-terminal-context@0.3.0（public）。未覆盖：其它 profile / 其它机器、xterm 升级后的类名变化、长会话压力，故取 limited。0.4.0 补记一条结构限制：右侧「浏览器 tab」的正文读不到——它由 @deepseek-ai/dsh-client-ui-sidebar-browser 渲染成 iframe(Web) / Electron webview(Desktop)，是独立浏览上下文且官方不向内容注入任何能力，父页面既 querySelectorAll 不进去也收不到 selectionchange；0.4.0 诊断实测全页面只命中左栏会话列表 PIRFFq_sidebarCol、浏览器正文 0 命中。能拿到的只有 tab 的 URL 与标题，正文需由 Agent 自取（web_fetch / 浏览器 MCP）或另建同源代理。0.4.1 只补文档、许可与元数据：README 新增「安装」章节（6 个插件里此前只有它没有），补 MIT LICENSE 文件（其余 5 个都有，版权行统一为 Copyright (c) 2026 Lyra Wang），package.json 补 publishConfig.access=public 与 engines.node>=20；无代码改动。"
