# External Capability Domain Registry
# Source of Truth for: external capability identity / provider / type / availability / auth model / permission model / capabilities / version / implementation
schema_version: 1

domain: external_capabilities
description: External capability identity, provider, type, availability, auth model, permission model, capabilities, version, implementation.

allowed_types:
  - plugin
  - mcp
  - connector
  - cli
  - external-api
  - integration

allowed_statuses:
  - available
  - limited
  - disabled
  - unknown

capabilities:
  wechat-draft-mcp:
    name: wechat-draft-mcp
    provider: wechat
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/wechat/README.md
    version: 0.3.1
    implementation_path: external-capabilities/mcp/wechat-draft-mcp
    auth: "宿主注入环境变量 WECHAT_APP_ID / WECHAT_APP_SECRET，用于换取 access_token；调用方出口 IP 必须加入公众号 IP 白名单"
    capabilities: "把磁盘上的文章文件夹创建或**原地更新**为微信草稿：上传前预检、创建/更新草稿、按 media_id 读回核对；另提供受控的删除能力（草稿/永久素材/已发布文章），默认关闭，需宿主显式开启 WECHAT_ALLOW_DESTRUCTIVE=1 并二次确认。**正式发布与群发永不由本能力执行**"
    permissions: "需要公众号的草稿箱、永久素材与发布接口权限：draft/add、draft/get、draft/update、draft/delete、draft/count、media/uploadimg、material/add_material、material/del_material、freepublish/getarticle、freepublish/delete，并需将出口 IP 加入白名单；未认证个人订阅号实测可用。破坏性接口默认关闭，开启后每条删除都会先本地备份并写入审计"
    notes: "自研、Store-managed。**同步模式：以 Store 为唯一准据（canonical）。本目录是唯一副本。**独立源仓库 `~/Documents/workplace/wechat-draft-mcp` 已于 2026-10-18 退休（代码、测试与文档全部并入本目录，历史经 git subtree 保留）。0.3.0 起：9 个 MCP 工具 + 9 条 CLI 命令，覆盖创建/更新/受控删除；自动化测试数量以 `npm test` 实际输出为准，本文件不记数字 0.3.1 补上 package.json 的 repository 字段（此前 npm 页面上没有源码链接，`npm repo` 直接报 no repository）。"

  teaming-mcp:
    name: teaming-mcp
    provider: lyrawang
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.2.0
    implementation_path: external-capabilities/mcp/teaming-mcp
    auth: "两层，均只记录元数据。(1) 宿主 → MCP：stdio，无认证，进程由宿主在本机以 command+args 拉起；(2) MCP → teaming-bot 服务器：Bearer 宿主凭证，由 `teaming setup --code <接入码>` 兑换，服务端只存 SHA-256 且可单独吊销。**0.2.0 起不再需要本机大模型凭证**——分析由服务器完成，MCP 只上传逐字稿、拿回分析结果。**取飞书数据不经 MCP**——由宿主自己的飞书能力完成，所以主路径下 MCP 不需要飞书授权"
    capabilities: "对一场会议做团队动力分析并交付报告：接收【调用方提供的】逐字稿，产出四部分报告（团队状态定位／互动概览／未完成的对话与非共识／给领导者的建议），自动上传服务器换取带图表的网页报告页；另有列出可分析会议、读取已有报告、推送飞书交互卡片、运行诊断、查询任务状态等。共 8 个 MCP 工具"
    permissions: "已验证：分析并上传报告需 teaming-bot 签发的宿主凭证。**本机大模型凭证已不再需要**（0.2.0 起分析改由服务器完成）。飞书权限**非必需**：主路径下逐字稿由宿主取（豆包工作实测走其内置飞书应用），MCP 不接触飞书；仅 teaming_list_meetings / teaming_analyze_meeting / teaming_push_report 这几个走本机 lark-cli 的工具需要已授权的 profile，涉及妙记读取与消息发送"
    notes: "自研、Store-managed。**同步模式：以 Store 为唯一准据（canonical）。本目录是唯一副本。**独立源仓库 `~/Documents/workplace/teaming-mcp` 已于 2026-10-18 退休删除（删除前已把 HANDOFF.md 备份到 `~/Desktop/teaming-mcp-HANDOFF-备份.md`）。历史沿革（2026-10-18 逐提交核对得出，勿再凭印象推断）：0.1.0 用 `git subtree add` 从独立源仓库导入，锚点 650fb40；0.1.1 / 0.1.2 / 0.1.3 继续用 `git subtree pull`——远程是本机绝对路径，所以只在那台机器上可用——这三次的提交在 Store 历史里**可达**；只有 0.2.0 那次改成手工复制文件，因此 0.2.0 的改动提交（1bce754）没有进入 Store 历史，锚点停在 0.1.0。★ 一个曾经写错、现已证伪的说法：`git subtree pull` **不会**冲突——2026-10-18 在本机路径上实测零冲突合并成功（合进来的正是 4 个 tests 文件）。所以当初改用「以 Store 为准」不是因为在冲突，而是因为上游只是本机一个文件夹、换台机器就断；现在源仓库已删除，subtree 更无上游可用。安装：npm i -g teaming-mcp 后执行 teaming setup --code <接入码>。0.2.0 起不再 vendored 分析引擎、也没有构建步骤：装上即可运行，分析由 teaming-bot 服务器完成（POST /api/host/v1/analyze）。共 8 个 MCP 工具。Skill 已独立为 Store 的 skills/teaming-meeting-analysis，不再随本包分发。⚠️ 已知快照缺陷：tag `teaming-mcp-v0.2.0` 指向的提交里，`tests/cli-entry.test.mjs`、`tests/config.test.mjs`、`tests/packaging.test.mjs` 三个文件仍是 0.1.x 版本（该次镜像同步漏了它们），该快照内 `npm test` 会红。内容已在后续提交修正；按 VERSIONING.md §6，tag 指向的提交不可改写，故不重打 tag。需要可复现构建时请取 npm 上的 0.2.0，或用修正之后的 main。"

  feishu-cli-mcp-server:
    name: feishu-cli-mcp-server
    provider: feishu
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/feishu/README.md
    version: 0.1.0
    implementation_path: external-capabilities/mcp/feishu-cli-mcp-server
    auth: "两层认证。(1) 客户端到 MCP 服务：Auth0 签发的 RS256 access token（OAuth 2.1），scope 为 docs:read / docs:write / base:read / base:write，服务端按工具二次校验；(2) MCP 服务到飞书：复用部署机上已认证的 lark-cli profile，凭据存放在 lark-cli 自己的凭据库里，从不通过 MCP 参数传入或返回"
    capabilities: "把飞书云文档与多维表格的受控操作暴露为 MCP 工具：文档读取 / 创建 / 更新，Base 创建 / 建字段 / 解析链接 / 列 block / 列记录 / 批量建记录 / 批量改记录"
    permissions: "飞书侧需要 docs 与 base 两个资源域的读写授权（以 lark-cli profile 实际授权为准）；MCP 侧按工具分别要求 docs:read、docs:write、base:read、base:write。写操作另需 confirm=true"
    notes: "自研、Store-managed。来源仓库为独立 git 仓库，已通过 git subtree 导入并保留完整提交历史。status 取 limited：需要 lark-cli 1.0.93+ 与一个已认证的 profile，远端模式还需 Auth0 + HTTPS，并非装上即用。包内 .agents/skills/feishu-mcp-tool-extension/ 为开发资料，不在 Store Skill 域登记。不经 npm 分发：它是自托管 HTTP 服务（nginx + pm2 + OAuth），没有 bin，deploy/ 含生产基础设施标识 —— 见 PUBLISHING.md §D"

  investdesk-market:
    name: investdesk-market
    provider: lyrawang
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.1.0
    implementation_path: external-capabilities/mcp/investdesk-market
    auth: "无认证：全部使用腾讯、东方财富、新浪的公开免费接口，不需要任何凭证"
    capabilities: "sector_ranking 行业/概念板块涨跌排行与主力资金净额；fund_flow 个股/ETF 最近一日主力资金流；market_news 财经 7×24 快讯（可关键词过滤）；index_snapshot 主要指数快照"
    permissions: "无。纯读取公开网页接口"
    notes: "自研、Store-managed。补齐 investdesk-quotes 缺的「市场上下文」：quotes 只回答点价格，market 回答板块强弱、资金流向、最近消息、大盘位置。provider 取 lyrawang，因为数据源都是公开网页接口、没有授权方。实测稳定性差异很大：腾讯稳定但返回 GBK（必须 TextDecoder gbk，否则乱码）；东财 newsapi 稳定且返回 JSONP；东财 push2/clist 板块接口不稳定，同一 URL 时而 RemoteDisconnected，做了 3 次重试 + 多域名 + 新浪回退；东财 stock/fflow 间歇失败。公开接口无 SLA，全部失败时明确返回「数据源不可用」，不编造数据。ETF 规模/跟踪指数/费率无稳定免费源，暂不提供。status 取 limited：公开接口随时可能改版，且板块资金流依赖的东财接口不稳定。"

  investdesk-ideas:
    name: investdesk-ideas
    provider: lyrawang
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.2.0
    implementation_path: external-capabilities/mcp/investdesk-ideas
    auth: "客户端到 MCP 无认证；MCP 到飞书走自建应用 tenant_access_token，凭据从 INVESTDESK_HOME/.env 读取（FEISHU_APP_ID / FEISHU_APP_SECRET）"
    capabilities: "save_recommendation 记录一次推荐：写灵感记录（问题+回复）+ 把标的 upsert 进备选池（提及次数+1、最近提及、追加理由）+ 双向关联；list_watchlist 查看备选池（按提及次数排序）；search_inspirations 搜索历史提问；update_watchlist 改标的状态（观察中/已买入/已忽略）"
    permissions: "飞书 base 资源域读写授权：开发者后台开通 bitable:app，并把应用加为 Base 协作者（可编辑）"
    notes: "自研、Store-managed。与 investdesk-quotes 按领域拆分：quotes 管客观行情与持仓估值，ideas 管「我问了什么/推荐过什么」。0.1.x 是对话日志模型（每条问答都记），0.2.0 改成标的沉淀模型：灵感记录（提问）+ 备选池（标的，含提及次数/首次/最近/理由）+ 双向关联，重复推荐同一标的会累加次数。已知限制：飞书 GET /records 的 filter 参数会被拒（InvalidFilter），改用 POST /records/search；sort 参数报 InvalidSort，改内存排序；无全文检索，search 拉最近 200 条本地过滤；仅 stdio 传输。"

  investdesk-quotes:
    name: investdesk-quotes
    provider: lyrawang
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.6.0
    implementation_path: external-capabilities/mcp/investdesk-quotes
    auth: "客户端到 MCP 无认证，服务绑定 127.0.0.1 仅供本机客户端使用；MCP 到飞书走飞书自建应用 tenant_access_token（FEISHU_APP_ID / FEISHU_APP_SECRET），不依赖本机 keychain；行情接口免认证"
    capabilities: "lookup_quotes 查场内标的（个股 / ETF / LOF / REITs）价格或场外公募基金净值；portfolio_overview 读飞书持仓并按平台汇总市值 / 成本 / 盈亏；sync_prices 抓取全部持仓最新价格并写回飞书表格"
    permissions: "飞书 base 资源域的读写授权。lark-cli 后端以 profile 实际授权为准；OpenAPI 后端需在开发者后台开通 bitable:app，并把应用加为该 Base 的协作者（可编辑）"
    notes: "自研、Store-managed。provider 取 lyrawang：行情源是腾讯与东方财富的公开网页接口，没有授权与配额模型，真正约束这个能力边界的是我们自己的持仓数据模型与取价路由规则，而非某个平台的 API 合约。公开接口无 SLA，限频与改版都可能导致取价失败，实现里做了批量请求、失败重试，并且抓不到就保持原值、绝不写 0。status 取 limited：依赖本机已认证的 lark-cli profile，并非装上即用。npm 上发布的是 dist/ 编译产物——0.1.0 误发了 .ts，Node 拒绝为 node_modules 下的文件做类型擦除，装下来无法启动；0.1.1 修复为 tsc 构建后发布。0.2.0 增加 OpenAPI 后端：配置 FEISHU_APP_ID/FEISHU_APP_SECRET 即切换到自建应用 tenant_access_token，可在云端/CI 运行；0.2.1 修正 OpenAPI 记录结构归一化。0.3.0 移除 lark-cli 后端，收敛为 OpenAPI 单一认证：迁移期两套并存导致行为差异（OpenAPI 与 lark-cli 记录形状不同，曾使字段全部解析为空），现本机与云端走同一条路径。0.4.0 同步任务额外写入「昨收价」「日涨跌幅(%)」，配合「日盈亏」公式字段可直接回答「今天赚了多少」。0.5.0 让 portfolio_overview 真正输出今日盈亏/今日涨幅/贡献与拖累（此前数据已写入表但工具未读取，导致问「今日涨跌」时答暂无数据）"
  investdesk-bot:
    name: investdesk-bot
    provider: lyrawang
    type: connector
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.1.0
    implementation_path: external-capabilities/connectors/investdesk-bot
    auth: "飞书自建应用凭据（FEISHU_APP_ID / FEISHU_APP_SECRET）与 DeepSeek API key，全部从容器环境变量读取。与用户之间的通道是飞书长连接 WebSocket：只出网，不映射任何入站端口，因此不需要公网 IP 或备案域名。"
    capabilities: "在飞书里以对话形式查持仓与行情、记录与检索想法；每轮问答自动沉淀到多维表格。自身不实现行情或表格逻辑——内部调用 investdesk-quotes（查价、持仓汇总）与 investdesk-ideas（想法池读写）两个 MCP 包，工具面由这两个包提供。"
    permissions: "飞书侧需要自建应用的机器人能力与 im:message、im:message.p2p_msg:readonly；多维表格需要持仓表、平台表、想法池三张表的读写（与 investdesk-quotes / investdesk-ideas 共用同一个 Base）；LLM 侧需要 DeepSeek API key。"
    notes: "自研、Store-managed。这是部署件而非可安装包：Docker + docker-compose 部署，package.json 标了 private、没有 bin，因此不进 npm（见 PUBLISHING.md §D 的 hosted service 一行）。status 取 limited：需要自建飞书应用凭据与可运行的容器环境，不是装上即用。版本与两个被调用的 MCP 独立演进——它只是消费它们，不随其升级而升级。"


# External Capability Registry Schema (v1)
# capabilities is a mapping keyed by capability identifier (map key == name).
#
# SCOPE POLICY: this Store accepts STORE-MANAGED capabilities ONLY — i.e. code
# the Store itself hosts and maintains. Third-party capabilities whose code
# lives elsewhere (pure external connectors / APIs) are NOT registered here.
# If that policy ever changes, the schema must be extended with an explicit
# hosting declaration rather than by inferring intent from a missing field.
#
# Required fields per entry:
#   name           == map key, lowercase kebab-case
#   provider       the party that PROVIDES THE UNDERLYING SERVICE this capability
#                  depends on — the side whose rules bound what it can do.
#                  Third-party platform (feishu / wechat), or the Store owner
#                  (lyrawang) when the capability is self-built and its boundary
#                  comes from our own design rather than a platform's API.
#                  NOT a maintainer field: the SCOPE POLICY above means every
#                  registered capability has the same maintainer, so such a field
#                  would be constant and carry no information.
#                  Full definition: external-capabilities/README.md → Provider Semantics.
#                  lowercase kebab-case.
#   type           one of allowed_types
#   status         one of allowed_statuses
#   provider_path  external-capabilities/providers/<provider>/README.md (must exist)
#   version          semantic X.Y.Z — the Store-recommended version (see VERSIONING.md)
#   implementation_path  relative repo path to the Store-managed implementation,
#                        e.g. external-capabilities/mcp/<capability-name>/
#                        REQUIRED: the path must exist, must be relative with no
#                        ../, and must live under external-capabilities/.
#
# Why implementation_path and version are required rather than optional: while
# they were optional, an entry that simply omitted implementation_path skipped
# every implementation check and still reported a clean run, pointing at no code
# at all — a silent failure. Requiring them removes the ambiguity; a missing
# field is now an error instead of a different-but-valid shape.
#
# Optional (when known):
#   auth           authentication model — metadata only, NEVER secret values
#   capabilities   what the capability can do
#   permissions    required / verified permissions only
#   notes          free-form notes
#
# No fictional providers or capabilities are registered in this skeleton.
#
# Documentation example (NOT registered — for contract illustration only).
# Deliberately uses neutral placeholder names: a live capability must never
# double as the "not registered" illustration, or the comment becomes false.
#   capabilities:
#     example-capability:
#       name: example-capability
#       provider: example-provider
#       type: mcp
#       status: limited
#       version: 0.1.0
#       implementation_path: external-capabilities/mcp/example-capability
#       provider_path: external-capabilities/providers/example-provider/README.md
