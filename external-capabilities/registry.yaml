    notes: "自研、Store-managed。全新资产，首次提交即其第一份历史。产品定位：AI 金句/素材收录器——现有剪藏工具只覆盖网页，收不了 ChatGPT/Codex/豆包工作这类对话；本工具跨 App 通用。快捷键实现随包分发 Swift 源码、由 `hotkey install` 在本机用 swiftc 编译并按 LaunchAgent 常驻，避免分发预编译 App 的签名问题。0.1.0 仅收录（原文 + 时间 + 来源）；改写（公众号风/小红书风）、按日期分节、MCP 形态（供 Codex/豆包工作 agent 调用）为后续版本。0.1.1：快捷键字母可配置（`hotkey install --key <a-z>`，默认 ⌃⌥Z），热键码由配置文件读取，换字母不用改代码。0.1.2：抓取选区改为三级兜底——AXSelectedText → 模拟 ⌘C（带重试）→ 手动复制的内容；二进制按源码哈希缓存，源码没变不再重编译（避免重新编译导致 macOS 辅助功能授权失效）；未授权时只提示一次并打开设置页；调 lark-cli 时补全 PATH、init 时把 larkCli 解析成绝对路径（launchd 窄 PATH 下也能用）。0.1.3：加 --capture-once 无界面抓取模式与 logs/capture.log 日志（记录前台应用、AX 读取结果、复制重试），用于定位个别应用抓不到选区的问题。0.2.0：快捷键默认改由 Hammerspoon（免费开源、Apple 公证签名）实现——写入 ~/.hammerspoon/ai-quote-clip.lua 并在 init.lua 中引用，避免自研 app 因未签名导致辅助功能授权反复作废；自研 App 保留为 --mode app 备用；只绑一个快捷键（默认 ⌃⌥Z），读取选区前先清空剪贴板、事后还原，不会收录旧剪贴板内容。实测 DSH / Codex / 豆包工作三处均可用。0.2.1：status 命令显示 Hammerspoon/自研 App 两种模式与当前快捷键，便于排查。0.2.2 只改 LICENSE 版权行：统一为 Copyright (c) 2026 Lyra Wang（与仓库根 LICENSE、npm 维护者账号一致）；无代码改动。"
