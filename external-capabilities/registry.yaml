    auth: "无凭据。无 Host 路由、无网络请求、无子进程、无文件系统访问；全部逻辑在客户端只读渲染"
    capabilities: "把对话里 ```dsh-diagram 代码块渲染成结构化卡片图：layered（分层架构：任务 → 分组容器 → 等宽能力卡片网格 → 结果）与 flow（流程：起止胶囊 + 编号步骤 + 回环）。JSON 是唯一事实源，代码块保留在消息里（隐藏），删插件即退回原样。文字用 textContent 写入、可选中可搜索；深/浅色按宿主 body 背景亮度自动适配"
