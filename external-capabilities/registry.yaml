# External Capability Domain Registry
# Source of Truth for: external capability identity / provider / type / availability / auth model / permission model / capabilities / version / implementation
schema_version: 1

domain: external_capabilities
description: External capability identity, provider, type, availability, auth model, permission model, capabilities, version, implementation.

allowed_types:
  - plugin
  - mcp
  - connector
  - cli
  - external-api
  - integration

allowed_statuses:
  - available
  - limited
  - disabled
  - unknown
  - archived

capabilities:
  wechat-draft-mcp:
    name: wechat-draft-mcp
    provider: wechat
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/wechat/README.md
    version: 0.3.3
    implementation_path: external-capabilities/mcp/wechat-draft-mcp
    auth: "宿主注入环境变量 WECHAT_APP_ID / WECHAT_APP_SECRET，用于换取 access_token；调用方出口 IP 必须加入公众号 IP 白名单"
    capabilities: "把磁盘上的文章文件夹创建或**原地更新**为微信草稿：上传前预检、创建/更新草稿、按 media_id 读回核对；另提供受控的删除能力（草稿/永久素材/已发布文章），默认关闭，需宿主显式开启 WECHAT_ALLOW_DESTRUCTIVE=1 并二次确认。**正式发布与群发永不由本能力执行**"
    permissions: "需要公众号的草稿箱、永久素材与发布接口权限：draft/add、draft/get、draft/update、draft/delete、draft/count、media/uploadimg、material/add_material、material/del_material、freepublish/getarticle、freepublish/delete，并需将出口 IP 加入白名单；未认证个人订阅号实测可用。破坏性接口默认关闭，开启后每条删除都会先本地备份并写入审计"
    notes: "自研、Store-managed。**同步模式：以 Store 为唯一准据（canonical）。本目录是唯一副本。**独立源仓库 `~/Documents/workplace/wechat-draft-mcp` 已于 2026-10-18 退休（代码、测试与文档全部并入本目录，历史经 git subtree 保留）。0.3.0 起：9 个 MCP 工具 + 9 条 CLI 命令，覆盖创建/更新/受控删除；自动化测试数量以 `npm test` 实际输出为准，本文件不记数字 0.3.1 补上 package.json 的 repository 字段（此前 npm 页面上没有源码链接，`npm repo` 直接报 no repository）。"

  teaming-mcp:
    name: teaming-mcp
    provider: lyrawang
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.2.0
    implementation_path: external-capabilities/mcp/teaming-mcp
    auth: "两层，均只记录元数据。(1) 宿主 → MCP：stdio，无认证，进程由宿主在本机以 command+args 拉起；(2) MCP → teaming-bot 服务器：Bearer 宿主凭证，由 `teaming setup --code <接入码>` 兑换，服务端只存 SHA-256 且可单独吊销。**0.2.0 起不再需要本机大模型凭证**——分析由服务器完成，MCP 只上传逐字稿、拿回分析结果。**取飞书数据不经 MCP**——由宿主自己的飞书能力完成，所以主路径下 MCP 不需要飞书授权"
    capabilities: "对一场会议做团队动力分析并交付报告：接收【调用方提供的】逐字稿，产出四部分报告（团队状态定位／互动概览／未完成的对话与非共识／给领导者的建议），自动上传服务器换取带图表的网页报告页；另有列出可分析会议、读取已有报告、推送飞书交互卡片、运行诊断、查询任务状态等。共 8 个 MCP 工具"
    permissions: "已验证：分析并上传报告需 teaming-bot 签发的宿主凭证。**本机大模型凭证已不再需要**（0.2.0 起分析改由服务器完成）。飞书权限**非必需**：主路径下逐字稿由宿主取（豆包工作实测走其内置飞书应用），MCP 不接触飞书；仅 teaming_list_meetings / teaming_analyze_meeting / teaming_push_report 这几个走本机 lark-cli 的工具需要已授权的 profile，涉及妙记读取与消息发送"
    notes: "自研、Store-managed。**同步模式：以 Store 为唯一准据（canonical）。本目录是唯一副本。**独立源仓库 `~/Documents/workplace/teaming-mcp` 已于 2026-10-18 退休删除（删除前已把 HANDOFF.md 备份到 `~/Desktop/teaming-mcp-HANDOFF-备份.md`）。历史沿革（2026-10-18 逐提交核对得出，勿再凭印象推断）：0.1.0 用 `git subtree add` 从独立源仓库导入，锚点 650fb40；0.1.1 / 0.1.2 / 0.1.3 继续用 `git subtree pull`——远程是本机绝对路径，所以只在那台机器上可用——这三次的提交在 Store 历史里**可达**；只有 0.2.0 那次改成手工复制文件，因此 0.2.0 的改动提交（1bce754）没有进入 Store 历史，锚点停在 0.1.0。★ 一个曾经写错、现已证伪的说法：`git subtree pull` **不会**冲突——2026-10-18 在本机路径上实测零冲突合并成功（合进来的正是 4 个 tests 文件）。所以当初改用「以 Store 为准」不是因为在冲突，而是因为上游只是本机一个文件夹、换台机器就断；现在源仓库已删除，subtree 更无上游可用。安装：npm i -g teaming-mcp 后执行 teaming setup --code <接入码>。0.2.0 起不再 vendored 分析引擎、也没有构建步骤：装上即可运行，分析由 teaming-bot 服务器完成（POST /api/host/v1/analyze）。共 8 个 MCP 工具。Skill 已独立为 Store 的 skills/teaming-meeting-analysis，不再随本包分发。⚠️ 已知快照缺陷：tag `teaming-mcp-v0.2.0` 指向的提交里，`tests/cli-entry.test.mjs`、`tests/config.test.mjs`、`tests/packaging.test.mjs` 三个文件仍是 0.1.x 版本（该次镜像同步漏了它们），该快照内 `npm test` 会红。内容已在后续提交修正；按 VERSIONING.md §6，tag 指向的提交不可改写，故不重打 tag。需要可复现构建时请取 npm 上的 0.2.0，或用修正之后的 main。"

  feishu-cli-mcp-server:
    name: feishu-cli-mcp-server
    provider: feishu
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/feishu/README.md
    version: 0.1.0
    implementation_path: external-capabilities/mcp/feishu-cli-mcp-server
    auth: "两层认证。(1) 客户端到 MCP 服务：Auth0 签发的 RS256 access token（OAuth 2.1），scope 为 docs:read / docs:write / base:read / base:write，服务端按工具二次校验；(2) MCP 服务到飞书：复用部署机上已认证的 lark-cli profile，凭据存放在 lark-cli 自己的凭据库里，从不通过 MCP 参数传入或返回"
    capabilities: "把飞书云文档与多维表格的受控操作暴露为 MCP 工具：文档读取 / 创建 / 更新，Base 创建 / 建字段 / 解析链接 / 列 block / 列记录 / 批量建记录 / 批量改记录"
    permissions: "飞书侧需要 docs 与 base 两个资源域的读写授权（以 lark-cli profile 实际授权为准）；MCP 侧按工具分别要求 docs:read、docs:write、base:read、base:write。写操作另需 confirm=true"
    notes: "自研、Store-managed。来源仓库为独立 git 仓库，已通过 git subtree 导入并保留完整提交历史。status 取 limited：需要 lark-cli 1.0.93+ 与一个已认证的 profile，远端模式还需 Auth0 + HTTPS，并非装上即用。包内 .agents/skills/feishu-mcp-tool-extension/ 为开发资料，不在 Store Skill 域登记。不经 npm 分发：它是自托管 HTTP 服务（nginx + pm2 + OAuth），没有 bin，deploy/ 含生产基础设施标识 —— 见 PUBLISHING.md §D"

  image-ocr:
    name: image-ocr
    provider: lyrawang
    type: plugin
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.2.1
    implementation_path: external-capabilities/plugin/dsh/image-ocr
    auth: "无凭据入仓，不需要任何账号或 API Key。OCR 完全本地（macOS Vision），图片不出本机"
    capabilities: "DSH 输入框左侧「＋ 识图」按钮：读取剪贴板里的截图，用本地 Vision 引擎识别中英文字，把文字插入草稿（可撤销、不自动发送）。宿主侧注册同源只读路由 `/plugins/image-ocr/ocr`，并带一份 Swift 源码在首次使用时编译缓存"
    permissions: "需要 macOS 13+ 与 Xcode Command Line Tools（xcrun swiftc）。宿主进程读取剪贴板图片；不读屏幕、不联网"
    notes: "自研、Store-managed。0.1.0 首次登记：client 注册在 `conversation.input.left`（order=3，紧邻 feishu-ref 的「＋ 引用」）；插入走 `inputActions.captureInsertion()` + `insertText()`。OCR 引擎编译缓存在仓库外（~/Library/Application Support/dsh-image-ocr/ocr），首次点击可能等 30–60s，apply 时会后台预热。实测：整屏截图 53 行，冷启动 31s（编译+模型初始化），热启动 0.66s；中文长句识别良好，UI 图标会带来少量短符号噪声"
  feishu-ref:
    name: feishu-ref
    provider: lyrawang
    type: plugin
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.3.0
    implementation_path: external-capabilities/plugin/dsh/feishu-ref
    auth: "无凭据入仓。复用操作者本机已认证的 lark-cli（用户身份）做只读搜索；插件不接收、不保存任何 token 或账号信息"
    capabilities: "DSH 输入框左侧新增「＋ 引用」按钮：点击弹出面板，搜索飞书文档 / 多维表格 / 表格 / 知识库（留空看最近 30 天编辑），选中后把 Markdown 链接插入草稿（可撤销、不自动发送）。宿主侧只注册一个同源只读路由 `/plugins/feishu-ref/search`（POST），转发给 `lark-cli drive +search`"
    permissions: "需要操作者本机安装并登录 lark-cli（用户身份，具备文档可见权限）；按钮与链接插入本身不需要额外权限。宿主侧不开放外部网络监听"
    notes: "自研、Store-managed。0.1.0 首次登记：client 注册在 `conversation.input.left` 槽位（compact controls at the left of the composer tool row），order=2；插入走 `inputActions.captureInsertion()` + `insertText()`，属普通可撤销文本编辑。与 selection-toolbar 共用 DSH 的同源鉴权方式（`connection.requestRejection`）。搜索上限 30 字符（飞书 Search v2 限制），面板最多展示 12 条。理由说明：为什么不用系统「＋」菜单——菜单项是命令（host command），无法直接往输入框写文本，需要额外命令↔UI 桥接；自建按钮路径最短且失败可降级为复制链接"
  selection-toolbar:
    name: selection-toolbar
    provider: lyrawang
    type: plugin
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.7.1
    implementation_path: external-capabilities/plugin/dsh/selection-toolbar
    auth: "无凭据入仓。写飞书文档复用操作者本机已认证的 lark-cli profile（用户身份）；目标文档 token 与 lark-cli 路径存放在仓库外的 `~/.dsh/selection-toolbar.json`（600 权限），可用环境变量 `DSH_SELECTION_TOOLBAR_CONFIG` 覆盖配置路径。插件自身不接收、不保存、不记录任何凭据值"
    capabilities: "DSH 对话内的选区工具条：鼠标划选文字后浮出 复制 / 追问 / 注释 三个动作。复制=写入剪贴板；追问=把选中文字插入 DSH 输入框（不自动发送）；注释=把「原文引用 + 注释 + 北京时间」追加到配置指定的飞书文档末尾，并在本机 localStorage 留一份离线副本"
    permissions: "需要操作者本机安装并授权 lark-cli（用户身份，具备目标文档的编辑权限）以完成飞书写入；复制与追问不需要任何额外权限。宿主侧仅注册一个同源本地接口 `/plugins/selection-toolbar/note`（POST），不开放外部网络监听"
    notes: "自研、Store-managed。首次登记：全新资产，从未进过版本控制，首次提交即其第一份历史（按 first-publish §0 ② 直接复制）。依赖 DSH 桌面端（提供 `shell.overlay` 槽位与插件安装与管理器）与 lark-cli 1.0.x；未配置 docToken 时注释只写本地并在界面回显原因。status 取 limited：不是装上即用，需按 README 创建一次操作者配置并重启 DSH。0.2.0 起可经 npm 分发：公开包名 `@lyra_wang/dsh-selection-toolbar`（0.2.0 与注册表版本一致），消费者在 DSH 插件页输入包名即可安装；npm 上的 `dsh-selection-toolbar`（无 scope）已被第三方占用，故使用作者 scope。0.2.0 同时把包名从开发期 `@local/selection-toolbar` 改为公开包名，并同步 client loader id（改名属破坏性变更，故 minor +1）。2026-10-19 实测证据：宿主路由 `GET /plugins/selection-toolbar/note` 返回 405（已加载）；飞书文档 revision 5 → 6 → 7 各追加一条；时间戳由 `<sub>` 改为纯文本北京时间后显示为 `时间：2026/10/19 02:11`。0.2.1（补丁）：把 `client.js` 的 locale 命名空间常量从遗留的 `@local/selection-toolbar` 统一为公开包名（此前 register/bind 用同一个值所以功能一直正常，属改名未清干净的痕迹；locale 注册只在进程内存在，修改不丢任何数据）；并在插件目录新增 `.gitignore`（`selection-toolbar.json` / `*.local.json` / `.env*` / `node_modules/`），防止任何人把含文档 token 的测试配置误提交——配置文件本身仍在仓库外的 `~/.dsh/selection-toolbar.json`。0.2.2（补丁）：`locale/zh.json` 与 `locale/en.json` 的 meta 描述仍写着已删除的「朗读 / read aloud」，插件页因此显示「复制 / 朗读 / 追问 / 注释」；本次改为「复制 / 追问 / 注释」，并同步修正英文描述。0.3.0（minor）：新增第 4 个动作「改写」——选中一段文字后可指定要求（润色 / 更简洁 / 小红书风 / 公众号风 / 自定义），宿主侧新增 `POST /plugins/selection-toolbar/rewrite`，用配置的模型（默认 deepseek-flash，OpenAI 兼容端点）只重写该段，结果可复制或插入输入框；API Key 从环境变量或系统钥匙串读取，不随包分发。为避免与「注释」冲突，改写结果第一版不直接替换只读消息的 DOM（留作后续）。0.3.1（补丁）：修复改写面板点击即消失——「点击面板外关闭」的判定只认工具条与注释面板，漏掉了改写面板的类名，导致点「小红书风」等按钮被当成点击外部而关闭面板；现补上 `-rw` 类名。"

  command-sync:
    name: command-sync
    provider: lyrawang
    type: cli
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.1.6
    implementation_path: external-capabilities/cli/command-sync
    auth: "无凭据入仓。配置放 `~/.command-sync/config.json`（600）：history 路径、sshHost/sshUser、serverPaths；运行数据（历史快照、文档、报告）也都在 `~/.command-sync/`。仓库内只有 config.example.json 模板"
    capabilities: "把终端里手动输入的命令做成快捷键面板：Hammerspoon 绑定 ⌥X → 两块候选（服务器入口 3 条 / 最近 7 天用得最多的 5 条本地命令）→ 选中复制到剪贴板。只读 zsh 历史，不执行任何命令"
    permissions: "需要 Python3（系统自带）与 Hammerspoon（免费开源、Apple 公证签名）作为面板宿主；Hammerspoon 需要一次性「辅助功能」授权。面板只读本机 zsh 历史；服务器入口只是生成 ssh 命令文本，不主动连接"
    notes: "自研、Store-managed。从 `~/command-sync` 迁入 Store 并参数化：脚本装到 `~/.command-sync/bin/`，数据与配置留在 `~/.command-sync/`，仓库不含任何个人主机/路径。面板只复制不执行（npm publish/ssh 等需人工确认）。数据源只含用户手动输入的命令，不含 AI 执行的命令。历史准确性依赖 zsh 的 INC_APPEND_HISTORY + EXTENDED_HISTORY（README 有说明）。0.1.3：移除月度巡检脚本（scan.py/run-check.sh）——巡检由另一个项目负责，本资产只做命令面板。"
  chrome-frequent-pages:
    name: chrome-frequent-pages
    provider: lyrawang
    type: cli
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.4.0
    implementation_path: external-capabilities/cli/chrome-frequent-pages
    auth: "无凭据入仓。配置放 `~/.config/chrome-frequent-pages/config.json`（Chrome profile 路径、统计窗口、目标飞书表坐标）；飞书写入复用本机已认证的 lark-cli（用户身份）"
    capabilities: "读 Chrome History（复制到临时目录避免锁），按「域名 + 路径」归一化聚合访问次数，过滤登录页/搜索页/本地地址，把高频页面写进飞书「常用网页」表（URL 去重、已存在则更新次数），并可导出可导入 Chrome 的书签 HTML。实测 90 天窗口 60 条：飞书 Base 顶置表 4601 次、爱壹帆 264 次、飞书开放平台开发者后台 244 次"
    permissions: "读取本机 Chrome profile 目录（History 只读副本）；写飞书表需要 lark-cli 用户身份且有该 Base 编辑权限。不访问外网、不改 Chrome 书签文件"
    notes: "自研、Store-managed。0.1.0 首次登记。设计取舍：不做「直接改 Bookmarks JSON」——Chrome 运行时会覆盖，写坏会丢全部书签；改为生成 Netscape 书签 HTML 由用户手动导入，并提供备份命令。归一化按飞书 `/base/<token>`、`/wiki/<token>` 聚合，避免同一张表因 query 不同被拆成十几条（实测发生过）。可选 install.sh 注册每周一 09:30 launchd 任务。"
  ai-quote-clip:
    name: ai-quote-clip
    provider: lyrawang
    type: cli
    status: limited
    provider_path: external-capabilities/providers/lyrawang/README.md
    version: 0.2.1
    implementation_path: external-capabilities/cli/ai-quote-clip
    auth: "无凭据入仓。飞书写入复用操作者本机 lark-cli 的 user 令牌（凭据在 lark-cli 自己的凭据库）；目标文档 token 存在 `~/.ai-quote-clip/config.json`（600），快捷方式配置 `hotkey.json` 只记录 node 与 CLI 路径。包内不含任何密钥"
    capabilities: "把任意 App 里选中的文字（尤其 AI 对话里值得留的表达）一键追加到指定飞书文档：CLI 支持 stdin/参数/剪贴板三种输入；macOS 全局快捷键 ⌃⌥S 自动复制选区并写入。`init` 引导选择文档并校验可读，`doc set` 可切换目标，格式为「引用块 + 收录时间 + 可选来源 + 分隔线」"
    permissions: "需要本机 lark-cli 已授权（docs 域）且对目标文档有编辑权限；macOS 快捷键需要「辅助功能」权限（模拟 ⌘C 读取选区），可随时在系统设置撤销。CLI 本身跨平台，只有快捷键安装限 macOS"
    notes: "自研、Store-managed。全新资产，首次提交即其第一份历史。产品定位：AI 金句/素材收录器——现有剪藏工具只覆盖网页，收不了 ChatGPT/Codex/豆包工作这类对话；本工具跨 App 通用。快捷键实现随包分发 Swift 源码、由 `hotkey install` 在本机用 swiftc 编译并按 LaunchAgent 常驻，避免分发预编译 App 的签名问题。0.1.0 仅收录（原文 + 时间 + 来源）；改写（公众号风/小红书风）、按日期分节、MCP 形态（供 Codex/豆包工作 agent 调用）为后续版本。0.1.1：快捷键字母可配置（`hotkey install --key <a-z>`，默认 ⌃⌥Z），热键码由配置文件读取，换字母不用改代码。0.1.2：抓取选区改为三级兜底——AXSelectedText → 模拟 ⌘C（带重试）→ 手动复制的内容；二进制按源码哈希缓存，源码没变不再重编译（避免重新编译导致 macOS 辅助功能授权失效）；未授权时只提示一次并打开设置页；调 lark-cli 时补全 PATH、init 时把 larkCli 解析成绝对路径（launchd 窄 PATH 下也能用）。0.1.3：加 --capture-once 无界面抓取模式与 logs/capture.log 日志（记录前台应用、AX 读取结果、复制重试），用于定位个别应用抓不到选区的问题。0.2.0：快捷键默认改由 Hammerspoon（免费开源、Apple 公证签名）实现——写入 ~/.hammerspoon/ai-quote-clip.lua 并在 init.lua 中引用，避免自研 app 因未签名导致辅助功能授权反复作废；自研 App 保留为 --mode app 备用；只绑一个快捷键（默认 ⌃⌥Z），读取选区前先清空剪贴板、事后还原，不会收录旧剪贴板内容。实测 DSH / Codex / 豆包工作三处均可用。0.2.1：status 命令显示 Hammerspoon/自研 App 两种模式与当前快捷键，便于排查。"
