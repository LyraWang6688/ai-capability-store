    permissions: "无需外部权限或凭据。界面侧只在点击时读一次 .xterm-rows，不注入输入、不改终端；Host 只在内存里保留该会话最近一次发送的内容，不落盘。隐私边界：点发送后那 20 行会进入模型请求与本地会话日志，终端里若有 token 需自行留意"
    commerce: {charge: free}
    notes: "自研、Store-managed。走的是「看屏幕」而不是接口：三条接口路线实测全不通——terminals.read 的服务在当前 profile 未注册；terminalController.retain 只返回一个 {type:'retained'} 控制帧、不含内容；terminalController.attach 报 'Terminal attachment requires a Remote invocation'，Host 插件无权调用。界面侧 ctx 上只有 fiber，服务不是属性访问，服务名也拿不到，所以最终读 xterm 渲染出的 DOM 文本。代价：只有当前可见一屏（≤60 行），滚动缓冲读不到；依赖 .xterm-rows 类名，xterm 大改版会失效，失效表现是「没数据」而不是报错。inject 刻意留空：0.1.0 声明了 inject:['terminalController'] 而客户端没有该服务名，入口永久 pending 导致 web boot 失败、整个 DSH 起不来；不声明依赖后最坏情况只是插件无反应。0.3.0 已在作者本机实测：读取到终端 ls 输出与提示符；已发布 npm @lyra_wang/dsh-terminal-context@0.3.0（public）。未覆盖：其它 profile / 其它机器、xterm 升级后的类名变化、长会话压力，故取 limited。0.4.0 补记一条结构限制：右侧「浏览器 tab」的正文读不到——它由 @deepseek-ai/dsh-client-ui-sidebar-browser 渲染成 iframe(Web) / Electron webview(Desktop)，是独立浏览上下文且官方不向内容注入任何能力，父页面既 querySelectorAll 不进去也收不到 selectionchange；0.4.0 诊断实测全页面只命中左栏会话列表 PIRFFq_sidebarCol、浏览器正文 0 命中。能拿到的只有 tab 的 URL 与标题，正文需由 Agent 自取（web_fetch / 浏览器 MCP）或另建同源代理。0.4.1 只补文档、许可与元数据：README 新增「安装」章节（6 个插件里此前只有它没有），补 MIT LICENSE 文件（其余 5 个都有，版权行统一为 Copyright (c) 2026 Lyra Wang），package.json 补 publishConfig.access=public 与 engines.node>=20；无代码改动。0.5.0（minor，新增能力）把「看屏幕」升级为「常驻上下文 + 报错唤醒」：① Host 注册 systemPrompt.context（order=130，interpolate=false），每个 step 求值，内容取该会话最近一屏的最后 20 行 + 年龄，超过 45 秒不注入；界面侧新增一个 session 作用域的零 UI slot 探针（conversation.input.left，order=99）拿 sessionId 一起推，Host 按会话分桶，拿不到 sessionId 时退化为「最近一次推送」。② 每次推送后挂 1.2 秒静默计时器，屏幕稳定后扫末几行报错特征（error / npm ERR! / Traceback / command not found / EACCES / fatal / panic / 等符号）；命中且该错误行文本未报过、且距上次唤醒超过 20 秒时：Agent 空闲走 followup() 唤醒，忙时走 inject() 落到下一 step；插件首屏里已存在的旧报错不报。上报消息自称「终端自动上报 · 不是用户输入」，并要求模型只重发从失败点开始的剩余步骤。③ 工具 read_terminal_context 改为按会话读、不再承诺 cwd（0.4.x 的 client 从未发送 terminalId/cwd，该字段恒为空，属缺陷已去除）。④ systemPrompt / agents 用 ctx.get() 可选访问，缺失时降级为 0.4.x 行为，不重蹈 0.1.0 的 pending 事故；webServer 仍无 connection.requestRejection 鉴权，与 image-ocr 不一致，待后续统一。未验证：slot 拿 sessionId 是否稳定、裸 UserMessage（自建 id/content/source，未用 @deepseek-ai/dsh-llm 的 createUserMessage，因第三方插件解析不到该包）是否被会话 schema 接受、静默计时器在长输出下的误报率。0.5.1（minor，按用户要求补共享开关与多信号）：① 输入框左侧新增「● 共享终端 / ○ 共享终端」开关（conversation.input.left，order=6，此前的零 UI session 探针合并进这个按钮——按钮自身的 props 提供 sessionId）。默认**不共享**，偏好存 localStorage；关掉时立刻推 share:false，Host 侧清空该会话屏幕、取消静默/卡住计时器，注入与工具都返回空/off。② 触发信号从「仅报错」扩到 5 种，每种独立文案与要求：error（判失败、只重发剩余步骤）、awaiting-input（终端停在 y/N、Password: 等，告诉用户填什么）、interactive（vim/less/ssh/REPL 等，别按普通 shell 给命令）、stuck（30 秒无变化且提示符未返回，判正常等待还是卡死）、success（提示符返回且无报错）。success 只更新上下文**不唤醒**——批量执行顺利时保持安静，这是用户明确要的。③ 频率上限：按「命令行文本 + 信号 + 证据」去重，一条命令最多报一次；20 秒冷却。④ 保留 0.5.0 的每步上下文注入与首屏旧报错不报。未验证：stuck（需真机等 30 秒）、slot 是否真能给到 sessionId、自建 UserMessage 是否被会话 schema 接受。真机验证补记（2026-10-27，作者本机 DSH 0.2.1-rc.3）：① 首装激活失败——Host 半边精简 inject 时漏了 tools，报 cannot get property 「tools」 without inject，补回 [tools, webServer] 后 applied。② 按钮没出现——界面半边用 ctx.get('slots') 拿到的服务是 undefined；改为声明 inject: ['slots'] + ctx.slots 后，Slots.listSubTree 显示 terminal-context-share 已成为 conversation.input.left 的 active occupant。教训与 0.1.0 相反：确定存在的服务要声明，ctx.get 只用于不确定的。③ 端到端已验：向本机路由推一屏含报错的假终端内容，1.2 秒后自动上报的 UserMessage 被会话接受并进入模型上下文（会话日志可查到「终端自动上报」user/message），同时该屏出现在下一步的运行时上下文里——说明报错判定、唤醒、UserMessage 形状、上下文注入四条链路都通；随后推 share:false 已清空。仍未验证：真实点击按钮后的 sessionId 传递（standardProps 已确认含 sessionId，但未跑通点击链路）。真机验收（2026-10-27，作者本机，DSH 0.2.1-rc.3 / profile=desktop）：① 点开「● 共享终端」后，终端执行 ls /nonexistent-dir，1.2 秒后会话内自动出现「终端自动上报 · 疑似报错」的 UserMessage，内容含真实提示符 wangying@192 ai-capability-store %（说明本地/远端这类宿主状态可被模型看到），同时该屏出现在当步运行时上下文并标注 Detected state: error——证明 slot 传递 sessionId、上下文注入、报错判定、唤醒、UserMessage 被会话接受，五条链路全部通过。② 点回「○ 共享终端」后再执行失败命令，完全无上报、上下文不再出现终端屏——关闭即彻底静默的承诺通过验收。仍未验证：stuck（需真机静默 30 秒）、success 不唤醒（设计如此，未实测）、长会话下误报率。0.5.1 追加负向结论（自动打开终端不可行，作者本机实测）：① ctx.layout.openRightbar(true,false) 只能展开右侧栏，里面是空壳，不会带出终端；② remote.terminal.create(sessionId,{id,cols,rows}) 可达且返回 ok（PTY 确实创建成功），但右栏 UI 不显示它——右侧面板/标签状态由 dsh-client-ui-sidebar-right 自己的 SurfaceState store 管理，没有对外服务接口；③ 因此已移除「自动展开 + 自动 create」，避免每次检测到面板未开就留下孤儿 PTY 和让人困惑的空面板。改为：界面侧上报 panelOpen，Host 在运行时上下文里明说「共享开着但没有终端面板 → 没有终端状态可读，需要终端信息时先请用户打开右侧终端」，工具 read_terminal_context 返回 {available:false, sharing:true, panelOpen:false}。另修一个真机误报：面板未打开时屏幕为 0 行，卡住计时器仍在跑，30 秒后误报「终端 30 秒没有变化·最后 0 行」；现改为面板未开/空屏/提示符已回来都不计入卡住。0.5.1 再补一条真机缺陷（跨会话串台）：用户同时开两个会话时，B 会话收到了 A 会话的终端上报。两个原因——① host 侧 screenOf() 在目标会话没有自己的屏幕时会回退到「最近一次共享的屏幕」，于是 B 的上下文里出现 A 的终端；② 界面侧把 sessionId 存在模块级变量里、只由最近渲染的按钮 props 赋值，多会话时可能取错。修法：host 改为严格按 sessionId 取（不再跨会话回退，空 sessionId 直接返回 undefined）；界面侧优先从 DOM 的 [data-conversation-session] 读当前可见会话（官方自己也这么取），按钮 props 只作兜底。单测覆盖：A 有屏幕时 A 的上下文含终端、B 为空、只有 A 收到上报。同时按用户决定采纳 A 方案：不碰官方内部 store，接受「新会话首次需点开右侧终端」，插件只负责检测并告知。0.5.1 再修两处真机缺陷（用户同时开两个会话时暴露）：① 共享开关原本是全局的（一个 localStorage key + 模块级变量），A 会话打开后 B 会话也处于共享态，于是 B 也上报了自己的终端——改为按会话存（dsh-terminal-context:share:<sessionId>），按钮显示的是自己会话的状态，B 默认不共享。② stuck（卡住）自动上报停用：真机上「长输出结束后终端静止」与「面板刚打开时 0 行」都会在 30 秒后触发误报（截图证据：npm pack 输出静止被报成卡住），误报率高于价值；保留 error / awaiting-input / interactive 三种唤醒，stuck 不再上报。0.5.2（patch，降噪）：用户反馈「正常运行的内容也会被发进会话」。根因是运行时上下文的文本里带了整屏 20 行 + 「N 秒前更新」的年龄——DSH 每逢上下文文本变化就追加一条 durable 快照（在聊天里是一个 context 节点），于是终端持续输出时每个 step 都在往会话里写东西。修法：注入文本改为**紧凑状态**，只含「最后一条提示符行 + 分类后的状态（idle / error: 命中行 / awaiting-input / interactive）」，不含输出正文、不含年龄；同一指令运行期间屏幕刷屏时文本不变，DSH 因此不再产生新快照。完整一屏仍可通过 read_terminal_context 按需读取；真正需要正文的场景（报错上报）仍然带完整一屏，且每条命令最多一次。验证：单测 12/12；新增稳定性用例——同一提示符下输出变化时上下文文本完全相同、出现报错时才变化。追加：用户还要求「成功也要看得见」——例如 npm publish 的输出末尾 `+ @lyra...@0.3.0` 是它决定能否继续的依据。因此上下文再补「上一条已完成命令 + 其输出末尾 8 行 + 分类状态」，且只在命令完成（提示符回来）时更新；命令运行期间沿用上一条完成态，所以刷屏不产生新快照。稳定性用例：完成态文本在运行中逐字不变；下一跳完成时才更新。追加：按用户最终目标（「人不该靠复制粘贴把报错和进程喂给 AI，AI 应自主获取并继续推进」），success 也改为唤醒——报文带末尾 8 行输出 + 「不需要再复述」，并要求模型：若是多步计划中的一步就确认并给下一步，若只是用户零散命令（cd/ls）就别改计划。冷却策略拆成两条线：可执行信号（error / awaiting-input / interactive）20 秒，success 8 秒，互不占用；仍按「命令行 + 信号 + 证据」去重。0.6.0（minor，语义变更：自动 → 手动快门）：用户明确要求「什么时候发到会话里，由人通过按钮控制」。据此把 0.5.x 的持续共享、每步上下文注入、报错/成功自动唤醒**全部移除**，改为单一动作——点「⇪ 发送终端」抓当前可见最后 20 行，作为 user 消息交给该会话 Agent（空闲 followup、忙时 inject）。Host 只保留该会话最近一次发送的内容供工具读回；无定时器、无后台任务，闲置零开销。消息内附提示符行与疑似报错行，并要求模型失败时只重发剩余步骤、正常时一句确认后给下一步。验证（stub 掉 Host 服务）：发送成功且唤醒一次、报文含输出与提示符行、工具可读回、空内容被拒且不唤醒。已知限制不变：只覆盖右侧边栏终端、只读可见一屏、无退出码、不能替人开终端。"
