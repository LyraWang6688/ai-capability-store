    capabilities: "把飞书私聊任务转发到本机执行：白名单 open_id 校验、仅 p2p、高风险词先确认（回复「确认」才执行）、串行队列、超时中止（SIGTERM→SIGKILL）、结果截断回传飞书、逐任务审计 JSONL；另提供 doctor 环境体检与 launchd 开机自启（caffeinate 防休眠）。执行后端可配置：默认 `dsh headless <任务>`，可替换为任意命令"
