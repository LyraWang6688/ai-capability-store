    notes: "自研、Store-managed。从 `~/command-sync` 迁入 Store 并参数化：脚本装到 `~/.command-sync/bin/`，数据与配置留在 `~/.command-sync/`，仓库不含任何个人主机/路径。面板只复制不执行（npm publish/ssh 等需人工确认）。数据源只含用户手动输入的命令，不含 AI 执行的命令。历史准确性依赖 zsh 的 INC_APPEND_HISTORY + EXTENDED_HISTORY（README 有说明）。0.1.3：移除月度巡检脚本（scan.py/run-check.sh）——巡检由另一个项目负责，本资产只做命令面板。0.2.0：面板改三栏，新增剪贴板历史（hs.pasteboard.watcher → `~/.hammerspoon/clipboard-history.jsonl`；去重提到最前、100 条上限、单条 20k 字节截断、400 行压缩重写；带 ConcealedType 标记的粘贴板不记录）；面板改为 nonactivating + allowTextEntry，修好「打开后收不到键盘、点面板外不关闭」；⌘⏎ 复制并粘回；palette.py 缺 `~/.zsh_history` 时不再失败（首次安装可用）；补 `shortcuts.example.md` 进 npm files（0.1.7 漏了它，npm 用户右栏是空的）；install.sh 的 `\\u2713` 转义修正。另有 `command-sync doctor` 自检子命令：检查 Python3 / Hammerspoon 是否安装与运行 / 辅助功能授权（hs.accessibilityState）/ 面板文件与 init.lua 挂载 / 终端历史与剪贴板历史数据源，缺步骤时给出可执行提示，有 ✗ 时退出码 1。0.2.1：剪贴板保留条数改为可配置——`~/.command-sync/config.json` 的 `clipboardHistory.maxEntries`（默认 100，clamp 3–500；文件行数上限随之取「条数 × 4」，最少 20），改完 hs.reload 生效；README / config.example.json / install.sh 生成的默认配置同步补充该字段。0.2.2：doctor 两处修正——① 剪贴板历史改为报「去重后 N 条（文件 M 行；上限 X 条）」，因为文件是追加式、行数≠条数；② 新增可选插件检查：扫描 `~/.dsh/profiles/*/package.json` 是否装了 `@lyra_wang/dsh-selection-toolbar`（工具条「快捷键」按钮的提供方），没装给安装命令提示，自己没装 DSH 则只提示「手写 shortcuts.md 即可」。0.2.3 只改 LICENSE 版权行：统一为 Copyright (c) 2026 Lyra Wang（与仓库根 LICENSE、npm 维护者账号一致）；无代码改动。0.2.4：面板快捷键条目不再重复渲染——快捷键条目的 title 与 command 都是同一行文字，副标题只在真的不同时才画（此前每条快捷键都把同一行显示两遍）；server / recent / clip 三栏的副标题不受影响。"
