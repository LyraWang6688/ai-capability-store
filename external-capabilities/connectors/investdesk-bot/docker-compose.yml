services:
  investdesk-bot:
    build: .
    container_name: investdesk-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/app/data
    # 不需要任何入站端口：飞书长连接与 DeepSeek 都是出网
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
